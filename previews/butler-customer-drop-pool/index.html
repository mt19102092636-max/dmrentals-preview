let operationRecordState={id:'',page:1,size:100};
function getOperationRecords(id){
  const p=pool.find(item=>item.id===id);if(!p)return [];
  const type=p.line==='本管家'?'本管家':p.line==='合伙人分销'?'分销':'销售';
  const records=[{
    content:`[${p.way==='人工解绑'?'运营':'系统'}]${type}客户${p.way==='人工解绑'?'解除绑定后':'超期自动'}流入公海；${p.way==='人工解绑'?'解绑':'掉落'}原因：${p.reason}；原归属：${p.owner}；入海业务线：${p.line}；适用规则：${p.rule}；批次：${p.batch}。`,
    attachment:'-',operator:p.way==='人工解绑'?'运营管理员':'系统',time:p.time
  }];
  if(p.bound!=='待补录')records.push({content:`${p.line==='本管家'?'用户授权绑定本管家店铺':p.channel==='销售手动领取'?'公海客户领取绑定销售':'新用户扫码下单绑定分销员'}[${p.owner}]；记录本次绑定时间与规则快照。`,attachment:'-',operator:'系统',time:p.bound});
  records.push({content:`客户进入客户列表；来源渠道：${p.source}。${p.line==='待核实'?'历史归属缺失，待核实补录。':''}`,attachment:'-',operator:'系统',time:poolValue(p,'created')||'-'});
  logs.filter(log=>log.object.includes(p.id)&&!(log.time===p.time&&['规则自动掉落','销售规则掉落','人工解绑'].includes(log.action))).forEach(log=>records.push({content:`${log.action}；操作前：${log.before}；操作后：${log.after}；原因：${log.reason}。`,attachment:'-',operator:log.actor,time:log.time}));
  return records.sort((a,b)=>b.time.localeCompare(a.time));
}
function showHistory(id){operationRecordState={id,page:1,size:100};renderOperationRecords()}
function renderOperationRecords(){
  const state=operationRecordState,records=getOperationRecords(state.id),pages=Math.max(1,Math.ceil(records.length/state.size));state.page=Math.min(pages,Math.max(1,state.page));
  const rows=records.slice((state.page-1)*state.size,state.page*state.size);
  document.getElementById('overlay').innerHTML=`<div class="mask operation-record-mask"><section class="operation-record-modal" role="dialog" aria-modal="true" aria-label="操作记录"><div class="drawer-head"><h2>操作记录</h2><button class="close" aria-label="关闭操作记录" onclick="closeDrawer()">×</button></div><div class="operation-record-body"><div class="table-wrap"><table class="operation-record-table"><colgroup><col style="width:42%"><col style="width:15%"><col style="width:18%"><col style="width:25%"></colgroup><thead><tr><th>备注内容</th><th>附件</th><th>操作人</th><th>操作时间</th></tr></thead><tbody>${rows.map(record=>`<tr><td>${e(record.content)}</td><td>${e(record.attachment)}</td><td>${e(record.operator)}</td><td>${e(record.time)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无操作记录</td></tr>'}</tbody></table></div></div><div class="operation-record-pager"><span>Total ${records.length}</span><select aria-label="每页条数" onchange="setRecordPageSize(this.value)">${[10,20,50,100].map(size=>`<option value="${size}" ${state.size===size?'selected':''}>${size} /页</option>`).join('')}</select><button aria-label="上一页" ${state.page===1?'disabled':''} onclick="setRecordPage(${state.page-1})">‹</button>${Array.from({length:Math.min(5,pages)},(_,i)=>Math.min(Math.max(1,state.page-2),Math.max(1,pages-4))+i).map(n=>`<button class="${state.page===n?'active':''}" aria-label="第${n}页" aria-current="${state.page===n?'page':'false'}" onclick="setRecordPage(${n})">${n}</button>`).join('')}<button aria-label="下一页" ${state.page===pages?'disabled':''} onclick="setRecordPage(${state.page+1})">›</button><span>前往</span><input type="number" aria-label="前往页码" min="1" max="${pages}" value="${state.page}" onchange="setRecordPage(this.value)" onkeydown="if(event.key==='Enter')setRecordPage(this.value)"><span>页</span></div></section></div>`;
}
function setRecordPage(value){
  const n=Number(value),pages=Math.max(1,Math.ceil(getOperationRecords(operationRecordState.id).length/operationRecordState.size));if(!Number.isInteger(n)||n<1||n>pages){toast(`请输入1～${pages}之间的页码`);return}operationRecordState.page=n;renderOperationRecords();
}
function setRecordPageSize(value){
  const size=Number(value);if(![10,20,50,100].includes(size))return;operationRecordState.size=size;operationRecordState.page=1;renderOperationRecords();
}

function doRebind(id){const p=pool.find(x=>x.id===id),reason=document.getElementById('rebindReason').value.trim();if(!reason)return toast('请填写重新绑定原因');if(p.current!=='公海')return toast('提交失败：客户归属已变化');p.current=p.owner;const c=customers.find(x=>x.id===id);if(c){c.status='正常';c.bound=now();c.unbound='—';c.custom=null;c.snapshotDays=p.line==='本管家'?stores[0].days:45}logs.unshift({time:now(),action:'客户重新绑定',object:p.name+'（'+id+'）',before:'平台公海',after:p.owner,reason,actor:'运营管理员'});closeDrawer();render();toast('已重新绑定，按新绑定时间重新计算核验日')}
function csv(name,headers,rows){const safe=v=>{const s=String(v??'');return '"'+(/^[=+@\-]/.test(s)?"'":'')+s.replaceAll('"','""')+'"'};const content='\ufeff'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8;'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function renderSpec(){document.getElementById('content').innerHTML=`<article class="doc"><div class="doc-top"><div><h1>本管家客户掉落与公海归属区分</h1><p class="muted">一期增补需求 · 产品评审版 · 2026-11-03</p></div>${btn('打印 / 保存 PDF','window.print()')}</div><div class="tip">目标：将本管家客户纳入现有分销掉落机制，由运营在店铺入口维护规则；公海按每次入海前的归属业务线区分客户。</div><h2>1. 本期范围与入口</h2><table><tr><th>页面</th><th>本期新增能力</th></tr><tr><td>运营后台 / 本管家店铺列表</td><td>复用已开发的本管家店铺列表组件，保留店铺信息、分销配置、销售经理比例、销售比例、服务费率、操作六列；仅在原操作列新增查看客户和配置统一掉落规则。外层增加用户手机号（与管理员手机号独立），支持完整11位手机号或后4位；按店铺客户授权记录检索，含已解除关系，不代表当前仍归属该店铺。查询只显示命中店铺，多店命中返回多店；点击查看客户自动带入手机号，仅展示匹配客户。无命中展示空结果，重置清除用户手机号。原快捷登录、修改、升级销售经理入口保留。</td></tr><tr><td>店铺 / 查看客户</td><td>复用已开发的查看客户弹层；筛选为授权手机号、归属销售、授权时间。保留Id、用户昵称、归属销售、用户来源、授权手机号、授权时间、预计掉落日期、解除绑定时间、操作九列，行操作打开既有掉落专属规则表单。</td></tr><tr><td>CRM / 公海客户列表</td><td>保留现网全部10项筛选及状态信息、企业信息、客户信息、交易信息、操作五组结构；新增全部、内部销售、本管家、合伙人分销、待核实业务线Tab，并显示数量；与入海业务线筛选双向同步。新增入海业务线、入海方式、入海时间3项筛选，查询与导出遵循当前Tab。新增状态、归属及规则字段嵌入原分组，保留领取额度和原操作。</td></tr><tr><td>客户操作记录</td><td>统一记录进入系统、绑定、规则变化、订单等待、自动掉落、人工解绑、领取、重新绑定；可跨客户列表与公海查询。</td></tr></table><h2>2. 生效规则与核验</h2><p>优先级：客户专属 ＞ 本管家店铺统一 ＞ 系统默认 45 天。绑定成功记录绑定时间、归属对象、规则快照；首次核验日＝本次绑定时间＋生效周期。核验订单限当前归属周期内、当前绑定人名下的该客户订单。</p><table><tr><th>订单核验结果</th><th>处理</th><th>日期展示</th></tr><tr><td>无订单 / 只有取消或无效关闭订单</td><td>解除当前绑定，流入公海</td><td>保留实际掉落时间</td></tr><tr><td>有未明确的非取消订单</td><td>进入订单待明确；监听或定时核验，不设固定延期</td><td>订单待明确（无固定下一掉落日）</td></tr><tr><td>任一有效订单完结</td><td>保持绑定并结束本次掉落判断；优先于其他进行中订单</td><td>已转化保护</td></tr><tr><td>等待期间所有订单最终取消</td><td>复核无其他有效订单后掉落</td><td>实际掉落时间</td></tr></table><p>已取消、已关闭、全额退款且未履约不形成有效转化。订单状态需由研发映射平台实际枚举；有完结有效订单时保留优先。掉落只改变当前归属，历史订单、跟进、佣金与业绩事实保留。</p><h2>3. 复用组件与统一配置生效策略</h2><p>按业务指定的已开发组件复用：店铺列表、查看客户弹层、统一掉落规则表单、客户专属规则表单。统一规则表单保留掉落周期、调整原因、处理说明和取消/确定；客户表单增加客户专属周期开关。前端不新建配置工作台，不增加生效范围控件。</p><p>统一规则适用于本店铺新绑定客户，以及未配置专属周期的有效存量关系，按原绑定时间重新核验。不覆盖客户专属、已转化保护和已解除关系。客户关闭专属后跟随店铺当前统一周期。周期校验为1～365整数；调整原因按既有组件为选填，保存前后值与操作人必须记录。重算后已到期客户进入任务复核，订单待明确客户仍按订单结果处理。</p><h2>4. 公海区分字段口径</h2><table><tr><th>字段</th><th>口径 / 示例</th></tr><tr><td>入海业务线</td><td>内部销售 / 本管家 / 合伙人分销 / 待核实。取当次进入公海前的有效归属；合伙人商家在合伙人分销下记录对象子类型。</td></tr><tr><td>前归属对象</td><td>类型、对象ID、名称；本管家记录店铺ID及名称，内部销售记录销售ID。</td></tr><tr><td>入海方式 / 原因</td><td>规则自动掉落、销售规则掉落、人工解绑、历史治理；原因单独保存。</td></tr><tr><td>规则快照</td><td>规则ID、版本、配置层级、周期、绑定时间、核验结果；人工解绑标记不适用。</td></tr><tr><td>来源渠道 / 绑定渠道</td><td>来源为获客信息；绑定渠道为本轮绑定方式。均不能代替入海业务线。</td></tr><tr><td>归属事件</td><td>事件ID、周期ID、前后归属、时间、操作者、批次、结果。多次入海保留多条，列表显示最新一次。</td></tr></table><div class="tip blue">示例：合伙人客户 → 掉落公海（合伙人分销）→ 销售领取 → 销售解绑 → 公海（内部销售）。原始来源仍保留“合伙人”，前归属与入海业务线按本次更新。</div><h2>5. 重新绑定及扫码矩阵</h2><table><tr><th>订单历史</th><th>解除方式</th><th>扫码绑定</th><th>重新绑定 / 领取</th></tr><tr><td>没下过单</td><td>手动解绑</td><td>允许（按第③条）</td><td>原对象重新绑定、销售领取</td></tr><tr><td>没下过单</td><td>自动掉落</td><td>禁止（按第⑥条）</td><td>重新绑定原对象、后台修改渠道分销员、销售领取</td></tr><tr><td>下过单</td><td>手动解绑</td><td>禁止（按第⑤条）</td><td>重新绑定原对象、后台修改渠道分销员、销售领取</td></tr><tr><td>下过单（如全取消）</td><td>自动掉落</td><td>建议禁止；评审确认</td><td>按自动掉落处理；重新绑定原对象 / 销售领取</td></tr></table><p>重新绑定前核验客户仍在公海、目标有效；已被其他销售或分销商绑定时拦截，提示联系现归属人解绑。新绑定按当时生效规则重新计时。提交需原子校验有效归属唯一；订单创建记录最先成功的有效绑定，不追溯改历史订单。</p><div class="tip warn"><b>待确认口径：</b>第④与第⑥都是“没下过单＋自动掉落”，第⑥明确禁止扫码，本原型按其执行；请确认第⑥是否实际指“下过单＋自动掉落”。“下过单”用于扫码限制，不能与“存在有效订单”混为一谈。店铺授权时间是否等同绑定成功时间，亦需核对。</div><h2>6. 历史数据与验收</h2><p>上线盘点本管家历史客户，按同一套订单核验与周期规则处理；绑定时间缺失、历史前归属缺失的数据列入待核实，公海业务线不凭渠道推断。历史补录记录标记来源及实际补录时间。执行前保留关系与规则快照，按批次支持恢复。</p><ol><li>店铺可以保存统一周期，客户关闭专属后跟随店铺规则。</li><li>首检无有效订单掉落，进行中订单持续等待，任一有效完结订单保留。</li><li>本管家、合伙人、销售三类公海客户可单独筛选；人工解绑与规则掉落可分开查询。</li><li>领取后再点原对象重新绑定，展示“已被其他业务员绑定”并拦截。</li><li>重新绑定成功从新绑定时间计时，原掉落事件及历史订单不被覆盖。</li><li>规则配置、公海领取、重新绑定均联动操作日志；重复任务不会重复掉落。</li></ol><p class="muted">原型说明：使用截图中的绿色按钮、黑色顶栏、浅灰筛选区与表格样式；演示数据仅保存在当前页面内存，刷新可重置。实际权限、订单核验、并发锁与历史任务需后端实现。</p></article>`}

function modalNoteMarkup(state){
  if(state.dialog==='操作记录')return `<h2>操作记录 · 弹窗说明</h2><section><h3>一、记录字段</h3><ul><li><strong>备注内容：</strong>记录客户进入列表、绑定、解绑、掉落、领取及重新绑定；归属变化、掉落规则与原因统一写入此列。</li><li><strong>附件：</strong>沿用现有附件字段，无附件显示“-”。</li><li><strong>操作人：</strong>自动任务显示“系统”，人工操作显示实际账号并沿用现网脱敏。</li><li><strong>操作时间：</strong>显示实际发生时间，按时间倒序；同一掉落事件不重复展示。</li></ul></section><section><h3>二、按钮事件</h3><ul><li>点击页码、上一页、下一页或切换每页条数：更新表格，默认100条/页；Total为实际条数，首尾不可翻页时禁用按钮。</li><li>输入跳转页码：校验1～总页数的整数，错误时保留当前页并提示。</li><li>点击右上角“×”或按Esc：关闭当前弹窗，返回公海列表，保留查询条件和业务线Tab。</li></ul></section>`;
  const source=document.createElement('div');source.innerHTML=modalPrd(state);const chunks=[],events=[];
  for(const section of source.querySelectorAll('.prd-section')){
    const title=section.querySelector('h3')?.textContent||'信息说明';if(['目标','弹层目标'].includes(title))continue;
    const items=[];for(const row of section.querySelectorAll('.prd-fields>div'))items.push(`<strong>${h(row.querySelector('dt')?.textContent)}：</strong>${h(row.querySelector('dd')?.textContent)}`);
    if(!items.length){for(const li of section.querySelectorAll('li'))items.push(h(li.textContent));for(const p of section.querySelectorAll('p'))items.push(h(p.textContent));}
    if(['关闭','按钮与关闭','确定与取消','确认与取消','记录与分页','按钮事件'].includes(title)){events.push(...items);continue}
    chunks.push({title:title==='表格字段'?'记录字段':title==='表单字段'?'字段说明':title,items});
  }
  if(events.length)chunks.push({title:'按钮事件',items:events});
  const numbers=['一','二','三','四','五','六','七'];
  return `<h2>${h(state.dialog)} · 弹窗说明</h2>${chunks.map((chunk,index)=>`<section><h3>${numbers[index]||index+1}、${h(chunk.title)}</h3><ul>${chunk.items.map(item=>`<li>${item}</li>`).join('')}</ul></section>`).join('')}`;
}

function syncModalPair(state){
  if(!state.dialog){document.querySelectorAll('dialog.review-dialog[open]').forEach(dialog=>dialog.close());return}
  const candidates=[document.getElementById('confirm'),document.getElementById('storeRuleLayer'),document.getElementById('overlay')];
  const host=candidates.find(node=>node?.querySelector('.mask'));if(!host)return;
  let portal=host.querySelector('dialog.review-dialog');
  if(!portal){
    const mask=host.querySelector('.mask');portal=document.createElement('dialog');portal.className='review-dialog';
    portal.setAttribute('aria-label',state.dialog+'与弹窗说明');
    const pair=document.createElement('div');pair.className='review-dialog-pair';
    const product=document.createElement('div');product.className='review-dialog-product';product.appendChild(mask);
    const note=document.createElement('aside');note.className='review-dialog-note';note.setAttribute('aria-label','当前弹窗PRD');
    pair.append(product,note);portal.appendChild(pair);host.appendChild(portal);
    portal.addEventListener('cancel',event=>{event.preventDefault();closePairedModal(host)});
    portal.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closePairedModal(host)}});
  }
  portal.classList.toggle('compact',state.kind==='rule'||host.id==='confirm'||state.dialog.startsWith('备注'));
  const signature=JSON.stringify(state);if(portal.dataset.noteSignature!==signature){portal.querySelector('.review-dialog-note').innerHTML=modalNoteMarkup(state);portal.dataset.noteSignature=signature;}
  document.querySelectorAll('dialog.review-dialog[open]').forEach(other=>{if(other!==portal)other.close()});
  if(!portal.open)portal.showModal();
}

 if(t.includes('重新绑定'))return section('字段与校验',fields(['客户','准备重新绑定的客户名称与ID。'],['恢复目标','本次历史记录对应的原归属对象。'],['当前归属','必须仍在公海；已被其他销售或分销商绑定时阻断。'],['本次生效规则','采用重新绑定时的规则，从新绑定时间重新计时。'],['重新绑定原因','必填，记录至操作日志。']))+section('确认与取消',bullets('确认重新绑定：校验通过后新建关系，记录新绑定时间并生成核验日，保留原掉落历史。','被其他业务员绑定：提示联系现归属人解绑，不覆盖归属。','取消/关闭：不改变当前归属。'));
 if(t.includes('已被其他'))return section('归属冲突',para('客户已由其他销售或分销商绑定。展示当前归属，提示联系现归属人解绑，待回到公海后再重新绑定。确认只关闭提示，不转移归属。'));
 return section('当前视图',para(h(t)))+section('交互',para('当前为复用组件的说明弹层；关闭后恢复列表PRD。'));
}
function updatePrd(s){current=s;const page=pages[s.view]||pages.stores;document.getElementById('prototypeStageTitle').textContent=page.system+' · '+page.title;document.getElementById('prototypeStageDesc').textContent=page.crumb;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===s.view);b.setAttribute('aria-pressed',String(b.dataset.view===s.view))});document.getElementById('prdTitle').textContent=page.title;document.getElementById('prdContext').textContent='当前页面 PRD';document.getElementById('prdContent').innerHTML=s.view==='pool'?poolPrd():s.view==='logs'?logPrd():storePrd();syncModalPair(s)}
const frame=document.getElementById('productFrame');
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const view=b.dataset.view;closeStoreRule();document.getElementById('confirm').innerHTML='';go(view);updatePrd({view,dialog:'',kind:'page'})}));
const layout=document.querySelector('.prototype-layout'),divider=document.getElementById('prototypeResizer'),defaultRatio=67,ratioKey='customerDropPrdV1Split';
function setPaneRatio(v,save=true){const ratio=Math.max(45,Math.min(78,Math.round(v)));layout.style.setProperty('--prototype-pane-fr',ratio+'fr');layout.style.setProperty('--prd-pane-fr',(100-ratio)+'fr');divider.setAttribute('aria-valuenow',String(ratio));if(save)try{localStorage.setItem(ratioKey,String(ratio))}catch(_){}return ratio}
try{const n=Number(localStorage.getItem(ratioKey));setPaneRatio(n>=45&&n<=78?n:defaultRatio,false)}catch(_){setPaneRatio(defaultRatio,false)}
function togglePrd(){const closed=layout.classList.toggle('prd-collapsed');const b=document.getElementById('prdToggle');b.textContent=closed?'展开说明':'收起说明';b.setAttribute('aria-expanded',String(!closed));try{localStorage.setItem('customerDropPrdV1Collapsed',String(closed))}catch(_){}}
document.getElementById('prdToggle').onclick=togglePrd;try{if(localStorage.getItem('customerDropPrdV1Collapsed')==='true')togglePrd()}catch(_){}
let dragging=false;
function moveDivider(x,save=false){const r=layout.getBoundingClientRect();setPaneRatio(100*(x-r.left-7)/(r.width-30),save)}
divider.addEventListener('pointerdown',evt=>{if(matchMedia('(max-width:1100px)').matches)return;dragging=true;divider.setPointerCapture(evt.pointerId);document.body.classList.add('is-resizing');moveDivider(evt.clientX);evt.preventDefault()});
divider.addEventListener('pointermove',evt=>{if(dragging)moveDivider(evt.clientX)});
function stopResize(){if(!dragging)return;dragging=false;document.body.classList.remove('is-resizing');setPaneRatio(Number(divider.getAttribute('aria-valuenow')))}
divider.addEventListener('pointerup',stopResize);divider.addEventListener('pointercancel',stopResize);divider.addEventListener('dblclick',()=>setPaneRatio(defaultRatio));
divider.addEventListener('keydown',evt=>{const value=Number(divider.getAttribute('aria-valuenow'));if(['ArrowLeft','ArrowRight','Home','End','0'].includes(evt.key)){evt.preventDefault();setPaneRatio(evt.key==='Home'?45:evt.key==='End'?78:evt.key==='0'?defaultRatio:value+(evt.key==='ArrowLeft'?-2:2))}});
document.getElementById('ratioReset').onclick=()=>setPaneRatio(defaultRatio);
updatePrd({view:'stores',dialog:'',kind:'page'});

const originalReviewRender=render;
render=function(){
 originalReviewRender();
 const nav=document.querySelector('header nav');
 if(nav)nav.innerHTML=page==='pool'?'<span id="navOps" hidden></span><span id="navCrm">CRM</span><span id="navSpec" hidden></span>':'<span id="navOps">分销</span><span id="navCrm" hidden></span><span id="navSpec" hidden></span>';
 const sidebar=document.getElementById('sidebar');
 if(page==='pool')sidebar.innerHTML='<div class="menu">▱　客户管理　⌃</div><div class="existing-menu">销售线索</div><div class="existing-menu">客户总管理列表</div><div class="existing-menu">客户列表</div><button class="active" onclick="go(\'pool\')">公海客户列表</button><div class="existing-menu">客户查重</div><div class="existing-menu">自动客户分配列表</div><div class="existing-menu">客资转化看板</div>';
 else sidebar.innerHTML='<div class="menu">◷　数据　⌃</div><div class="existing-menu">概况</div><div class="existing-menu">业务数据汇总</div><div class="menu">♙　分销商　⌃</div><div class="existing-menu">分销员列表</div><div class="existing-menu">销售经理审核列表</div><button class="'+(page==='stores'?'active':'')+'" onclick="go(\'stores\')">本管家店铺列表</button><button class="'+(page==='logs'?'active':'')+'" onclick="go(\'logs\')">操作与配置日志</button>';
 syncReviewContext();
};
const originalReviewCloseDrawer=closeDrawer;
closeDrawer=function(){originalReviewCloseDrawer();syncReviewContext()};
function syncReviewContext(){
 const confirm=document.querySelector('#confirm .dialog'),rule=document.querySelector('#storeRuleLayer .store-rule-dialog'),overlay=document.querySelector('#overlay [role="dialog"]');const active=confirm||rule||overlay;let dialog=active?.querySelector('h2')?.textContent||'',kind='page';if(rule)kind='rule';else if(overlay?.classList.contains('store-customer-modal'))kind='customers';else if(active)kind='modal';
 const context={view:page,dialog,kind,ruleMode,store:stores[storeIndex]?.name,customer:customers[customerIndex]?.name};
 const key=JSON.stringify(context);if(syncReviewContext.last===key){syncModalPair(context);return}syncReviewContext.last=key;updatePrd(context);
}
new MutationObserver(syncReviewContext).observe(document.getElementById('productFrame'),{subtree:true,childList:true});
render();

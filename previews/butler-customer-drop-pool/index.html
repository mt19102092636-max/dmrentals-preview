function getOperationRecords(id){
  const live=pool.find(item=>item.id===id);if(!live)return [];const p=live.originalEntry||live;
  const recordLine=p.entryLine||p.line;
  const type=recordLine==='本管家'?'本管家':recordLine==='合伙人分销'?'分销':recordLine==='内部销售'?'销售':'历史数据';
  const prefix=recordLine==='历史数据'?'[历史记录]客户进入公海':recordLine==='内部销售'&&p.way==='销售规则掉落'?'[系统]到期自动流入公海':`[${p.way==='人工解绑'?(p.manualRole||'人工'):'系统'}]${type}客户${p.way==='人工解绑'?'解除绑定后':p.way==='历史存量'?'历史入海':'超期自动'}流入公海`;
  const records=[{
    content:`${prefix}；入海原因：${p.reason}；原归属：${p.owner}；入海业务线：${recordLine}；适用规则：${p.rule}。`,
    attachment:'-',operator:recordLine==='历史数据'?(p.unbindOperator||p.actor||'未记录'):p.way==='人工解绑'?(p.unbindOperator||'原解绑账号未记录'):'系统',time:p.time
  }];
  if(p.bound&&!['未记录','待补录'].includes(p.bound))records.push({content:`${recordLine==='本管家'?'用户授权绑定本管家店铺':p.channel==='销售手动领取'?'公海客户领取绑定销售':'新用户扫码下单绑定分销员'}[${p.owner}]；记录本次绑定时间。`,attachment:'-',operator:'系统',time:p.bound});
  if(recordLine!=='历史数据')records.push({content:`客户进入客户列表；来源渠道：${p.source}。`,attachment:'-',operator:'系统',time:poolValue(p,'created')||'-'});
  logs.filter(log=>log.object.includes(p.id)&&!(log.time===p.time&&['规则自动掉落','销售规则掉落','人工解绑'].includes(log.action))).forEach(log=>records.push({content:`${log.action}；操作前：${log.before}；操作后：${log.after}；原因：${log.reason}。`,attachment:'-',operator:log.actor,time:log.time}));
  return records.sort((a,b)=>b.time.localeCompare(a.time));
}
function showHistory(id){operationRecordState={id,page:1,size:100};renderOperationRecords()}
function renderOperationRecords(){
  const state=operationRecordState,records=getOperationRecords(state.id),pages=Math.max(1,Math.ceil(records.length/state.size));state.page=Math.min(pages,Math.max(1,state.page));
  const rows=records.slice((state.page-1)*state.size,state.page*state.size);
  document.getElementById('overlay').innerHTML=`<div class="mask operation-record-mask"><section class="operation-record-modal" role="dialog" aria-modal="true" aria-label="操作记录"><div class="drawer-head"><h2>操作记录</h2><button class="close" aria-label="关闭操作记录" onclick="closeDrawer()">×</button></div><div class="operation-record-body"><div class="table-wrap"><table class="operation-record-table"><colgroup><col style="width:42%"><col style="width:15%"><col style="width:18%"><col style="width:25%"></colgroup><thead><tr><th>备注内容</th><th>附件</th><th>操作人</th><th>操作时间</th></tr></thead><tbody>${rows.map(record=>`<tr><td>${e(record.content)}</td><td>${e(record.attachment)}</td><td>${e(record.operator)}</td><td>${e(record.time)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无操作记录</td></tr>'}</tbody></table></div></div><div class="operation-record-pager"><span>Total ${records.length}</span><select aria-label="每页条数" onchange="setRecordPageSize(this.value)">${[10,20,50,100].map(size=>`<option value="${size}" ${state.size===size?'selected':''}>${size} /页</option>`).join('')}</select><button aria-label="上一页" ${state.page===1?'disabled':''} onclick="setRecordPage(${state.page-1})">‹</button>${Array.from({length:Math.min(5,pages)},(_,i)=>Math.min(Math.max(1,state.page-2),Math.max(1,pages-4))+i).map(n=>`<button class="${state.page===n?'active':''}" aria-label="第${n}页" aria-current="${state.page===n?'page':'false'}" onclick="setRecordPage(${n})">${n}</button>`).join('')}<button aria-label="下一页" ${state.page===pages?'disabled':''} onclick="setRecordPage(${state.page+1})">›</button><span>前往</span><input type="number" aria-label="前往页码" min="1" max="${pages}" value="${state.page}" onchange="setRecordPage(this.value)" onkeydown="if(event.key==='Enter')setRecordPage(this.value)"><span>页</span></div></section></div>`;
}
function setRecordPage(value){

 (c.bindingHistory??=[]).push({bound:c.bound,unbound:c.unbound,status:c.status,custom:c.custom,snapshotDays:c.snapshotDays,owner:target});
 p.current=target;c.status='正常';c.bound=time;c.unbound='—';c.snapshotDays=days;

}

function renderSpec(){document.getElementById('content').innerHTML=`<article class="doc"><div class="doc-top"><div><h1>本管家客户掉落与公海归属区分</h1><p class="muted">一期增补需求 · 产品评审版 · 2026-11-24</p></div>${btn('打印 / 保存 PDF','window.print()')}</div><div class="tip">目标：将本管家客户纳入现有分销掉落机制，由运营在店铺入口维护规则；公海按每次入海前的归属业务线区分客户。</div><h2>1. 本期范围与入口</h2><p>本期掉落机制仅对常规租赁生效，健康租赁暂不参与；该限制覆盖配置、核验、预计日期及历史存量处理。</p><table><tr><th>页面</th><th>本期新增能力</th></tr><tr><td>运营后台 / 本管家店铺列表</td><td>复用已开发的本管家店铺列表组件，保留店铺信息、分销配置、销售经理比例、销售比例、服务费率、操作六列；仅在常规租赁店铺的原操作列新增查看客户和配置统一掉落规则，健康租赁保留原有店铺操作。外层增加用户手机号（与管理员手机号独立），支持完整11位手机号或后4位；按店铺客户授权记录检索，含已解除关系，不代表当前仍归属该店铺。查询只显示命中店铺，多店命中返回多店；点击查看客户自动带入手机号，仅展示匹配客户。无命中展示空结果，重置清除用户手机号。原快捷登录、修改、升级销售经理入口保留。</td></tr><tr><td>常规租赁店铺 / 查看客户</td><td>复用已开发的查看客户弹层；筛选为授权手机号、归属销售、授权时间。保留Id、用户昵称、归属销售、用户来源、授权手机号、授权时间、预计掉落日期、解除绑定时间、操作九列，行操作打开既有掉落专属规则表单；已解绑、已掉落客户另可重新绑定至原店铺，确认后建立新绑定并保留原解除历史。</td></tr><tr><td>CRM / 公海客户列表</td><td>保留现网全部10项筛选及状态信息、企业信息、客户信息、交易信息、操作五组结构；新增全部、内部销售、本管家、合伙人分销、历史数据业务线Tab，并显示数量；与入海业务线筛选双向同步。新增入海业务线、入海方式、入海时间3项筛选，查询与导出遵循当前Tab。上线前尚未按新口径区分的存量记录归入历史数据分类，按原有资料只读展示；本期不新增入海信息编辑及人工分类补正。上线后新增入海记录按当次归属自动区分内部销售、本管家、合伙人分销；公海导出为12列。新增状态、归属及规则字段嵌入原分组，保留领取额度和原操作。</td></tr><tr><td>客户操作记录</td><td>统一记录进入系统、绑定、规则变化、订单等待、自动掉落、人工解绑、领取、重新绑定；可跨客户列表与公海查询。</td></tr></table><h2>2. 生效规则与核验</h2><p>优先级：客户专属 ＞ 本管家店铺统一；配置表单初始值45天。绑定成功记录绑定时间、归属对象及当前生效周期；首次核验日＝本次绑定时间＋生效周期。本节仅针对本管家及分销；内部销售另按现网未跟进到期、未成交到期规则执行，具体期限与成交口径见公海页PRD。核验订单限当前归属周期内、当前绑定人名下的该客户订单。</p><table><tr><th>订单核验结果</th><th>处理</th><th>日期展示</th></tr><tr><td>无订单 / 只有取消或无效关闭订单</td><td>解除当前绑定，流入公海</td><td>保留实际掉落时间</td></tr><tr><td>有未明确的非取消订单</td><td>进入订单待明确；监听或定时核验，不设固定延期</td><td>订单待明确（无固定下一掉落日）</td></tr><tr><td>任一有效订单完结</td><td>保持绑定并结束本次掉落判断；优先于其他进行中订单</td><td>已转化保护</td></tr><tr><td>等待期间所有订单最终取消</td><td>复核无其他有效订单后掉落</td><td>实际掉落时间</td></tr></table><p>已取消、已关闭、全额退款且未履约不形成有效转化。订单状态需由研发映射平台实际枚举；有完结有效订单时保留优先。掉落只改变当前归属，历史订单、跟进、佣金与业绩事实保留。</p><h2>3. 复用组件与统一配置生效策略</h2><p>按业务指定的已开发组件复用：店铺列表、查看客户弹层、统一掉落规则表单、客户专属规则表单。统一规则表单保留掉落周期、调整原因、处理说明和取消/确定；客户表单增加客户专属周期开关。前端不新建配置工作台，不增加生效范围控件。</p><p>统一规则适用于本店铺新绑定客户，以及未配置专属周期的有效存量关系，按原绑定时间重新核验。不覆盖客户专属、已转化保护和已解除关系。客户关闭专属后跟随店铺当前统一周期。周期校验为正整数，不设置业务天数上限；调整原因按既有组件为选填，保存前后值与操作人必须记录。重算后已到期客户进入任务复核，订单待明确客户仍按订单结果处理。</p><h2>4. 公海区分字段口径</h2><table><tr><th>字段</th><th>口径 / 示例</th></tr><tr><td>入海业务线</td><td>内部销售 / 本管家 / 合伙人分销 / 历史数据。新增记录取当次入海前归属；合伙人及其商家归入合伙人分销。尚未按新口径识别的既有公海存量归入历史数据，不按来源渠道推断。</td></tr><tr><td>前归属对象</td><td>前归属对象的ID及名称；本管家记录店铺ID及名称，内部销售记录销售ID，所属业务线由入海业务线区分。</td></tr><tr><td>入海方式 / 原因</td><td>规则自动掉落、销售规则掉落、人工解绑、历史存量；原因单独保存。</td></tr><tr><td>适用规则与入海原因</td><td>新增入海记录按系统当次判定展示规则及实际原因；人工解绑的适用规则显示不适用，入海原因按实际解绑事件显示销售手动解绑、本管家手动解绑或分销员手动解绑，不要求填写解绑原因，运营后台不新增解绑入口。历史数据保留已有资料，缺失项显示未记录（历史数据）；本期不提供入海信息人工修改。</td></tr><tr><td>来源渠道 / 绑定渠道</td><td>来源为获客信息；绑定渠道为本轮绑定方式。均不能代替入海业务线。</td></tr><tr><td>归属事件</td><td>事件ID、周期ID、前后归属、时间、操作者、结果。多次入海保留多条，列表显示最新一次。</td></tr></table><div class="tip blue">示例：合伙人客户 → 掉落公海（合伙人分销）→ 销售领取 → 销售解绑 → 公海（内部销售）。原始来源仍保留“合伙人”，前归属与入海业务线按本次更新。</div><h2>5. 重新绑定及扫码矩阵</h2><table><tr><th>订单历史</th><th>解除方式</th><th>扫码绑定</th><th>重新绑定 / 领取</th></tr><tr><td>没下过单</td><td>手动解绑</td><td>允许（按第③条）</td><td>原对象重新绑定、销售领取</td></tr><tr><td>没下过单</td><td>自动掉落</td><td>禁止（按第⑥条）</td><td>重新绑定原对象、后台修改渠道分销员、销售领取</td></tr><tr><td>下过单</td><td>手动解绑</td><td>禁止（按第⑤条）</td><td>重新绑定原对象、后台修改渠道分销员、销售领取</td></tr><tr><td>下过单（如全取消）</td><td>自动掉落</td><td>建议禁止；评审确认</td><td>按自动掉落处理；重新绑定原对象 / 销售领取</td></tr></table><p>重新绑定前核验客户仍在公海、目标有效；已被其他销售或分销商绑定时拦截，提示联系现归属人解绑。本管家已解绑及已掉落客户均可从原常规租赁店铺客户列表发起重新绑定，其他正常绑定客户不显示此入口。新绑定按当时的客户专属规则或店铺统一规则重新计时。提交需原子校验有效归属唯一；订单创建记录最先成功的有效绑定，不追溯改历史订单。</p><div class="tip warn"><b>待确认口径：</b>第④与第⑥都是“没下过单＋自动掉落”，第⑥明确禁止扫码，本原型按其执行；请确认第⑥是否实际指“下过单＋自动掉落”。“下过单”用于扫码限制，不能与“存在有效订单”混为一谈。店铺授权时间是否等同绑定成功时间，亦需核对。</div><h2>6. 历史数据与验收</h2><p>常规租赁已绑定存量客户仍按已确认的同等规则执行上线核验；健康租赁不纳入本期核验、掉落任务及待掉落清单。无法按新口径识别的既有公海存量归为历史数据，保留已有信息，不要求人工核实、回填或分类；归属、适用规则及原因不凭来源渠道推断。本期不新增历史公海数据的人工补正流程。执行前保留原始客户关系数据，保留原始绑定关系供必要时恢复。</p><ol><li>店铺可以保存统一周期，客户关闭专属后跟随店铺规则。</li><li>首检无有效订单掉落，进行中订单持续等待，任一有效完结订单保留。</li><li>本管家、合伙人、销售三类公海客户可单独筛选；人工解绑与规则掉落可分开查询。</li><li>领取后再点原对象重新绑定，展示“已被其他业务员绑定”并拦截。</li><li>重新绑定成功从新绑定时间计时，原掉落事件及历史订单不被覆盖。</li><li>规则配置、公海领取、重新绑定均联动操作日志；重复任务不会重复掉落。</li></ol><p class="muted">原型说明：使用截图中的绿色按钮、黑色顶栏、浅灰筛选区与表格样式；演示数据仅保存在当前页面内存，刷新可重置。实际权限、订单核验、并发锁与历史任务需后端实现。</p></article>`}

function modalNoteMarkup(state){
  if(state.dialog==='操作记录')return `<h2>操作记录 · 弹窗说明</h2><section><h3>一、记录字段</h3><ul><li><strong>备注内容：</strong>记录客户进入列表、绑定、解绑、掉落、领取及重新绑定；归属变化、掉落规则与原因统一写入此列；人工解绑记录实际解绑方对应的事件名称，无需填写解绑原因。</li><li><strong>附件：</strong>沿用现有附件字段，无附件显示“-”。</li><li><strong>操作人：</strong>自动任务显示“系统”，人工操作显示实际账号并沿用现网脱敏。</li><li><strong>操作时间：</strong>显示实际发生时间，按时间倒序；同一掉落事件不重复展示。</li></ul></section><section><h3>二、按钮事件</h3><ul><li>点击页码、上一页、下一页或切换每页条数：更新表格，默认100条/页；Total为实际条数，首尾不可翻页时禁用按钮。</li><li>输入跳转页码：校验1～总页数的整数，错误时保留当前页并提示。</li><li>点击右上角“×”或按Esc：关闭当前弹窗，返回公海列表，保留查询条件和业务线Tab。</li></ul></section>`;
  const source=document.createElement('div');source.innerHTML=modalPrd(state);const chunks=[],events=[];
  for(const section of source.querySelectorAll('.prd-section')){
    const title=section.querySelector('h3')?.textContent||'信息说明';if(['目标','弹层目标'].includes(title))continue;
    const items=[];for(const row of section.querySelectorAll('.prd-fields>div'))items.push(`<strong>${h(row.querySelector('dt')?.textContent)}：</strong>${h(row.querySelector('dd')?.textContent)}`);
    if(!items.length){for(const li of section.querySelectorAll('li'))items.push(h(li.textContent));for(const p of section.querySelectorAll('p'))items.push(h(p.textContent));}
    if(['关闭','按钮与关闭','确定与取消','确认与取消','记录与分页','按钮事件'].includes(title)){events.push(...items);continue}
    chunks.push({title:title==='表格字段'?'记录字段':title==='表单字段'?'字段说明':title,items});
  }
  if(events.length)chunks.push({title:'按钮事件',items:events});
  const numbers=['一','二','三','四','五','六','七'];
  return `<h2>${h(state.action==='rebind'?'重新绑定':state.dialog)} · 弹窗说明</h2>${chunks.map((chunk,index)=>`<section><h3>${numbers[index]||index+1}、${h(chunk.title)}</h3><ul>${chunk.items.map(item=>`<li>${item}</li>`).join('')}</ul></section>`).join('')}`;
}
function closePairedModal(host){
  if(host.id==='storeRuleLayer')closeStoreRule();else if(host.id==='confirm')host.innerHTML='';else closeDrawer();
}
function syncModalPair(state){
  if(!state.dialog){document.querySelectorAll('dialog.review-dialog[open]').forEach(dialog=>dialog.close());return}
  const candidates=[document.getElementById('confirm'),document.getElementById('storeRuleLayer'),document.getElementById('overlay')];
  const host=candidates.find(node=>node?.querySelector('.mask'));if(!host)return;
  let portal=host.querySelector('dialog.review-dialog');
  if(!portal){
    const mask=host.querySelector('.mask');portal=document.createElement('dialog');portal.className='review-dialog';
    portal.setAttribute('aria-label',state.dialog+'与弹窗说明');
    const pair=document.createElement('div');pair.className='review-dialog-pair';
    const product=document.createElement('div');product.className='review-dialog-product';product.appendChild(mask);
    const note=document.createElement('aside');note.className='review-dialog-note';note.setAttribute('aria-label','当前弹窗PRD');
    pair.append(product,note);portal.appendChild(pair);host.appendChild(portal);
    portal.addEventListener('cancel',event=>{event.preventDefault();closePairedModal(host)});
    portal.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closePairedModal(host)}});
  }
  portal.classList.toggle('rebind-confirm',state.action==='rebind');
  portal.classList.toggle('compact',state.kind==='rule'||host.id==='confirm'||state.dialog.startsWith('备注'));
  const signature=JSON.stringify(state);if(portal.dataset.noteSignature!==signature){portal.querySelector('.review-dialog-note').innerHTML=modalNoteMarkup(state);portal.dataset.noteSignature=signature;}
  document.querySelectorAll('dialog.review-dialog[open]').forEach(other=>{if(other!==portal)other.close()});
  if(!portal.open)portal.showModal();
}

function workflowEmphasize(root){
  if(!root)return;const nodes=[],walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){const node=walker.currentNode;if(node.parentElement?.closest('h2,h3,h4,dt,.prd-key,script,style'))continue;if(WORKFLOW_KEYS.some(key=>node.textContent.includes(key)))nodes.push(node)}
  for(const node of nodes){const text=node.textContent,fragment=document.createDocumentFragment();let index=0,plain='';while(index<text.length){const key=WORKFLOW_KEYS.find(value=>text.startsWith(value,index));if(!key){plain+=text[index++];continue}if(plain){fragment.append(plain);plain=''}const strong=document.createElement('strong');strong.className='prd-key';strong.textContent=key;fragment.appendChild(strong);index+=key.length}if(plain)fragment.append(plain);node.replaceWith(fragment)}
}

    ['客户ID','客户唯一编号；第一列，来自客户主档，不因多次入海重复生成。'],
    ['客户名称','客户主档的名称或昵称；第二列，与当前列表一致。'],
    ['手机号','客户授权手机号；第三列，维持列表脱敏形式，不导出完整号码。'],
    ['入海业务线','第四列，取本次入海前归属记录：内部销售、本管家、合伙人分销或历史数据。'],
    ['前归属对象','第五列，本次入海前对象名称及ID，沿用现有归属记录。'],
    ['入海方式','第六列，本次规则掉落、销售规则掉落、人工解绑或历史存量方式。'],
    ['适用规则','第七列，按下方规则与入海原因对照表展示；人工解绑为不适用，历史数据按原有资料展示，缺失为未记录（历史数据）；不补造历史周期。'],
    ['来源渠道','第八列，保留首次获客来源，不被后续归属变更覆盖。'],
    ['绑定渠道','第九列，取本次绑定方式，与来源渠道和入海业务线分别保留。'],
    ['订单情况','第十列，为当前样例订单状态摘要，不等同于有效订单数量。'],
    ['入海原因','第十一列，与本行适用规则匹配，按对照表取实际触发原因；人工解绑取系统记录的实际解绑事件名称，不要求填写解绑原因，历史数据保留原有原因，缺失显示未记录（历史数据）。'],
    ['入海时间','第十二列，本次实际入海时间，格式YYYY-MM-DD HH:mm:ss。'],
  )}</details>`;
}
function workflowPageNotes(view){
  const markerExplanation='红色“本次新增”标识新增入口或字段区域；橙色“本次调整”标识复用组件中的调整位置。行级入口仅在首条可见样例标一次，覆盖同列全部客户/店铺。';
  return section('原型操作',bullets(markerExplanation,'标签仅供评审使用，不改变真实业务字段或导出内容。左侧切换系统，新增功能从中间页面的真实行操作进入。','三栏可调宽、收起；弹窗与独立说明白卡并排，关闭或返回时保留原查询条件。',`演示计时基准：${WORKFLOW_AS_OF}（北京时间）；历史绑定和操作日期保留原关联。新操作按当前北京时间记录，数据仅保存在当前页面内存，刷新重置，不连接真实后台。`));
}
const workflowPagePrd=updatePrd;
updatePrd=function(state){
  workflowPagePrd(state);
  const content=document.getElementById('prdContent');
  if(state.view==='pool'){content.insertAdjacentHTML('beforeend',applicableRulePrd()+salesDropPrd()+historicalDataPrd()+workflowExportPrd());}
  if(state.view!=='pool')content.insertAdjacentHTML('beforeend',workflowPageNotes(state.view));
  if(state.view==='stores')content.insertAdjacentHTML('afterbegin',section('本期关键规则',bullets('仅常规租赁参与本期掉落机制，健康租赁暂不参与。健康租赁不新增查看客户，不展示统一及专属规则配置入口。','从常规租赁店铺行操作进入“查看客户”和“配置统一掉落规则”；用户手机号检索关联店铺并带入客户弹层。','配置表单初始值45天，客户专属规则优先于店铺统一规则。首检无任何有效订单掉落；存在未明确订单持续等待，不设置固定延期天数。')));
  workflowEmphasize(content);
};

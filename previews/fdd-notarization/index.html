<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法大大赋强公证 · 雕马快租</title>
  <style>
:root{--ink:#1b2a25;--muted:#56655f;--line:#dfe7e2;--paper:#f1f5f2;--white:#fff;--green:#176447;--mint:#e7f4eb;--shadow:0 12px 28px #153a2420}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
:focus-visible{outline:2px solid #218a61;outline-offset:3px}
.prototype-shell{max-width:1920px;margin:auto;min-height:100vh}
.prototype-topbar{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border-bottom:1px solid var(--line)}
.prototype-brand{display:flex;align-items:center;gap:12px;font-size:16px}
.prototype-mark,.appmark{display:grid;place-items:center;color:#fff;background:#176447;border-radius:9px;font-weight:750;width:36px;height:36px}
.prototype-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}
.prototype-status i{width:7px;height:7px;border-radius:50%;background:#26945c}
.prototype-workspace{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 68px)}
.prototype-rail{padding:25px 12px;background:#f9fbf9;border-right:1px solid var(--line)}
.prototype-rail-label{margin:0 9px 12px;color:var(--muted);font-size:12px;font-weight:650}
.prototype-role-nav{display:grid;gap:6px}
.prototype-role{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;width:100%;padding:9px 7px;background:transparent;border:1px solid transparent;border-radius:9px;color:#37463f}
.prototype-role:hover{background:#edf4ef}
.prototype-role.active{background:#e3f2e8;border-color:#cee6d6;color:#155638}
.prototype-role-icon{display:grid;place-items:center;width:29px;height:29px;border-radius:7px;background:#edf0ed;color:#52665b;font-size:13px;font-weight:650}
.prototype-role.active .prototype-role-icon{background:#216e4f;color:white}
.prototype-role strong,.prototype-role small{display:block}
.prototype-role small{color:var(--muted);font-size:11px;margin-top:1px}
.prototype-role b{font-weight:400;color:#507666}
.prototype-stage{padding:24px 22px 38px;min-width:0}
.prototype-stage-head{margin-bottom:18px}
.prototype-eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}
.prototype-stage-head h1{font-size:26px;line-height:1.25;letter-spacing:-.025em;margin:0}
.prototype-layout{display:grid;grid-template-columns:minmax(440px,var(--prototype-pane-fr,68fr)) 12px minmax(286px,var(--prd-pane-fr,32fr));gap:8px;align-items:start}
.prototype-board,.prototype-prd{min-width:0;border:1px solid var(--line);border-radius:13px;background:white;box-shadow:0 3px 12px #163b2410;overflow:hidden}
.prototype-resizer{position:relative;align-self:stretch;min-height:72px;cursor:col-resize;touch-action:none;border-radius:6px}
.prototype-resizer:before{content:"";position:absolute;top:88px;left:4px;width:4px;height:45px;border-radius:6px;background:#b9cfc2}
.prototype-resizer:is(:hover,:focus-visible,.dragging):before{background:#218a61}
.is-resizing{cursor:col-resize;user-select:none}
.prototype-layout.prd-collapsed{grid-template-columns:minmax(0,1fr) 58px}
.prd-collapsed .prototype-resizer,.prd-collapsed .prd-panel-content,.prd-collapsed .prd-panel-head h2{display:none}
.prd-collapsed .prd-panel-head{padding:11px;justify-content:center}
.prd-collapsed .prd-toggle{writing-mode:vertical-rl;padding:10px 5px}
.prd-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;background:#f7faf7;border-bottom:1px solid var(--line)}
.prd-panel-head h2{font-size:15px;margin:0}
.prd-toggle{border:1px solid #cfded3;background:white;color:#215e44;border-radius:6px;padding:5px 8px;white-space:nowrap;font-size:12px}
.prd-panel-content{padding:0 16px 4px}
.prd-section{padding:13px 0;border-bottom:1px solid #e7ede8}
.prd-section:last-child{border-bottom:0}
.prd-section h3,.modal-context-prd h3{margin:0 0 6px;font-size:13px;color:#176447}
.prd-section p,.prd-section ul,.modal-context-prd ul{font-size:13px;margin:0;color:#475750}
.prd-section ul,.modal-context-prd ul{padding-left:18px}
.prd-section li+li,.modal-context-prd li+li{margin-top:5px}
.apphead{display:flex;gap:16px;align-items:center;min-height:55px;background:#1d2321;color:white;padding:9px 15px}
.appbrand{display:flex;align-items:center;gap:8px;font-weight:680}
.appmark{width:25px;height:25px;background:#314438;color:#b1e4a8;border-radius:6px;font-size:12px}
.appnav{display:flex;gap:14px;color:#ccd4cf;font-size:12px}
.appnav strong{color:white}
.appaccount{margin-left:auto;color:#e0e7e1;font-size:12px;white-space:nowrap}
.appaccount select{color:white;background:#313b36;border-color:#56635c;max-width:160px;padding:5px}
.crumb{display:flex;gap:8px;align-items:center;background:white;border-bottom:1px solid var(--line);color:#5b6a63;padding:10px 16px;font-size:12px}
.appmain{background:#f5f7f6;padding:14px 15px 16px;min-height:480px}
.panel{background:white;border:1px solid var(--line);border-radius:8px}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px;margin-bottom:12px}
.filters label{display:grid;gap:4px;font-size:12px;flex:1;min-width:128px}
input:not([type=checkbox]):not([type=radio]),select{background:white;color:var(--ink);border:1px solid #cfd9d3;border-radius:6px;padding:7px 9px;min-width:0}
input::placeholder{color:#687870}
.btn{border:1px solid #ccd8d1;background:#fff;color:#33443b;border-radius:6px;padding:7px 11px;line-height:1.35;white-space:nowrap;font-size:13px;font-weight:550}
.btn:not(:disabled):hover{background:#edf5ef}
.btn.primary{background:#217346;color:#fff;border-color:#217346}
.btn.primary:not(:disabled):hover{background:#185e38}
.btn.text{color:#196747;border-color:transparent;background:transparent;padding-inline:5px}
.btn.subtle{color:#215f45;background:#edf6f0;border-color:#d4e8da}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tabs{display:flex;overflow:auto;gap:17px;padding:0 13px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:11px 1px 9px;color:#56665d;white-space:nowrap;font-size:13px}
.tabs button.active{border-color:#238050;color:#185a37;font-weight:700}
.table-wrap{overflow:auto;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:10px 12px;border-bottom:1px solid #e7eee9;vertical-align:middle}
th{font-weight:600;color:#5a6961;background:#f7f9f8;white-space:nowrap;font-size:12px}
td{font-size:13px}
.order-table{min-width:560px}
.order-table th:nth-child(1){width:35%}
.order-table th:nth-child(2){width:18%}
.order-table th:nth-child(3){width:24%}
.order-table td:last-child{white-space:nowrap}
.config-table{min-width:490px}
.order-band td{background:#f4f7f6;font-size:12px;padding-block:7px;color:#526158}
.order-band strong{color:#23392c;white-space:nowrap}
.order-band span{display:inline-block;margin-right:12px}
.product{display:flex;align-items:center;gap:9px}
.product-thumbnail{width:50px;height:50px;object-fit:cover;border-radius:7px;border:1px solid #edf0ee;flex:none;background:white}
.product b,.meta{display:block}
.meta{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:5px;background:#eef1ef;color:#4b5a51;padding:2px 7px;font-size:12px;white-space:nowrap;font-weight:550}
.pill.amber{background:#fff3d9;color:#784e16}
.pill.green{background:#e2f4e8;color:#1d633d}
.pill.blue{background:#e9f1fa;color:#25577f}
.pill.red{background:#fcece8;color:#8d3029}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;color:var(--muted);font-size:12px}
.section-title{font-size:15px;margin:0}
.panel-title{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
.info{padding:10px 12px;background:#edf6ef;color:#27543c;border:1px solid #daeadd;border-radius:8px;font-size:13px;margin:10px 0}
.info.warn{background:#fff6e4;color:#71491b;border-color:#f1e3c9}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:0 0 13px;padding:12px;background:#f5f8f6;border:1px solid var(--line);border-radius:8px}
.details dt{color:var(--muted);font-size:12px}
.details dd{margin:3px 0 0;font-weight:620;overflow-wrap:anywhere}
.field{display:grid;gap:5px;margin:11px 0}
.field small{color:var(--muted)}
.checkrow{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.checkrow input{margin-top:4px;accent-color:#22724a}
.error{color:#9d2922;font-size:13px;margin:8px 0 0}
.doc-list{display:grid;gap:8px}
.doc{border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.doc .actions{margin-top:8px}
.phone-space{padding:20px 12px;background:#edf3ef;display:flex;justify-content:center}
.phone{width:min(100%,386px);min-height:560px;background:#f3f4f5;border:1px solid #dfe6e1;border-radius:23px;overflow:hidden;color:#222;box-shadow:0 10px 24px #23402c18}
.phone-header{padding:13px 13px 11px;background:#fff}
.phone-status,.phone-title{display:flex;align-items:center;justify-content:space-between;gap:6px}
.phone-status{font-size:12px;font-weight:650;padding:0 3px 12px}
.phone-title{font-size:17px;font-weight:720;min-height:28px}
.phone-title strong{margin-right:auto}
.phone-menu{font-size:12px;color:#34433a;border:1px solid #dce8de;border-radius:30px;padding:3px 7px;background:#ffffffa0}
.back{background:transparent;border:0;padding:0 4px 0 0;font-size:20px;line-height:1;color:#26392b}
.phone-content{padding:10px;display:grid;gap:10px}
.mobile-card{border-radius:11px;background:white;padding:11px;border:1px solid #edf0ee}
.mobile-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mobile-title strong{font-size:15px}
.mobile-card .actions{justify-content:flex-end;margin-top:8px}
.mobile-card .doc .actions{justify-content:flex-start}
.overlay{display:none;position:fixed;inset:0;z-index:30;background:#162b24a3;backdrop-filter:blur(3px);padding:20px;overflow:auto}
.overlay.open{display:flex}
.modal-context-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start;width:min(100%,880px);margin:auto}
.modal,.modal-context-prd{background:#fff;border:1px solid #d9e4dd;border-radius:12px;box-shadow:0 18px 60px #051b1760;min-width:0}
.modal{display:flex;flex-direction:column;max-height:calc(100dvh - 40px);overflow:hidden}
.modal-head,.modal-foot{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.modal-head{border-bottom:1px solid var(--line)}
.modal-foot{border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.modal-head h2,.modal-context-prd h2{font-size:17px;margin:0}
.close{border:0;background:none;color:#596b60;font-size:20px;padding:0 4px}
.modal-body{padding:14px 16px;overflow:auto}
.modal-context-prd{max-height:calc(100dvh - 40px);overflow:auto;padding:15px}
.modal-context-prd h2{padding-bottom:11px;border-bottom:1px solid var(--line)}
.modal-context-prd section{margin:11px 0}
.toast{position:fixed;z-index:50;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:9px 14px;border-radius:8px;background:#173f2f;color:white;box-shadow:var(--shadow)}
@media(max-width:1100px){
 .prototype-layout,.prototype-layout.prd-collapsed{grid-template-columns:minmax(0,1fr);gap:12px}
 .prototype-resizer{display:none}
 .prd-collapsed .prd-panel-head{justify-content:space-between}
 .prd-collapsed .prd-panel-head h2{display:block}
 .prd-collapsed .prd-toggle{writing-mode:initial;padding:5px 8px}
}
@media(max-width:760px){
 .prototype-topbar{height:54px;padding:0 12px}
 .prototype-brand{font-size:14px;gap:7px}
 .prototype-mark{width:29px;height:29px}
 .prototype-workspace{display:block}
 .prototype-rail{padding:8px;border-right:0;border-bottom:1px solid var(--line)}
 .prototype-rail-label{display:none}
 .prototype-role-nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
 .prototype-role{padding:5px 7px}
 .prototype-stage{padding:12px 8px 22px}
 .prototype-stage-head{margin-bottom:10px}
 .prototype-stage-head h1{font-size:21px}
 .appnav{display:none}
 .appmain{padding:8px}
 .order-table{min-width:0}
 .order-table thead{display:none}
 .order-table,.order-table tbody,.order-table tr,.order-table td{display:block}
 .order-table .order-data{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:4px}
 .order-table .order-data td{border-bottom:0;padding:6px}
 .order-table .order-data td:first-child,.order-table .order-data td:last-child{grid-column:1/-1}
 .order-table .order-data td[data-label]:before{content:attr(data-label);display:block;color:var(--muted);font-size:11px}
 .phone-space{padding:8px}
 .overlay{padding:9px}
 .modal-context-layout{grid-template-columns:minmax(0,1fr);gap:8px}
 .modal,.modal-context-prd{max-height:none}
}

/* Keep the existing order card and its six information columns readable inside the review layout. */
.prototype-rail .ops-pages{display:grid;grid-template-columns:1fr;gap:4px;margin:0 0 2px 36px}
.ops-pages button{border:1px solid transparent;background:none;color:#476457;padding:4px 6px;text-align:left;font-size:12px;border-radius:5px}
.ops-pages button:hover,.ops-pages button.active{border-color:#d4e4d8;background:#edf6ef;color:#16553a}
.scene-picker{display:grid;gap:6px;margin:18px 4px 0;padding-top:13px;border-top:1px solid var(--line);color:#43594e;font-size:12px}
.scene-picker select{width:100%;font-size:12px}
.scene-picker small{color:var(--muted);line-height:1.35}
.appnav{gap:12px;white-space:nowrap;overflow:auto;scrollbar-width:none}
.apphead{gap:13px}
.appbrand,.appaccount{flex:none;white-space:nowrap}
.legacy-main{background:#f2f4f7}
.legacy-main > .btn{margin-bottom:9px}
.order-filters{padding:12px 13px;background:#f9fafc}
.order-filters .actions{justify-content:flex-end;margin-top:11px}
.filter-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:8px 12px}
.filter-fields label{display:grid;gap:3px;min-width:0;color:#4b5561;font-size:12px}
.filter-fields input,.filter-fields select{max-width:100%;width:100%;background:white}
.date-range{display:grid;gap:4px}
.legacy-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0}
.legacy-tabs button{border:1px solid #dfe4ea;background:white;border-radius:4px;padding:5px 8px;font-size:12px;color:#505963}
.legacy-tabs button.active{color:#205d3f;border-color:#a7cfb4;background:#e9f5ec;font-weight:650}
.legacy-scroll{overflow:auto;scrollbar-width:thin;container-type:inline-size}
.legacy-grid{display:grid;grid-template-columns:minmax(175px,1.55fr) minmax(100px,.8fr) minmax(125px,1.05fr) minmax(111px,.9fr) minmax(108px,.86fr) minmax(85px,.7fr)}
.legacy-columns{border:1px solid #e4e8ee;background:#eff3f8;border-radius:5px;padding:7px 0;color:#303b47;font-weight:700;font-size:12px;margin-bottom:7px;min-width:704px}
.legacy-columns span{padding:0 9px}
.legacy-order{background:white;border:1px solid #e0e5ec;border-radius:6px;margin-bottom:12px;min-width:704px;color:#35404c}
.legacy-order-band{background:#f1f4f9;padding:7px 9px;border-bottom:1px solid #e4e8ef;font-size:12px}
.order-ident,.order-links,.legacy-actions,.legacy-tags{display:flex;align-items:center;gap:5px 9px;flex-wrap:wrap}
.order-ident strong{color:#303b47}
.order-ident .btn{padding-left:0}
.legacy-actions{justify-content:flex-end;gap:3px 5px}
.legacy-link.btn{background:transparent;border-color:transparent;color:#265c9b;font-weight:500;padding:3px 4px;font-size:12px}
.legacy-link.btn:hover{background:#e8f0fa;color:#19477f}
.legacy-cell{padding:9px 8px;min-width:0;border-right:1px solid #edf0f4;font-size:12px;overflow-wrap:anywhere}
.legacy-cell:last-child{border-right:0}
.legacy-cell>div{margin-bottom:3px}
.legacy-cell .product-thumbnail{width:42px;height:42px}
.legacy-cell .product{align-items:flex-start;font-size:12px}
.legacy-cell .meta{font-size:11px}
.legacy-cell em{font-style:normal;color:#b13937}
.legacy-tags span{font-size:10px;display:inline-block;padding:1px 4px;border:1px solid #dae6f6;border-radius:3px;color:#3b648e;background:#f1f6fe}
.legacy-label{color:#536275}
.legacy-row{padding:6px 9px;border-top:1px solid #edf0f4;font-size:12px}
.order-links{justify-content:space-between}
.evidence-row{background:#edf6ef;color:#27533b;display:flex;align-items:center;justify-content:space-between;gap:8px}
.legacy-notes>div{border-top:1px solid #edf0f4;padding:5px 9px;color:#536275;font-size:12px}
.legacy-notes span{margin-left:10px;color:#344452}
.quota-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px;margin-bottom:10px;color:#21563d}
.form-inset{padding:3px 12px 10px}
.fulfillment-panel{margin-bottom:11px}
.file-icon{display:grid;place-items:center;width:33px;height:38px;color:#245e41;background:#e9f5ed;border-radius:5px;flex:none}
.document-preview{background:#fbfcfb;border:1px solid #e2e9e4;border-radius:7px;padding:12px 13px}
.document-preview h3{margin:0 0 8px;font-size:15px}
.document-preview p{margin:4px 0}
@container (max-width:730px){
 .legacy-columns,.legacy-order{min-width:0}
 .legacy-columns{display:none}
 .legacy-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .legacy-cell:nth-child(3n){border-right:0}
 .legacy-cell{border-bottom:1px solid #edf0f4}
 .legacy-cell:before{content:attr(data-label);font-weight:680;display:block;margin-bottom:3px;color:#566b81}
}
@container (max-width:460px){
 .legacy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .legacy-cell:nth-child(3n){border-right:1px solid #edf0f4}
 .legacy-cell:nth-child(2n){border-right:0}
 .legacy-actions{justify-content:flex-start}
}
@media(max-width:760px){
 .prototype-rail .ops-pages{margin:0;grid-template-columns:1fr 1fr;grid-column:1/-1}
 .scene-picker{margin:7px 2px 0;padding-top:6px;grid-template-columns:auto 1fr;align-items:center}
 .scene-picker small{grid-column:2}
 .apphead{gap:6px;padding-inline:9px}
 .appbrand{font-size:12px}
 .appaccount select{max-width:135px}
 .filter-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
 .modal-foot .btn{white-space:normal}
}

/* Customer and notary journeys use the handset's own navigation and action bar. */
.phone-journey {
  height:clamp(480px,calc(100svh - 188px),694px);
  min-height:0;
  border-radius:24px;
  scroll-margin-top:8px;
}
.journey {
  height:100%; display:flex; flex-direction:column;
  background:#f4f6f5; color:#192c23;
}
.journey-header { flex:none; background:white; padding:9px 13px 0; border-bottom:1px solid #e7ece8 }
.journey-header .phone-status { padding:0 3px 2px; min-height:20px }
.journey-nav {
  display:grid; grid-template-columns:64px minmax(0,1fr) 64px;
  align-items:center; min-height:48px; gap:4px; text-align:center; font-size:16px;
}
.journey-nav .phone-menu { justify-self:end; padding:3px 7px; white-space:nowrap }
.journey-back {
  color:inherit; background:none; border:0; justify-self:start;
  width:44px; height:44px; font-size:29px; line-height:1; text-align:left;
}
.journey-content {
  flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:18px 16px 14px;
}
.journey-heading { margin:0 0 17px }
.journey-heading h2, .mobile-paper h2 { margin:0; font-size:23px; line-height:1.28; letter-spacing:-.02em }
.journey-heading p { margin:8px 0 0; color:#51635a; font-size:14px; line-height:1.6 }
.journey-heading h2:focus,.mobile-paper h2:focus { outline:none }
.journey-fields {
  margin:0 0 14px; padding:0 12px; background:white; border:1px solid #e2ebe5; border-radius:12px;
}
.journey-fields div { display:grid; grid-template-columns:6em minmax(0,1fr); gap:9px; padding:11px 0 }
.journey-fields div+div { border-top:1px solid #ebf0ed }
.journey-fields dt { font-size:13px; color:#52645b }
.journey-fields dd { margin:0; font-size:13px; font-weight:650; text-align:right; overflow-wrap:anywhere }
.journey-check {
  display:flex; align-items:flex-start; gap:9px; padding:10px 2px; font-size:14px;
}
.journey-check input { margin:2px 0 0; width:18px; height:18px; flex:none; accent-color:#217346 }
.journey-notice { background:white; border:1px solid #e2ebe5; border-radius:12px; padding:12px 12px 12px 33px }
.journey-notice li+li { margin-top:8px }
.journey-footer { flex:none; display:grid; gap:3px; padding:10px 14px 0; background:white; border-top:1px solid #e7ece8 }
.btn.journey-primary { display:block; width:100%; min-height:46px; font-size:15px; border-radius:10px }
.btn.journey-link { min-height:40px; font-size:13px }
.journey-safe { flex:none; display:grid; place-items:center; height:19px; background:white }
.journey-safe i { width:99px; height:4px; border-radius:8px; background:#263e31; opacity:.75 }
.journey-file {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;
  gap:9px; padding:10px; border:1px solid #e2ebe5; border-radius:12px; background:white;
}
.journey-demo { margin:10px 0 0; color:#52645b; font-size:12px }
.journey-demo summary { cursor:pointer; padding:8px 2px; width:fit-content; min-height:32px }
.journey-demo-controls { display:flex; flex-wrap:wrap; gap:4px 8px; padding:2px 0 }
.mobile-paper { background:white; border:1px solid #e2ebe5; border-radius:12px; padding:19px 15px 24px }
.mobile-paper h2 { font-size:20px; margin:8px 0 20px }
.mobile-paper p { overflow-wrap:anywhere }
.journey-result { padding:12px 0 }
.journey-result span {
  display:grid; place-items:center; width:54px; height:54px; border-radius:50%;
  color:#196341; background:#dcefe4; font-size:28px; font-weight:700;
}
.video-prep { border-radius:14px; background:#192c31; color:#e7f0ed; margin:0 0 14px; overflow:hidden }
.device-preview {
  display:grid; place-items:center; height:119px;
  background:radial-gradient(ellipse at 50% 75%,#416460,#273f42 48%,#192c31 77%);
}
.device-caption { background:#ffffff0c; padding:7px 10px; font-size:12px; text-align:center }
.journey-dark { background:#132324; color:#f0f6f3 }
.journey-dark .journey-header,.journey-dark .journey-footer,.journey-dark .journey-safe { background:#132324; border-color:#ffffff15 }
.journey-dark .phone-menu { color:#f0f6f3; background:#ffffff0d; border-color:#ffffff34 }
.journey-dark .journey-safe i { background:#eaf5ee }
.journey-dark .journey-content { display:flex; flex-direction:column; gap:11px; padding:10px 12px 6px }
.video-stage {
  position:relative; flex:1 0 160px; min-height:160px; border-radius:15px; overflow:hidden;
  background:radial-gradient(ellipse at 47% 30%,#526966,#2e4648 50%,#1b3033 83%);
  border:1px solid #ffffff19;
}
.call-state {
  display:flex; align-items:center; gap:6px; position:absolute; top:9px; left:9px; z-index:1;
  background:#152b2bbb; padding:4px 8px; border-radius:20px; font-size:12px;
}
.call-state i { width:6px; height:6px; border-radius:50%; background:#83dfac }
.call-state i.connecting { background:#f4ce78 }
.remote-preview { position:absolute; inset:31px 0 19px; display:grid; place-content:center; justify-items:center; gap:9px }
.remote-preview strong { font-size:13px }
.call-avatar {
  width:59px; height:59px; border-radius:50%; display:grid; place-items:center;
  background:#c8ddd1; color:#244d41; font-size:23px; font-weight:720;
}
.local-avatar { background:#d5e6db; color:#325e51 }
.local-preview {
  position:absolute; right:10px; bottom:10px; width:83px; height:107px;
  display:grid; place-content:center; justify-items:center; gap:5px; border-radius:9px;
  background:linear-gradient(150deg,#4b6566,#2c4549);
  border:1px solid #ffffff60; box-shadow:0 6px 15px #10272767;
}
.local-preview .call-avatar { width:32px; height:32px; font-size:14px }
.local-preview small { font-size:10px; max-width:78px; text-align:center }
.call-controls { flex:none; display:flex; justify-content:center; gap:25px; padding:1px 0 }
.call-control {
  display:grid; justify-items:center; gap:4px; min-width:47px;
  border:0; background:none; color:inherit; font-size:11px; padding:0 3px;
}
.call-control-icon { width:43px; height:43px; display:grid; place-items:center; border-radius:50%; background:#ffffff1a; position:relative }
.call-control.off .call-control-icon { background:#d2e3da; color:#1a3530 }
.call-control.hangup .call-control-icon { background:#c3424b; color:white }
.mic-icon:before { content:""; width:6px; height:12px; border:1.5px solid currentColor; border-radius:7px; margin-top:-4px }
.mic-icon:after { content:""; width:11px; height:10px; position:absolute; top:17px; border:1.5px solid currentColor; border-top:0; border-radius:0 0 7px 7px }
.cam-icon:before { content:""; width:14px; height:10px; border:1.5px solid currentColor; border-radius:3px; margin-right:4px }
.cam-icon:after { content:""; width:5px; height:7px; position:absolute; top:18px; right:10px; border:1.5px solid currentColor; border-left:0; border-radius:0 2px 2px 0 }
.end-icon:before { content:""; width:17px; height:8px; border:4px solid currentColor; border-bottom:0; border-radius:13px 13px 4px 4px; margin-top:4px }
.call-prompt { display:grid; gap:3px; color:#d7e5df; padding:9px 10px; font-size:12px; background:#ffffff0b; border-radius:8px }
.call-prompt strong { color:#f4f9f6 }
.journey-dark .journey-demo { margin:0; color:#c4d5ce }
.journey-dark .journey-demo summary { padding:2px 0; min-height:20px }
.journey-dark .journey-demo .btn { color:#def3e6 }
@media (max-width:760px) {
  .phone-space:has(.phone-journey) { padding:0 }
  .phone-journey { width:100%; height:calc(100svh - 16px); min-height:420px; border-radius:12px }
  .journey-content { padding-inline:14px }
  .journey-footer { padding-inline:12px }
}

.account-link { margin-left:auto }
.service-order { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.8fr); gap:12px; align-items:center }
.service-order>div,.service-order label { display:grid; gap:4px; font-size:12px; color:#506259 }
.service-order strong { color:#203b2c; overflow-wrap:anywhere; font-size:14px }
.service-order select { width:100%; min-width:0 }
.service-basis { margin:7px 0 13px; color:#52645b; font-size:12px }
.service-choices { border:0; padding:0; margin:0; min-width:0 }
.service-choices legend { margin:0 0 6px; padding:0; font-size:13px; font-weight:700; color:#243e30 }
#serviceChoices { display:grid; gap:7px }
.service-choice {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:start; gap:8px;
  border:1px solid #dce8df; background:#fff; border-radius:9px; padding:10px; cursor:pointer;
}
.service-choice:has(input:checked) { border-color:#398657; background:#edf7ef; box-shadow:0 0 0 1px #39865720 }
.service-choice:has(input:focus-visible) { outline:2px solid #217346; outline-offset:2px }
.service-choice.service-disabled { background:#f6f8f6; cursor:default }
.service-choice input { margin:3px 0 0; width:16px; height:16px; accent-color:#217346 }
.service-copy,.service-price { display:grid; gap:3px }
.service-copy>strong { color:#203b2c; font-size:14px }
.service-copy>span { font-size:12px; color:#40594c }
.service-copy .service-rule { font-weight:650 }
.service-copy .service-blocked { color:#73523b }
.service-price { justify-items:end; white-space:nowrap; color:#234536 }
.service-price small { color:#53655c; font-size:11px }
.service-price b { font-size:15px; font-variant-numeric:tabular-nums }
.service-payment {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 12px; margin-top:11px;
  padding:10px 12px; border-radius:9px; border:1px solid #dce8df; background:#f0f7f1;
}
.service-payment>div { display:grid; gap:2px; color:#335344 }
.service-payment span { color:#4c6256; font-size:12px }
.service-payment strong { font-size:13px; overflow-wrap:anywhere }
.service-payment .payment-total { color:#1b683a; font-weight:740 }
.payment-warning { grid-column:1/-1; margin:0; font-size:12px; color:#9a352d }
.finance-accounts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; padding:13px }
.finance-card { padding:17px; border-radius:9px; background:#f6f7f7 }
.finance-card h2 { margin:0 0 14px; font-size:16px }
.finance-card dl { margin:0; display:grid; gap:14px }
.finance-card dt { padding-left:8px; border-left:3px solid #59b56d; font-size:13px; color:#526259 }
.finance-card dd { margin:4px 0 0 8px; font-weight:740; font-size:21px; font-variant-numeric:tabular-nums }
.finance-card .finance-deposit { color:#277bd0 }
.finance-ledger { margin-top:11px }
.finance-ledger table { min-width:1040px }
.finance-ledger td { white-space:nowrap }
.finance-ledger .expense { color:#9e362d; font-weight:680; font-variant-numeric:tabular-nums }
@media(max-width:480px) {
  .finance-accounts { grid-template-columns:1fr }
  .service-choice { gap:6px; padding:8px }
  .service-copy>span { font-size:11px }
  .service-price b { font-size:13px }
}

/* Separate the existing order entry point from the third-party flow. */

.handoff-note { margin:10px 0; font-size:13px; color:#51635a }
.notary-context { padding:5px 2px 8px; text-align:center; font-size:11px; color:#315b75 }
.journey-dark .notary-context { color:#bcdadf }

  position:fixed;z-index:1000;pointer-events:none;width:min(280px,calc(100% - 24px));

function newTask(o,d,status='consent') {
  d.app={id:'2026'+d.id.slice(4)+'01',status,charged:false};
  return d.app;
}
function markAccepted(d,expired=false,acceptedAt=expired?'2025-10-01':'2026-11-12') {
  const expires=String(Number(acceptedAt.slice(0,4))+1)+acceptedAt.slice(4);
  Object.assign(d.app,{status:'accepted',charged:true,acceptedAt,expires,expired});
  state.available--;
}
function loadPreset(key, initial=false) {
  clearTimeout(videoTimer);
  orders=fixtureOrders();
  Object.assign(merchants[0],{enabled:true,balance:480000,flashBalance:5000});
  Object.assign(merchants[1],{enabled:false,balance:125000,flashBalance:0});
  Object.assign(state,{
    demo:key,view:'merchant',opsPage:'orders',merchantPage:'orders',orderDetail:null,customerPage:'mine', customerTab:'全部',customerOrder:null,
    flowKey:null,notarySource:null,phoneScreen:'',merchant:'1',filters:{merchant:{},ops:{}},tabs:{merchant:'待发货',ops:'全部'},
    expanded:{merchant:false,ops:false},pages:{merchant:1,ops:1},configQuery:'',
    taskReadError:false,createError:false,identityError:false,identityFailed:false,cameraOn:true,micOn:true,available:120,ledger:[]
  });
  const [o,secondOrder,disabled]=orders, [doc]=o.docs;
  const seed = (status,order=o,time) => {
    const [document]=order.docs;
    const application=newTask(order,document,status);
    debitService(order,document,'storage',time);
    return application;
  };
  const seedStored = (expired=false) => {
    const date=expired?'2025-10-01':'2026-10-12';
    o.time=date+' 10:30:00';
    seed('waiting',o,date+' 10:35:00');
    markAccepted(doc,expired,date);
  };
  const showCustomer = (order=o) => {
    state.view='customer';
    state.customerPage='list';
    state.customerTab=order.status;
    state.customerOrder=order.id;
  };
  const showOps = () => { state.view='ops'; state.orderDetail=o.id; };
  const showMerchant = () => { state.view='merchant'; state.orderDetail=o.id; };
  switch(key) {
    case 'tasks': seed('consent'); seed('sign',secondOrder); showCustomer(secondOrder); state.customerPage='mine'; break;
    case 'launch': break;
    case 'closed-merchant': state.merchant=disabled.merchant; break;
    case 'low-balance': merchants[0].balance=500; showMerchant(); break;
    case 'quota': state.available=0; break;
    case 'create-error': state.createError=true; break;
    case 'query-error': seed('sign'); state.taskReadError=true; showCustomer(); break;
    case 'identity': seed('identity'); state.identityError=true; showCustomer(); break;
    case 'video-ready': seed('video'); seed('sign',secondOrder); showCustomer(); break;
    case 'video': seed('interrupted'); showCustomer(); break;
    case 'sign': seed('signFailed'); showCustomer(); break;
    case 'late': seed('waiting').late=true; showCustomer(); break;
    case 'supplement': seed('supplement').reason='视频核验资料需补充，请重新办理。'; showCustomer(); break;
    case 'refused': seed('refused').reason='公证处未受理，请联系商家。'; showCustomer(); break;
    case 'normal': seedStored(); o.status='租用中'; showOps(); break;
    case 'default':
      seedStored(); o.status='逾期付款'; o.defaultVerified=true; showMerchant(); break;
    case 'expired': seedStored(true); o.status='逾期付款'; o.defaultVerified=true; showMerchant(); break;
    case 'creditor':
      seedStored(); doc.app.certificate='creditor'; debitService(o,doc,'issue','2026-11-02 11:10:00');
      o.status='逾期付款'; o.defaultVerified=true; showOps(); break;
    case 'execute':
      seedStored();
      Object.assign(doc.app,{certificate:'issued',issueNumber:'（2026）演示赋证第'+doc.id.slice(-4)+'号',unpaidAfterIssue:true});
      debitService(o,doc,'issue','2026-11-02 11:10:00');
      o.status='逾期付款'; o.defaultVerified=true; showMerchant(); break;
  }
  if(!initial) {
    closeAllModals();
    render();
    window.scrollTo(0,0);
  }
}

function formFilter(view) {
  const filters=state.filters[view], expanded=state.expanded[view];
  const fields=filterSchema[view].map(([key,label,options,kind],i)=>{
    const value=filters[key]??'';
    const issueFilter=key==='issueApplication';
    const hidden=i>=8&&!expanded&&!issueFilter?' hidden':'';
    const emptyLabel=issueFilter?'全部':'请选择';
    const input=options?`<select name="${key}"${kind==='multiple'?' multiple size="2"':''}>${kind==='multiple'?'':`<option value="">${emptyLabel}</option>`}${options.map(o=>`<option${Array.isArray(value)?value.includes(o)?' selected':'':o===value?' selected':''}>${o}</option>`).join('')}</select>`

function matchingOrders(view) {

    const row=orderFields(o);
    return Object.entries(filters).every(([key,value])=>{
      if(!value||!value.length) return true;
      if(Array.isArray(value)) return value.includes(row[key]);

      if(key.endsWith('To')) return Boolean(row[key.slice(0,-2)])&&row[key.slice(0,-2)]<=value;

let returnFocus = null;
let toastTimer;
function notify(message) {
  $('toast').textContent = message;

  clearTimeout(toastTimer);

function showModal(title, body, foot, requirements) {
  if (!state.modals.length) {
    returnFocus = document.activeElement;
    $('prototypeShell').inert = true;
    document.body.style.overflow = 'hidden';
  } else {
    const parent = state.modals.at(-1);
    parent.draft = { body: [...$('modalBody').childNodes], foot: [...$('modalFoot').childNodes], focus: document.activeElement, scroll: $('modalBody').scrollTop };
  }
  state.modals.push({ title, body, foot, requirements });
  renderModal();
}
function renderModal() {
  const modal = state.modals.at(-1);
  if (!modal) {
    $('modalOverlay').classList.remove('open');
    $('prototypeShell').inert = false;
    document.body.style.overflow = '';
    if (returnFocus?.isConnected) returnFocus.focus();
    returnFocus = null;
    refreshGuide();
    return;
  }
  $('modalTitle').textContent = modal.title;
  if (modal.draft) {
    $('modalBody').replaceChildren(...modal.draft.body);
    $('modalFoot').replaceChildren(...modal.draft.foot);
  } else {
    $('modalBody').innerHTML = modal.body;
    $('modalFoot').innerHTML = modal.foot;
  }
  $('modalPrd').innerHTML = `<h2>${modal.title} · 弹窗说明</h2>${modal.requirements.map(([heading, items]) => section(heading, items, '')).join('')}`;
  $('modalOverlay').classList.add('open');
  $('modalOverlay').scrollTop = 0;
  $('modalBody').scrollTop = modal.draft?.scroll ?? 0;
  $('modalPrd').scrollTop = 0;
  const focusTarget = modal.draft?.focus?.isConnected ? modal.draft.focus : $('closeModal');
  focusTarget.focus({ preventScroll: true });
  refreshGuide();
}
function popModal() {
  if (!state.modals.length) return;
  state.modals.pop();
  renderModal();
}
function closeAllModals() {
  if (!state.modals.length) return;
  state.modals = [];
  renderModal();
}
function applyChange(message) {
  closeAllModals();
  render();
  const heading = $('prototypeStageTitle');
  heading.focus({ preventScroll: true });
  notify(message);
}
function error(message) {
  const target = $('modalError');
  target.textContent = message;
  target.hidden = false;
}

function serviceBlock(order,doc,kind) {
  const a=doc.app;
  if(order.status==='已取消')return '订单已取消';
  if(!merchantOf(order).enabled)return '该商家尚未开通公证服务';
  if(servicePaid(order,doc,kind))return '该文书已申请此项服务';
  if(kind==='storage') {
    if(a)return '该文书已申请存证';
    if(order.status!=='待发货')return '待发货订单可发起';
    const pending=orders.flatMap(evidence).filter(item=>!item.app.charged&&
      ['consent','identity','notice','video','interrupted','sign','signFailed','waiting','supplement'].includes(item.app.status)).length;
    return state.available<=pending?'存证服务暂不可用，请联系平台':'';
  }
  if(kind==='issue') {
    if(a?.certificate)return '该文书已申请赋强公证书';
    if(a?.status!=='accepted')return '公证处受理存证后可申请';
    if(a.expired)return '存证有效期已届满';
    return order.defaultVerified?'':'核实债务人违约后可申请';
  }
  if(a?.execution)return '该文书已申请执行证书';
  if(a?.certificate!=='issued')return '赋强公证书出具后可申请';
  return a.unpaidAfterIssue?'':'核实出证后仍未清偿后可申请';
}

function submitService(form) {
  const order=orderById(form.dataset.order);
  if(state.view!=='merchant'||order?.merchant!==state.merchant)return error('请在订单所属店铺申请。');
  if(order.docs.length!==1)return error('当前订单的办理文书无法确认。');
  const [doc]=order.docs;
  const kind=form.elements.service.value;
  if(!Object.hasOwn(services,kind))return error('请选择一项可申请的公证服务。');
  const blocked=serviceBlock(order,doc,kind);
  if(blocked)return error(blocked+'。');
  const service=services[kind], cents=service.fee(doc), balance=merchantOf(order).balance;
  if(balance<cents)return error('可用资金不足，尚差 '+money(cents-balance)+'。');
  if(state.createError) {
    state.createError=false;
    return error('模拟提交失败，未扣款。请重试。');
  }
  if(kind==='storage')newTask(order,doc);
  if(kind==='issue')doc.app.certificate='review';
  if(kind==='execution')doc.app.execution='execReview';
  debitService(order,doc,kind);
  popModal();
  if($('fulfillNotary')&&state.modals.length)$('fulfillNotary').innerHTML=fulfillmentNotary(order);
  render();
  showModal('公证服务申请成功',
    details([['服务项目',service.name],['文书编号',doc.id],['扣款账户',walletName],['已扣金额',money(cents)],['可用资金',money(balance-cents)]])+
    info(kind==='storage'?'客户可从快租订单跳转到第三方小程序办理。':'申请已提交，等待公证处审核。'),
    backButton(state.modals.length?'返回':'关闭')+b('查看收支明细','merchant-finance','','primary'),[

function certActions(o,d) {

  if(a.status==='refused'||a.status==='supplement') return b('终止办理','stop-modal',key);
  if(a.status!=='accepted'||!o.defaultVerified) return '';
  switch(a.execution||a.certificate) {
    case 'review':return b('模拟审核通过','issue-approved',key,'subtle')+b('模拟退回补件','issue-return',key)+b('模拟拒绝出证','issue-refused',key);
    case 'supplement':return b('补件并重新提交','issue-resubmit',key,'subtle');
    case 'creditor':return b('债权人在线签署','creditor-modal',key,'primary');
    case 'issueReady':return b('模拟出具赋强公证书','issue-issued',key,'subtle');
    case 'issued':return a.unpaidAfterIssue?'':b('模拟核实仍未清偿','unpaid',key,'subtle');
    case 'execReview':return b('模拟出具执行证书','execution-issued',key,'subtle')+b('模拟拒绝出具','execution-refused',key);

const guideChapters=Object.keys(operationGuides);
let operationGuide=null;
let guideTimer;
let guideAnchor;
let guideCaptionPanel;
let guideBubbleFrame;

function openOperationGuide() {
  if(operationGuide)operationGuide.playing=false;
  clearTimeout(guideTimer);
  const chapters=Object.entries(operationGuides).map(([key,guide])=>`
    <article class="guide-chapter">

    <div class="guide-catalog">${chapters}</div>`,
    backButton('关闭')+b('播放完整流程','guide-start','all','primary'),[
      ['播放控制',['播放完整流程会依次加载四段的演示样例。播放本段只播放所选章节。','每步按文案长度停留约 3–5 秒。暂停可停留查看当前页面，继续后接着播放。打开演示目录时会暂停当前播放。']],

    ]);
}

function startOperationGuide(key) {
  const chapters=key==='all'?guideChapters:[key];
  playGuideChapter(chapters,0);
}

function playGuideChapter(chapters,chapterIndex) {
  clearTimeout(guideTimer);
  const key=chapters[chapterIndex];
  const guide=operationGuides[key];
  if(!guide)return;
  operationGuide={key,chapters,chapterIndex,index:0,playing:true};
  loadPreset(guide.preset);
  refreshGuide(true);
}

function toggleGuidePlayback() {
  if(!operationGuide)return;
  operationGuide.playing=!operationGuide.playing;
  refreshGuide(operationGuide.playing);
  document.querySelector('.operation-guide:not([hidden]) [data-act="guide-toggle"]')?.focus({preventScroll:true});
}

function endOperationGuide() {
  operationGuide=null;
  refreshGuide();
}

function guideTarget(selector) {
  return Array.from(document.querySelectorAll(selector)).find(element=>
    !element.closest('[inert]')&&!element.disabled&&element.getClientRects().length);
}

function positionGuideBubble() {
  const bubble=$('guideBubble');
  if(guideAnchor?.isConnected)guideCaptionPanel.classList.add('guide-caption-anchored');
  const anchor=guideAnchor?.isConnected&&guideAnchor.getBoundingClientRect();
  const margin=12;
  const gap=14;
  const viewport={width:document.documentElement.clientWidth,height:window.innerHeight};
  const visible=anchor&&anchor.right>0&&anchor.left<viewport.width&&anchor.bottom>0&&anchor.top<viewport.height;
  if(!visible) {
    bubble.hidden=true;
    guideCaptionPanel?.classList.remove('guide-caption-anchored');
    return;
  }

  bubble.hidden=false;
  const {offsetWidth:width,offsetHeight:height}=bubble;
  const panel=guideCaptionPanel.getBoundingClientRect();
  const centerX=(anchor.left+anchor.right)/2;
  const centerY=(anchor.top+anchor.bottom)/2;
  const clamp=(value,min,max)=>Math.max(min,Math.min(value,max));
  const centeredX=clamp(centerX-width/2,margin,viewport.width-width-margin);
  const centeredY=clamp(centerY-height/2,margin,viewport.height-height-margin);
  const positions=[
    ['right',anchor.right+gap,centeredY],
    ['left',anchor.left-width-gap,centeredY],
    ['bottom',centeredX,anchor.bottom+gap],
    ['top',centeredX,anchor.top-height-gap]
  ];
  const placement=positions.find(([,x,y])=>
    x>=margin&&y>=margin&&x+width<=viewport.width-margin&&y+height<=viewport.height-margin&&
    (x+width<=panel.left||x>=panel.right||y+height<=panel.top||y>=panel.bottom));
  guideCaptionPanel.classList.toggle('guide-caption-anchored',Boolean(placement));
  bubble.hidden=!placement;
  if(!placement)return;
  const [side,x,y]=placement;
  bubble.dataset.side=side;
  bubble.style.left=x+'px';
  bubble.style.top=y+'px';
  bubble.style.setProperty('--arrow-x',clamp(centerX-x,16,width-16)+'px');
  bubble.style.setProperty('--arrow-y',clamp(centerY-y,16,height-16)+'px');
}

function queueGuideBubble() {
  if(!guideAnchor||guideBubbleFrame)return;
  guideBubbleFrame=requestAnimationFrame(()=>{
    guideBubbleFrame=null;
    positionGuideBubble();
  });
}
window.addEventListener('scroll',queueGuideBubble,{capture:true,passive:true});
window.addEventListener('resize',queueGuideBubble);

function refreshGuide(locate=false) {
  clearTimeout(guideTimer);
  document.querySelectorAll('.guide-target').forEach(element=>element.classList.remove('guide-target'));
  const containers=[$('pageGuide'),$('modalGuide')];
  const modal=state.modals.at(-1);
  const current=operationGuide&&modal?.title!=='操作演示'?$(modal?'modalGuide':'pageGuide'):null;
  containers.forEach(container=>{
    container.hidden=container!==current;
    if(container.hidden) {
      container.replaceChildren();
      delete container.dataset.step;
    }
  });
  if(guideCaptionPanel!==current)guideCaptionPanel?.classList.remove('guide-caption-anchored');
  guideCaptionPanel=current;
  guideAnchor=null;
  $('guideBubble').hidden=true;
  if(!current)return;
  const {key,index,chapters,chapterIndex,playing}=operationGuide;
  const guide=operationGuides[key];
  const step=guide.steps[index];
  const target=step?guideTarget(step[2]):null;
  const nextChapter=!step&&chapters[chapterIndex+1];
  const complete=!step&&!nextChapter;
  const all=chapters.length>1;
  const progress=step?`第 ${index+1} / ${guide.steps.length} 步`:nextChapter?'本段完成':'播放完成';
  const contents=`
    <div class="guide-kicker"><strong>${all?`${chapterIndex+1} / ${chapters.length} · `:""}${guide.title}</strong>
      <span>${progress}</span></div>
    <p class="guide-step-copy" role="status"><strong>${step?step[0]:nextChapter?'本段结果':'已完成'}</strong><span>${step?step[1]:guide.result}</span></p>
    ${step&&!target?`<p class="guide-hint">${state.phoneScreen==='connecting'?'正在连接视频，连接后自动继续。':'回到当前步骤对应的页面即可继续，也可重新播放。'}</p>`:''}
    ${nextChapter?`<p class="guide-hint">下一段 · ${operationGuides[nextChapter].title}</p>`:''}
    <div class="guide-actions">
      ${complete?b(all?'从头播放':'重播本段','guide-start',all?'all':key,'primary'):b(playing?'暂停':'继续播放','guide-toggle','','subtle')}
      ${b('演示目录','guide-menu','','text')}
      ${complete?'':b('重新播放','guide-start',all?'all':key,'text')}
      ${b('结束演示','guide-end','','text')}
    </div>`;
  const signature=[key,index,all,playing,Boolean(target),state.phoneScreen==='connecting'].join(':');
  if(current.dataset.step!==signature) {
    current.innerHTML=contents;
    current.dataset.step=signature;
  }
  if(target) {
    const highlight=target.matches('input[type=radio],input[type=checkbox]')?target.closest('label')??target:target;
    highlight.classList.add('guide-target');
    guideAnchor=highlight;
    $('guideBubbleProgress').textContent=progress;
    $('guideBubbleTitle').textContent=step[0];
    $('guideBubbleCopy').textContent=step[1];
    if(locate)highlight.scrollIntoView({block:'center',inline:'nearest'});
    positionGuideBubble();
  } else {
    current.classList.remove('guide-caption-anchored');
    if(locate&&!step)current.scrollIntoView({block:'nearest'});
  }
  if(!playing)return;
  if(nextChapter) {
    guideTimer=setTimeout(()=>playGuideChapter(chapters,chapterIndex+1),4000);
  } else if(target) {
    const readingTime=Math.min(5400,Math.max(3200,1500+step[1].length*95));
    guideTimer=setTimeout(runGuideStep,readingTime);
  }
}

function advanceGuide(position) {
  if(operationGuide!==position.guide||operationGuide.index!==position.index)return;
  const validation=state.modals.length&&$('modalError');
  if(validation&&!validation.hidden) {
    operationGuide.playing=false;
    refreshGuide();
    return;
  }
  operationGuide.index++;
  refreshGuide(true);
}

function runGuideStep() {
  if(!operationGuide)return;
  const step=operationGuides[operationGuide.key].steps[operationGuide.index];
  const target=step&&guideTarget(step[2]);
  if(!target)return;
  if(target instanceof HTMLSelectElement) {
    target.value=step[3];
    target.dispatchEvent(new Event('change',{bubbles:true}));
  } else if(target.matches('input:checked,details[open] > summary')) {
    advanceGuide({guide:operationGuide,index:operationGuide.index});
  } else {
    target.click();
  }
}

function trackGuideStep(event) {
  if(!operationGuide)return;
  const step=operationGuides[operationGuide.key].steps[operationGuide.index];
  const target=step&&event.target.closest(step[2]);
  if(!target||target!==guideTarget(step[2]))return;
  if(target.matches('input,select')) {
    if(event.type!=='change'||(target.matches('input')&&!target.checked))return;
    if(step[3]&&target.value!==step[3])return;
  } else if(event.type!=='click')return;
  const position={guide:operationGuide,index:operationGuide.index};
  setTimeout(()=>advanceGuide(position),0);
}

document.addEventListener('click',trackGuideStep,true);
document.addEventListener('change',trackGuideStep,true);

  'order-detail-modal':id=>{closeAllModals();actions['order-detail'](id);},
  memo:id=>editOrder('memo',orderById(id)),
  'edit-group':id=>editOrder('edit-group',orderById(id)),
  fulfill:id=>fulfill(orderById(id)),
  'service-apply':id=>openServices(orderById(id)),
  record:id=>record(orderById(id)),
  'customer-home':()=>{state.customerPage='mine';render();window.scrollTo(0,0);},
  'customer-list':tab=>{
    state.customerPage='list';
    state.customerTab=tab;
    render();
    document.querySelector('.quick-order-tabs [aria-pressed="true"]')?.scrollIntoView({block:'nearest',inline:'nearest'});
  },
  'customer-detail':customerOrder,
  'open-notary':key=>openNotary(key),
  'query-retry':()=>{state.taskReadError=false;applyChange('办理状态已更新');},
  'phone-back':phoneBack,
  'phone-preview':()=>showPhonePage('preview'),
  'confirm-consent':key=>{if(checked())updateStatus(key,'consent','identity','已确认本份公证申请');},
  'identity-check':key=>{
    if(state.identityError) {
      state.identityError=false;
      state.identityFailed=true;
      showPhonePage();
      return;
    }
    state.identityFailed=false;
    updateStatus(key,'identity','notice','身份核验完成');
  },
  'notice-confirm':key=>{if(checked())updateStatus(key,'notice','video','已确认办理须知');},
  'video-permission-denied':()=>showPhonePage('permission'),
  'video-join':joinVideo,
  'video-mic':()=>toggleVideoDevice('micOn','video-mic'),
  'video-camera':()=>toggleVideoDevice('cameraOn','video-camera'),
  'video-hangup':()=>phoneBack('hangup'),
  'video-complete':()=>{
    if(state.phoneScreen!=='room') return;
    const [,doc]=getDoc(state.flowKey);
    doc.app.status='sign';
    showPhonePage('video-done');
  },
  'doc-preview':docPreview,
  'sign-success':key=>signResult(key,'success'),
  'sign-failed':key=>signResult(key,'failure'),
  'sign-delay':key=>signResult(key,'delay'),
  'late-retry':key=>{
    const [,d]=getDoc(key);
    if(d.app.status==='waiting'&&d.app.late){d.app.late=false;showPhonePage();}
  },
  'accept-evidence':key=>{
    const [,d]=getDoc(key);
    if(d.app.status!=='waiting'||d.app.late||d.app.charged)return;
    if(state.available<1)return notify('套餐额度不足，等待运营处理');
    markAccepted(d);
    delete d.app.reason;
    showPhonePage();
  },
  'reject-material':key=>{
    const [,d]=getDoc(key); if(d.app.status!=='waiting')return;
    d.app.reason='视频核验资料需补充，请重新办理。';
    updateStatus(key,'waiting','supplement','公证处已退回补件');
  },
  'refuse-evidence':key=>{
    const [,d]=getDoc(key);if(d.app.status!=='waiting')return;
    d.app.reason='公证处未受理，请联系商家。';
    updateStatus(key,'waiting','refused','已收到公证处未受理结果');
  },
  'supplement-retry':key=>updateStatus(key,'supplement','video','请在原申请补充视频核验'),
  'stop-modal':key=>checkModal('终止赋强公证办理',info('适用于未受理或待补件且无法继续的演示申请。'),
    '确认终止','stop-confirm',key,'已确认无法继续办理',['当前申请保留终止状态。'],['确认后结束原任务。取消保留当前状态。']),
  'stop-confirm':key=>{
    if(!checked())return;
    const [o,d]=getDoc(key);
    if(!['refused','supplement'].includes(d.app.status))return;
    d.app.status='closed';
    refreshRecord(o,'本份申请已终止');
  },
  'issue-approved':key=>certificateTransition(key,'review','creditor','公证处审核通过，待债权人在线签署',{reason:''}),
  'issue-return':key=>certificateTransition(key,'review','supplement','已退回补件',{reason:'请补充违约通知及还款记录。'}),
  'issue-resubmit':key=>certificateTransition(key,'supplement','review','已在原申请补件，等待审核',{reason:''}),
  'issue-refused':key=>certificateTransition(key,'review','refused','已收到拒绝出证结果',{reason:'公证处审查后未出具赋强公证书。'}),
  'creditor-modal':creditorModal,
  'creditor-sign':key=>{if(checked())certificateTransition(key,'creditor','issueReady','债权人已签署，等待公证处出证');},
  'issue-issued':key=>certificateTransition(key,'issueReady','issued','公证处已出具赋强公证书',{issueNumber:'（2026）演示赋证第'+getDoc(key)[1].id.slice(-4)+'号'}),
  unpaid:key=>{const [o,doc]=getDoc(key);doc.app.unpaidAfterIssue=true;refreshRecord(o,'已模拟核实出证后仍未清偿');},
  'execution-issued':key=>certificateTransition(key,'execReview','executed','公证处已出具执行证书',{executionNumber:'（2026）演示执证第'+getDoc(key)[1].id.slice(-4)+'号'}),
  'execution-refused':key=>certificateTransition(key,'execReview','execRefused','已收到拒绝出具执行证书结果'),
  'qr-scan':()=>showPhonePage('scan'),
  'qr-open':key=>openNotary(key,'scan'),
  'close-modal':popModal
};
for(const kind of ['address','deposit','mode','proof','bill','risk','lease-view','identity-view','snapshot']) {
  actions[kind]=id=>existingModal(kind,orderById(id));
}
function readFilters(form) {
  const values={};
  for(const [key,value] of new FormData(form)) {
    if(key==='statusMore') (values[key]??=[]).push(value);
    else values[key]=value.trim();
  }
  return values;
}
const forms = {
  configFilter:form=>{state.configQuery=new FormData(form).get('query').trim();render();},
  orderFilter:form=>{state.filters[form.dataset.view]=readFilters(form);state.pages[form.dataset.view]=1;render();},
  merchantConfig:saveConfig,
  fulfillForm:saveFulfillment,
  serviceForm:submitService,
  editOrderForm:form=>{
    const o=orderById(form.dataset.order),value=new FormData(form).get('value').trim();
    o[form.dataset.kind==='memo'?'memo':'group']=value;
    applyChange('已保存');
  }
};
document.addEventListener('click',event=>{
  const action=event.target.closest('[data-act]');
  if(action)actions[action.dataset.act](action.dataset.value);
  const role=event.target.closest('[data-prototype-view]');
  if(role) {
    if(role.dataset.prototypeView==='notary'&&state.view!=='notary') state.notarySource=null;
    changeView(role.dataset.prototypeView);
  }
  const opsPage=event.target.closest('[data-ops-page]');
  if(opsPage){state.opsPage=opsPage.dataset.opsPage;state.orderDetail=null;changeView('ops');}
});
document.addEventListener('submit',event=>{
  const submit=forms[event.target.getAttribute('id')];
  if(!submit)return;
  event.preventDefault();
  submit(event.target);
});
document.addEventListener('change',event=>{
  const target=event.target;
  if(target.id==='scenePreset'){endOperationGuide();loadPreset(target.value);return;}
  if(target.id==='merchantAccount'){state.merchant=target.value;state.orderDetail=null;ordersReset('merchant');return;}
  if(target.name==='proof'&&target.form?.id==='fulfillForm'){$('proofCount').textContent=target.files.length+' / 9';return;}
  const form=target.closest('#serviceForm');
  if(form)updateServiceForm(form);
});
$('closeModal').addEventListener('click', popModal);
$('modalOverlay').addEventListener('click', event => {
  if (event.target === $('modalOverlay')) popModal();
});
document.addEventListener('keydown', event => {
  if (!state.modals.length) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    popModal();
  }
  if (event.key !== 'Tab') return;
  const focusable = [...$('modalOverlay').querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), [tabindex="0"]')];
  const first = focusable[0], last = focusable.at(-1);
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

const layout = $('prototypeLayout');
const divider = $('prototypeResizer');
const defaultPreviewRatio = 68;
const ratioStorageKey = 'dmrentals-notary-prd-width';
function setPaneRatio(value, save = true) {
  const ratio = Math.max(46, Math.min(77, Math.round(value)));
  layout.style.setProperty('--prototype-pane-fr', `${ratio}fr`);
  layout.style.setProperty('--prd-pane-fr', `${100 - ratio}fr`);
  divider.setAttribute('aria-valuenow', String(ratio));
  if (save) {
    try { localStorage.setItem(ratioStorageKey, String(ratio)); } catch {}
  }
}
let savedRatio = defaultPreviewRatio;
try { savedRatio = Number(localStorage.getItem(ratioStorageKey)) || defaultPreviewRatio; } catch {}
setPaneRatio(savedRatio, false);
let resizingPanes = false;
function moveDivider(event) {
  const bounds = layout.getBoundingClientRect();
  setPaneRatio(100 * (event.clientX - bounds.left - 14) / (bounds.width - 28), false);
}
divider.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  resizingPanes = true;
  divider.classList.add('dragging');
  document.body.classList.add('is-resizing');
  divider.setPointerCapture(event.pointerId);
  moveDivider(event);
});
divider.addEventListener('pointermove', event => { if (resizingPanes) moveDivider(event); });
function finishDrag() {
  if (!resizingPanes) return;
  resizingPanes = false;
  divider.classList.remove('dragging');
  document.body.classList.remove('is-resizing');
  setPaneRatio(Number(divider.getAttribute('aria-valuenow')));
}
divider.addEventListener('pointerup', finishDrag);
divider.addEventListener('pointercancel', finishDrag);
divider.addEventListener('dblclick', () => setPaneRatio(defaultPreviewRatio));
divider.addEventListener('keydown', event => {
  const current = Number(divider.getAttribute('aria-valuenow'));
  const options = { ArrowLeft: current - 2, ArrowRight: current + 2, Home: 46, End: 77, '0': defaultPreviewRatio };
  if (!(event.key in options)) return;
  event.preventDefault();
  setPaneRatio(options[event.key]);
});
$('prdToggle').addEventListener('click', () => {
  const collapsed = layout.classList.toggle('prd-collapsed');
  $('prdToggle').textContent = collapsed ? '展开说明' : '收起说明';
  $('prdToggle').setAttribute('aria-expanded', String(!collapsed));
});
$('scenePreset').innerHTML=presets.map(([key,label])=>'<option value="'+key+'">'+label+'</option>').join('');
loadPreset('launch',true);
render();
if(matchMedia('(max-width: 760px)').matches) focusPhonePage();

</script>

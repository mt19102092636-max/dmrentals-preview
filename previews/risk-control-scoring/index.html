function enumValues(f,c){return [...new Set([...(f.values||[]),...(c.enums?.[f.id]||[])])]}

// Flat editor: AND has precedence over OR. Legacy trees expand equivalently.
function treeToRows(node){

function rowsToTree(rows){const groups=[];for(const row of rows){if(!groups.length||row.join==='OR')groups.push([]);const leaf=cp(row);delete leaf.join;groups[groups.length-1].push(leaf);}const parts=groups.map(g=>tree(...g));return parts.length===1?parts[0]:{id:uid(),logic:'OR',children:parts};}

    function cls(level){return level==='低风险'?'low':level==='中风险'?'mid':'high'}\n    function renderManualReports(){const section=$('#manualSection'),count=$('#calledCount');section.hidden=!manualReports.length;$('#manualRows').innerHTML=manualReports.map(item=>`\u003ctr>\u003ctd>${item.name}\u003c/td>\u003ctd>${riskTag(item.result)}\u003c/td>\u003ctd>运营手动获取 · ${item.note}\u003c/td>\u003c/tr>`).join('');count.textContent=manualReports.length?`基座已调取 7 项 · 手动补充 ${manualReports.length} 项`:'基座已调取 7 项'}\n    function renderRiskProducts(){const labels={auto:'已调取',pending:'未调取',fetching:'获取中',done:'已获取'};$('#productRows').innerHTML=riskProducts.map(item=>`\u003ctr>\u003ctd>\u003cb>${item.name}\u003c/b>\u003cbr>\u003cspan class=\"source\">${item.note}\u003c/span>\u003c/td>\u003ctd>${item.source}\u003c/td>\u003ctd>${item.method}\u003c/td>\u003ctd>\u003cspan class=\"modal-state ${item.state}\">${labels[item.state]}\u003c/span>\u003c/td>\u003ctd>${item.result==='—'?'\u003cspan class=\"source\">—\u003c/span>':riskTag(item.result)}\u003c/td>\u003ctd>\u003cbutton class=\"fetch-btn\" data-fetch=\"${item.id}\" ${item.state==='pending'?'':'disabled'}>${item.state==='pending'?'去获取':item.state==='fetching'?'获取中…':'已获取'}\u003c/button>\u003c/td>\u003c/tr>`).join('');document.querySelectorAll('[data-fetch]').forEach(button=>button.onclick=()=>manualFetch(button.dataset.fetch))}\n    function manualFetch(id){const item=riskProducts.find(product=>product.id===id);if(!item||item.state!=='pending')return;item.state='fetching';renderRiskProducts();setTimeout(()=>{item.state='done';item.method='运营手动获取';item.result='未命中';item.note='获取成功';manualReports=manualReports.filter(report=>report.id!==id).concat(item);renderRiskProducts();renderManualReports()},700)}\n    function buildNav(){$('#groups').innerHTML=data.map(([name,items])=>`\u003csection class=\"group\">\u003ch3>${name}\u003c/h3>\u003cdiv class=\"grade-grid\">${items.map(x=>`\u003cbutton class=\"grade ${x===current?'active':''}\" data-id=\"${x[0]}\">${x[0]}\u003c/button>`).join('')}\u003c/div>\u003c/section>`).join('');document.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{current=data.flatMap(x=>x[1]).find(x=>x[0]===b.dataset.id);buildNav();render()})}\n    function riskTag(result){const tone=['一致','正常','2年以上','低风险','已返回'].includes(result)?'low':['未命中'].includes(result)?'none':['需关注','中风险'].includes(result)?'mid':'high';return `\u003cspan class=\"tag ${tone}\">${result}\u003c/span>`}\n    function reportRows(items){return items.map(([name,result,note])=>`\u003ctr>\u003ctd>${name}\u003c/td>\u003ctd>${riskTag(result)}\u003c/td>\u003ctd>${note}\u003c/td>\u003c/tr>`).join('')}\n    function render(){const [code,level,desc,advice,action]=current,c=cls(level),riskClass='risk-'+c,resultText=level==='低风险'?'风控通过':level==='中风险'?'风控关注':'风控预警',standardDecision=level==='低风险'?'订单整体风险较低，履约能力与意愿表现良好。':level==='中风险'?'订单存在部分风险提示，建议商家结合保证金策略审慎决策。':'订单存在较高违约或欺诈风险，建议谨慎处理发货。',longRentDecision={T1:'订单整体风险较低，履约能力与意愿表现良好，建议直接发货。',T2:'订单整体风险较低，履约能力与意愿表现良好，建议直接发货。',T3:'订单整体风险较低，履约能力与意愿表现良好，建议直接发货。',T4:'订单整体风险较低，履约能力与意愿表现良好，建议直接发货。',T5:'订单整体风险较低，履约能力与意愿表现良好，推荐发货。',T6:'订单存在部分风险提示，建议商家结合保证金策略审慎决策，建议商家基于风险偏好选择性发货。',T7:'订单存在较高违约或欺诈风险，建议谨慎处理发货，如需发货建议提高押金比例。',T8:'订单存在较高违约或欺诈风险，建议谨慎处理发货，如需发货建议提高押金比例。',T9:'订单存在较高违约或欺诈风险，建议谨慎处理发货，不建议发货。',T10:'订单存在较高违约或欺诈风险，建议谨慎处理发货，不建议发货。'},decision=longRentDecision[code]||standardDecision+advice,explain=longRentDecision[code]?'':desc,severe=['T9','T10','S5','L09','L10'].includes(code),fraudHit=severe?'命中':'未命中',industryRisk=level==='低风险'?'低风险':level==='中风险'?'中风险':'高风险';$('#report').className='report '+mode+' '+riskClass;$('#sourceText').textContent=mode==='simple'?'基于租安盾大数据结果预测':'基于租安盾及行业数据结果预测';$('#summary').innerHTML=`\u003cdiv class=\"summary-kicker\">${resultText}\u003cspan class=\"mini-tag\">租安盾数据已核验\u003c/span>\u003c/div>\u003cdiv class=\"decision-copy\">\u003cb>【风控建议】\u003c/b>\u003cstrong class=\"decision-level\">${level}\u003c/strong>${decision}\u003c/div>${explain?`\u003cp class=\"risk capeHtml(status) + '\u003c/td>';\n  }\n\n  function renderRow(row, productNames, fields) {\n    const conditions = evaluationRows(row.eval);\n    if (!conditions.length) conditions.push({});\n    const span = ' rowspan=\"' + conditions.length + '\"';\n    const name = '\u003cth scope=\"rowgroup\"' + span + '>\u003cstrong>' + escapeHtml(row.name) + '\u003c/strong>' +\n      (row.compound ? '\u003cspan class=\"rs-label\">复合规则\u003c/span>' : '') +\n      (row.veto ? '\u003cspan class=\"rs-label rs-veto\">一票否决\u003c/span>' : '') +\n      (row.product ? '\u003csmall>' + escapeHtml(row.product) + '\u003c/small>' : '') +\n      '\u003c/th>';\n    const score = '\u003ctd class=\"rs-points\"' + span + '>' +\n      (row.contribution === null ? '—' : points(row.contribution)) +\n      (row.explanation ? '\u003csmall>' + escapeHtml(row.explanation) + '\u003c/small>' : '') + '\u003c/td>';\n    return '\u003ctbody>' + conditions.map((condition, index) =>\n      '\u003ctr>' + (index === 0 ? name : '') + renderConditionCells(condition, productNames, fields, row.compound) +\n      (index === 0 ? score : '') + '\u003c/tr>'\n    ).join('') + '\u003c/tbody>';\n  }\n\n  function renderTable(rows, productNames, fields, adjustment = []) {\n    return '\u003cdiv class=\"rs-table-wrap\">\u003ctable class=\"rs-table\">\u003ccolgroup>\u003ccol class=\"rs-rule-col\">\u003ccol class=\"rs-condition-col\">' +\n      '\u003ccol class=\"rs-order-col\">\u003ccol class=\"rs-hit-col\">\u003ccol class=\"rs-score-col\">\u003c/colgroup>' +\n      '\u003cthead>\u003ctr>\u003cth scope=\"col\">评分规则名称\u003c/th>\u003cth scope=\"col\">判断条件\u003c/th>\u003cth scope=\"col\">订单情况\u003c/th>' +\n      '\u003cth scope=\"col\">是否命中\u003c/th>\u003cth scope=\"col\">计入分\u003c/th>\u003c/tr>\u003c/thead>' +\n      rows.map(row => renderRow(row, productNames, fields)).join('') +\n      adjustment.map(product => '\u003ctbody>\u003ctr>\u003cth scope=\"row\">产品封顶调整\u003csmall>' + escapeHtml(product.name) +\n        '\u003c/small>\u003c/th>\u003ctd colspan=\"3\">聚合 ' + points(product.before) + '，封顶后 ' + points(product.score) +\n        '\u003c/td>\u003ctd class=\"rs-points\">' + points(product.score - product.before) + '\u003c/td>\u003c/tr>\u003c/tbody>').join('') +\n      '\u003c/table>\u003c/div>';\n  }\n\n  function renderReportScoreDetail(panel, snapshot) {\n    const heading = '\u003ch2 id=\"reportScoreHeading\">风控评分\u003c/h2>';\n    const result = snapshot?.result;\n    if (!result) {\n      panel.innerHTML = heading + '\u003cp class=\"rs-empty\">暂无风控评分\u003c/p>';\n      return;\n    }\n\n    const productNames = new Map(result.products.map(p => [p.id, displayProductName(p.name)]));\n    const fields = snapshot.scoreFields || [];\n    const matched = [];\n    const other = [];\n    for (const product of result.products) {\n      for (const rule of product.rows.filter(r => r.enabled)) {\n        const row = {...rule, product: productNames.get(product.id), veto: rule.hit && rule.veto, contribution: rule.kept ? rule.score : 0,\n          explanation: rule.hit ? (rule.kept ? '' : '取最高未计入，配置 ' + points(rule.score)) : '规则未命中'};\n        (rule.hit ? matched : other).push(row);\n      }\n    }\n    for (const rule of result.compounds.filter(r => r.enabled)) {\n      const row = {...rule, compound: true, contribution: rule.result,\n        explanation: rule.hit ? '' : '规则未命中'};\n      (rule.hit ? matched : other).push(row);\n    }\n    for (const rule of snapshot.unavailableCompounds || []) {\n      other.push({...rule, compound: true, contribution: null, explanation: '未参与：所需产品未取得有效结果'});\n    }\n\n    const adjustment = result.products.filter(p => p.before !== p.score)\n      .map(p => ({...p, name: productNames.get(p.id)}));\n    const rows = [...matched, ...other];\n    const scoreLabel = result.complete ? '综合总分' : '当前暂定得分';\n    const pending = result.pending.map(id => productNames.get(id) || id);\n    const strategy = snapshot.baseName\n      ? '\u003cspan class=\"rs-strategy\">' + escapeHtml(snapshot.baseName) + '\u003c/span>'\n      : '';\n    panel.innerHTML = '\u003cdiv class=\"rs-heading\">\u003cdiv class=\"rs-title\">' + heading + strategy + '\u003c/div>' +\n      '\u003cdiv class=\"rs-total\">\u003cspan>' + scoreLabel + '\u003c/span>\u003cstrong>' + escapeHtml(result.total) +\n      '\u003c/strong> 分\u003c/div>\u003c/div>' +\n      (pending.length ? '\u003cp class=\"rs-notice\">待取得有效结果：' + escapeHtml(pending.join('、')) + '\u003c/p>' : '') +\n      (result.vetoes.length ? '\u003cp class=\"rs-notice\">一票否决：' +\n        escapeHtml(result.vetoes.map(v => v.name).join('、')) + '，风险等级定为高风险。\u003c/p>' : '') +\n      (rows.length || adjustment.length ? renderTable(rows, productNames, fields, adjustment) :\n        '\u003cp class=\"rs-empty\">本次暂无评分规则明细\u003c/p>') +\n      '\u003cdiv class=\"rs-footer\">\u003cspan>产品得分 \u003cb>' + result.base + '\u003c/b>\u003c/span>\u003cspan>复合附加分 \u003cb>' +\n      result.extra + '\u003c/b>\u003c/span>\u003cspan>' + scoreLabel + ' \u003cb>' + result.total + ' 分\u003c/b>\u003c/span>\u003c/div>';\n  }\n\n  window.renderReportScoreDetail = renderReportScoreDetail;\n})();\n\n\u003c/script>\n\u003cscript>\n(()=>{const e=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));let snapshot=null;function send(type,product){parent.postMessage({type,product},window.origin==='null'?'*':window.origin)}function paint(o){snapshot=o;const r=o.result;document.title=o.id+' · 风控报告';document.querySelectorAll('.report-system-preview,.risk-preview-controls,.risk-alert,.summary,.footnote,aside,.report-navline').forEach(n=>n.hidden=true);const info=document.querySelector('.info');if(info)info.innerHTML='\u003cdiv>订单号\u003cbr>\u003cb>'+e(o.id)+'\u003c/b>\u003c/div>\u003cdiv>命中风控规则\u003cbr>\u003cb>'+e(o.baseName)+'\u003c/b>\u003c/div>\u003cdiv>评分版本\u003cbr>\u003cb>V'+o.scoreVersion+'\u003c/b>\u003c/div>\u003cdiv>报告版本\u003cbr>\u003cb>R'+o.revision+'\u003c/b>\u003c/div>';let pa .id)?'本单补充获取':'内部信息')+'\u003c/p>\u003ctable class=\"modal-table\">\u003cthead>\u003ctr>\u003cth>评分字段\u003c/th>\u003cth>本单返回结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+p.fields.map(f=>'\u003ctr>\u003ctd>'+e(f.name)+'\u003c/td>\u003ctd>'+e(f.value)+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003cp>命中规则：'+(p.rules.map(x=>e(x.name)+'（'+x.score+' 分'+(x.veto?'，一票否决':'')+'）').join('、')||'无')+'\u003c/p>\u003cbutton data-linked-update=\"'+p.id+'\">补充 / 更新本单数据\u003c/button>\u003c/section>').join('')+'\u003csection>\u003ch3>自动重算记录\u003c/h3>'+o.revisions.slice().reverse().map(v=>'\u003cp>R'+v.revision+' · '+e(v.time)+' · '+e(v.reason)+' → '+v.score+' 分（'+(v.delta>=0?'+':'')+v.delta+'）\u003c/p>').join('')+'\u003c/section>';const btn=document.querySelector('#reportListBtn');if(btn){btn.textContent='补充获取产品';btn.onclick=()=>send('report-supplement-request')}document.querySelectorAll('.report-head time,.report-head p').forEach(n=>n.hidden=true);const count=document.querySelector('#calledCount');if(count)count.textContent=o.products.length+' 项本单产品与内部信息';const close=document.querySelector('.topbar .help');if(close){close.textContent='本单数据评分报告';close.removeAttribute('href')}}window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==window.origin)return;if(event.data?.type==='order-score-snapshot')paint(event.data.payload)});document.addEventListener('click',event=>{const pid=event.target.dataset.linkedUpdate;if(pid)send('report-update-request',pid);if(event.target.id==='linkedSupplement')send('report-supplement-request')});send('report-ready')})();\n\n\u003c/script>\u003c/body>\n\u003c/html>\n";</script><script>

function reportConditionSnapshot(o){

    .map(r=>({name:r.name,eval:evalTree(r.conditions,values,c)}));

function scoringChanges(before,after){if(!after)return [];const out=[],value=v=>v===undefined||v===null||v===''?'（空）':v==='sum'?'命中规则求和':v==='max'?'命中规则取最高':typeof v==='boolean'?(v?'是':'否'):String(v);function fields(a,b,prefix,map){for(const [k,label] of Object.entries(map)){let x=a?.[k],y=b?.[k];if(k==='conditions'){x=x?formatCond(x,true):'';y=y?formatCond(y,true):''}if(JSON.stringify(x??null)!==JSON.stringify(y??null))out.push(prefix+' · '+label+'：'+value(x)+' → '+value(y))}}function rulesDiff(old=[],next=[],prefix){for(const id of new Set([...old,...next].map(r=>r.id))){const a=old.find(r=>r.id===id),b=next.find(r=>r.id===id);const name=prefix+' / '+(b?.name||a?.name)+' ['+id+']';if(!a)out.push(name+'：新增');if(!b)out.push(name+'：删除');fields(a,b,name,{name:'规则名称',score:'分值',note:'备注',enabled:'启用',veto:'一票否决',conditions:'判断条件'})}}

function renderCompounds(){return `<div class="card"><div class="between"><div><h2>复合场景加权</h2><p class="muted">按“产品 → 命中字段 → 运算符 → 内容”添加条件，使用且 / 或组合。每条命中后加一次分。</p></div><button class="primary" data-action="addCompound">＋ 新建复合规则</button></div><div class="table-wrap"><table><thead><tr><th>启用</th><th>规则名称 / 备注</th><th>命中条件</th><th>附加分</th><th>操作</th></tr></thead><tbody>${config.compounds.map(r=>`<tr><td>${toggle(r.enabled,'compoundToggle',r.id,r.name+'启用状态')}</td><td><b>${E(r.name)}</b><small>${E(r.note||'未填写备注')}</small></td><td><div class="condition-chips">${tokens(r.conditions,true)}</div></td><td class="score">+${r.score}</td><td><button class="link" data-action="editCompound" data-id="${r.id}">编辑</button><button class="link" data-action="copyCompound" data-id="${r.id}">复制</button><button class="link danger" data-action="deleteCompound" data-id="${r.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无复合场景规则</td></tr>'}</tbody></table></div></div>`}
function renderLevels(){return `<div class="card"><div class="between"><div><h2>风险等级与一票否决</h2><p class="muted">先计算总分，再匹配分数等级；任何已启用的一票否决规则命中，最终等级直接为高风险。</p></div><button data-action="addLevel">＋ 新增等级</button></div><div class="notice orange"><b>一票否决</b>不受产品取最高、分值封顶、负分抵扣影响。命中来源在试算中逐条展示，分数仍保留用于解释。</div><div class="table-wrap"><table><thead><tr><th>标识</th><th>等级名称</th><th>下限（含）</th><th>上限（含）</th><th>处置建议</th><th>操作</th></tr></thead><tbody>${config.levels.map(l=>`<tr><td><input type="color" value="${E(l.color)}" data-level="${l.id}" data-key="color" aria-label="${E(l.name)}颜色"></td><td><input value="${E(l.name)}" data-level="${l.id}" data-key="name" aria-label="等级名称" ${l.id===config.highLevelId?'disabled':''} style="width:120px">${l.id===config.highLevelId?'<small>一票否决固定目标</small>':''}</td><td><input type="number" step="1" value="${l.min??''}" placeholder="无下限" data-level="${l.id}" data-key="min" aria-label="${E(l.name)}下限"></td><td><input type="number" step="1" value="${l.max??''}" placeholder="无上限" data-level="${l.id}" data-key="max" aria-label="${E(l.name)}上限"></td><td><input value="${E(l.advice)}" data-level="${l.id}" data-key="advice" aria-label="${E(l.name)}处置建议" style="min-width:230px"></td><td><button class="link danger" data-action="deleteLevel" data-id="${l.id}" ${l.id===config.highLevelId?'disabled':''}>删除</button></td></tr>`).join('')}</tbody></table></div><p class="hint">支持负分，首档下限留空；最后一档上限留空。区间连续无重叠，整数分值，不由AI参与计算。</p></div>`}
function renderCatalog(){const ps=PRODUCTS.filter(p=>(catalogKind==='all'||p.kind===catalogKind)&&(p.label.includes(catalogSearch)||FIELDS.some(f=>f.product===p.id&&f.name.includes(catalogSearch))));return `<div class="card"><div class="between"><div><h2>产品字段字典</h2><p class="muted">已整理Excel中的35项与83个命中字段；详情为报告展示内容，不自动变成评分条件。</p></div><button data-action="import">导入评分配置</button></div><div class="row wrap" style="margin-bottom:18px"><input id="catalogSearch" value="${E(catalogSearch)}" placeholder="搜索产品或字段" aria-label="搜索字典"><select id="catalogKind">${opt('all','全部35项',catalogKind)}${opt('third','第三方产品',catalogKind)}${opt('internal','内部风险信息',catalogKind)}</select><button data-action="searchCatalog">查询</button></div><div class="table-wrap"><table><thead><tr><th>调用 / 来源</th><th>产品名称</th><th>命中字段</th><th>待确认信息</th><th>操作</th></tr></thead><tbody>${ps.map(p=>{const fs=FIELDS.filter(f=>f.product===p.id);return `<tr><td>${p.kind==='internal'?'<span class="tag orange">内部信息</span>':`<label><input ${baseId===GLOBAL_SCORE_ID?'disabled':''} type="checkbox" data-call="${p.id}" ${config.called.includes(p.id)?'checked':''} aria-label="调用${E(p.label)}">${baseId===GLOBAL_SCORE_ID?'可配置评分':'纳入调用'}</label>`}</td><td><b>${E(p.label)}</b><small>${E(p.source)}</small></td><td>${fs.length}个<small>${fs.map(f=>E(f.name)).join('、')||'未提供'}</small></td><td class="catalog-notes">${E(p.notes.join('；')||([...new Set(fs.flatMap(f=>f.notes).filter(n=>!n.startsWith('原表写')&&!n.includes('手机号侧')))].join('；')))||'<span class="muted">按本次Excel配置</span>'}</td><td><button class="link" data-action="fields" data-id="${p.id}">字段与详情</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function activeConfig(){return testSource==='live'?store.bases[baseId].live:config}
function inputControl(f,value,attr,label,blank=true,c=config){const ar=`${attr} aria-label="${E(label||f.name)}"`;if(f.type==='enum')return `<select ${ar} ${enumValues(f,c).length?'':'disabled'}>${blank?'<option value="">未返回 / 空值</option>':''}${enumValues(f,c).map(v=>opt(v,v,value)).join('')}</select>`;return `<input type="${f.type==='date'?'date':'number'}" ${f.type==='number'?`min="${f.min}" ${f.max!==null?'max="'+f.max+'"':''} step="${f.step}"`:''} value="${E(value??'')}" ${ar} placeholder="留空表示缺失">`}
function renderTest(){const c=activeConfig()||config;return `<div class="card"><div class="between"><div><h2>模拟试算</h2><p class="muted">可修改83个字段的模拟值。明确的“未返回 / 查询异常”枚举可被配置命中；真正空值不参与判断。</p></div><div class="row wrap"><select id="testSource" aria-label="试算配置来源">${opt('draft','当前草稿',testSource)}${opt('live','已发布版本',testSource,!store.bases[baseId].live)}</select><button data-action="sample">普通样例</button><button data-action="vetoSample">一票否决样例</button><button data-action="emptySample">全部置空</button><button class="primary" data-action="calculate">运行试算</button></div></div><div class="test-layout"><div class="test-fields">${PRODUCTS.filter(p=>p.kind==='internal'||c.called.includes(p.id)).map(p=>`<details ${p.id==='p01'||p.id==='p02'?'open':''}><summary><b>${E(p.label)}</b><small> ${FIELDS.filter(f=>f.product===p.id).length}个字段</small></summary>${FIELDS.filter(f=>f.product===p.id).map(f=>`<div class="test-input"><label>${E(f.name)}</label>${inputControl(f,testValues[f.id],`data-test="${f.id}"`,p.no+'. '+f.name,true,c)}<small>${E(f.unit)}</small></div>`).join('')||'<div class="hint">未提供可用字段</div>'}</details>`).join('')}</div><div id="testOutput">${renderResult()}</div></div></div>`}
function renderEval(ev){return ev.parts?`<div class="trace"><small>${ev.logic==='AND'?'且：全部满足':'或：任一满足'} · ${ev.hit?'命中':'未命中'}</small>${ev.parts.map(renderEval).join('')}</div>`:`<p class="hint">${E(productOf(ev.product)?.name)} / ${E(ev.field)}：${E(ev.raw??'空值')} ${E(ev.op==='between'?'介于':ev.op)} ${E(ev.value)}${ev.op==='between'?' 至 '+E(ev.upper):''} → ${E(ev.reason)}</p>`}
function renderResult(){if(!testResult)return '<div class="empty result-empty"><div style="font-size:34px">◎</div><h3>准备验证评分</h3><p>选择样例或编辑字段后运行试算。<br>一票否决命中会单独标识。</p><span class="tag">不会调用真实产品接口</span></div>';const r=testResult;return `<div class="result-top ${r.vetoes.length?'veto-result':''}"><div><div class="muted">${r.vetoes.length?'保留计算分数':'风险总分'}</div><span class="big-score">${r.total}</span> 分</div><div style="text-align:right"><span class="tag" style="color:${r.level?.color};background:white">${E(r.level?.name||'未匹配')}</span><p>${E(r.level?.advice||'')}</p></div></div><p class="formula">产品得分 ${r.base} ＋ 复合附加分 ${r.extra} ＝ ${r.total}分</p>${r.vetoes.length?`<div class="veto-alert"><b>一票否决命中，最终直接定高风险</b><p>分数原本对应：${E(r.byScore?.name||'未匹配')}。强制等级不受负分、产品取高和封顶影响。</p>${r.vetoes.map(v=>`<div>${E(v.product)} / ${E(v.id)} ${E(v.name)}</div>`).join('')}</div>`:''}${r.missing?`<div class="notice orange">${r.missing}个被启用规则引用的字段为空，不参与判断。低分不代表信息完整。</div>`:''}<div class="between"><h3>计算过程</h3><button class="link" data-action="exportTrace">导出试算记录</button></div><div class="trace">${r.products.filter(p=>p.rows.length).map(p=>`<details ${p.score!==0||p.rows.some(x=>x.hit&&x.veto)?'open':''}><summary><b>${E(p.name)}</b><span class="score" style="float:right">${p.score}分</span></summary><p class="hint">${p.mode==='sum'?'命中规则求和':'命中规则取最高'} ${p.before}分 → ${p.cap===null?'无封顶':'封顶'+p.cap+'分'} → ${p.score}分</p>${p.rows.map(row=>`<details><summary>${E(row.id)} ${E(row.name)} <span class="tag ${row.hit&&row.veto?'red':row.kept?'green':''}">${row.hit&&row.veto?'一票否决命中':row.kept?'计入 '+row.score+'分':E(row.reason)}</span></summary><p class="hint">${E(row.note)}</p>${renderEval(row.eval)}</details>`).join('')}</details>`).join('')}<details open><summary><b>复合场景加权</b><span class="score" style="float:right">${r.extra}分</span></summary>${r.compounds.map(x=>`<details><summary>${E(x.name)} · ${x.hit?'命中 +'+x.result+'分':x.enabled?'未命中':'已停用'}</summary>${renderEval(x.eval)}</details>`).join('')}</details></div>`}
function renderHistory(){const b=store.bases[baseId];return `<div class="card"><h2>评分版本</h2><p class="muted">按35项产品/内部信息保存快照。新草稿不改变已发布版本，回滚生成新版本。</p><div class="table-wrap"><table><thead><tr><th>版本</th><th>时间</th><th>版本说明</th><th>基础 / 复合规则</th><th>操作</th></tr></thead><tbody>${b.versions.map((v,i)=>`<tr><td>V${i+1} ${i===b.versions.length-1?'<span class="tag green">生效</span>':''}</td><td>${v.time}</td><td>${E(v.note)}</td><td>${count(v.config)} / ${v.config.compounds.length}</td><td><button class="link" data-action="viewVersion" data-id="${i}">查看快照</button><button class="link" data-action="rollback" data-id="${i}" ${i===b.versions.length-1?'disabled':''}>回滚</button></td></tr>`).reverse().join('')||'<tr><td colspan="5" class="empty">暂无发布版本</td></tr>'}</tbody></table></div></div><div class="card"><h2>操作日志</h2>${b.logs.slice(0,50).map((l,i)=>`<div class="audit"><div class="between"><b>${E(l.action)}</b><small>${l.time} · admin</small></div><p>${E(l.detail)}</p>${l.before||l.after?`<button class="link" data-action="viewLog" data-id="${i}">查看变更前后</button>`:''}</div>`).join('')||'<div class="empty">暂无日志</div>'}</div>`}
function modal(title,body,footer='',wide=false){previousFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${E(title)}"><header><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button></header><div class="modal-body">${body}</div><footer>${footer||'<button data-action="close">关闭</button>'}</footer></section></div>`;$('#overlay button')?.focus()}
function hideModal(){$('#overlay').innerHTML='';modalType='';confirmed=null;previousFocus?.focus?.()}
function confirmDialog(title,body,fn){confirmed=fn;modal(title,`<p>${E(body)}</p>`,'<button data-action="cancelConfirm">取消</button><button class="primary" data-action="confirmAction">确认</button>')}
function closeModal(){if(confirmed){confirmed=null;if(edit){renderRuleEditor();return;}hideModal();return;}if(edit){confirmDialog('放弃规则编辑？','未保存的规则修改将被丢弃。',()=>{edit=null;hideModal()});return;}hideModal()}
function findRule(id){for(const p of config.products){const r=p.rules.find(r=>r.id===id);if(r)return {p,r};}return null}
function newId(prefix){let n=1;const ids=new Set([...rules(),...config.compounds].map(r=>r.id));while(ids.has(prefix+String(n).padStart(3,'0')))n++;return prefix+String(n).padStart(3,'0')}
function firstField(pid){return FIELDS.find(f=>f.product===pid&&available(f,config))}
function leafFor(pid){const f=firstField(pid);return f?condition(f.id,'=',f.type==='enum'?enumValues(f,config)[0]:''):{id:uid(),product:pid,field:'',op:'=',value:''}}
function openRule(id,product,compound=false){const old=compound?config.compounds.find(r=>r.id===id):findRule(id)?.r;const pid=old?.product||product||'p01';const r=old?cp(old):{id:newId(compound?'C':'R'),name:'',product:compound?undefined:pid,score:compound?1:0,note:'',enabled:true,...(!compound?{veto:false}:{}),conditions:tree(leafFor(pid))};let rows;try{rows=treeToRows(r.conditions)}catch(error){toast(error.message);return;}edit={rows,compound,data:r,oldProduct:old?.product||null,isNew:!old};renderRuleEditor()}
function syncEdit(){if(!edit||!$('#editName'))return;const r=edit.data;r.conditions=rowsToTree(edit.rows);r.name=$('#editName').value;r.note=$('#editNote').value;r.score=$('#editScore').value===''?NaN:Number($('#editScore').value);r.enabled=$('#editEnabled').checked;if(!edit.compound)r.veto=$('#editVeto').checked}
function renderRuleEditor(){modalType='rule';const r=edit.data;modal((edit.isNew?'新增':'编辑')+(edit.compound?'复合场景加权':'基础评分规则'),`<div id="ruleError"></div><div class="form-grid"><label class="field">规则名称 <span class="required">*</span><input id="editName" maxlength="60" value="${E(r.name)}" placeholder="填写清晰的命中规则名称"></label>${edit.compound?'':`<label class="field">所属产品模块 <span class="required">*</span><select id="editProduct">${PRODUCTS.map(p=>opt(p.id,p.label,r.product,!firstField(p.id))).join('')}</select></label>`}<label class="field">${edit.compound?'复合附加分':'分值'} <span class="required">*</span><input id="editScore" type="number" step="1" ${edit.compound?'min="0"':''} value="${Number.isNaN(r.score)?'':r.score}"><small>${edit.compound?'命中后在产品总分基础上叠加一次':'支持负数、0与正整数'}</small></label><label class="field wide-field">备注<textarea id="editNote" rows="2" maxlength="500" placeholder="填写业务解释、适用范围或调整原因">${E(r.note)}</textarea></label></div><div class="row wrap rule-options"><label><input id="editEnabled" type="checkbox" ${r.enabled?'checked':''}>启用此规则</label>${!edit.compound?`<label><input id="editVeto" type="checkbox" ${r.veto?'checked':''}>一票否决（命中直接定高风险）</label>`:''}</div>${!edit.compound&&r.veto?'<div class="notice orange">一票否决不受产品聚合、封顶与负分抵扣影响；仍保留命中分数与过程。</div>':''}<div class="between"><h3>判断条件配置</h3><span class="tag">${edit.compound?'先选产品，再选字段及内容':'仅所属产品的命中字段'}</span></div><p class="hint">${edit.compound?'至少涉及2项产品/内部信息；逐条选择产品及条件，通过相邻行之间的“且 / 或”连接。':'切换所属产品会清空原有条件，避免跨产品字段混用。'}</p>${renderFlatConditions()}<p class="hint">实际空值不命中任何比较；枚举仅支持等于/不等于，日期与数值支持比较及区间。</p>`,`<button data-action="close">取消</button><button class="primary" data-action="saveRule">保存规则</button>`,true)}
function renderFlatConditions(){return `<div class="flat-conditions">${edit.rows.map((n,i)=>`${i?`<div class="flat-relation"><select data-node="${n.id}" data-prop="join" aria-label="判断条件关系符">${opt('AND','且（全部满足才命中）',n.join)}${opt('OR','或（满足任一即可命中）',n.join)}</select></div>`:''}${renderNode(n)}`).join('')}<button data-action="addCondition">＋ 添加条件</button></div><p class="hint">判断顺序：先算“且”，再算“或”。例如：A 且 B 或 C，表示 A、B 同时满足，或 C 满足，即命中。</p><div class="condition-preview"><b>命中说明</b><div id="conditionPreview">${E(formatCond(rowsToTree(edit.rows),edit.compound))}</div></div>`}
function refreshConditionPreview(){const el=$('#conditionPreview');if(el&&edit)el.textContent=formatCond(rowsToTree(edit.rows),edit.compound)}
function renderNode(n){const f=fieldOf(n.field),fs=FIELDS.filter(f=>f.product===n.product);return `<div class="condition-line ${edit.compound?'compound-line':''}">${edit.compound?`<label class="condition-part product-part"><small>产品 / 内部信息</small><select data-node="${n.id}" data-prop="product" aria-label="条件所属产品">${PRODUCTS.map(p=>opt(p.id,p.label,n.product,!firstField(p.id))).join('')}</select></label>`:''}<label class="condition-part field-part"><small>可命中的条件</small><select data-node="${n.id}" data-prop="field" aria-label="命中条件字段">${fs.length?'':'<option value="">该产品未提供字段</option>'}${fs.map(f=>opt(f.id,f.name,n.field,!available(f,config))).join('')}</select></label><label class="condition-part op-part"><small>运算符</small><select data-node="${n.id}" data-prop="op" aria-label="判断条件运算符">${(f?.type==='enum'?['=','≠']:['=','≠','>','≥','<','≤','between']).map(op=>opt(op,op==='between'?'介于':op,n.op)).join('')}</select></label><div class="condition-part value-part"><small>条件内容${f?.unit?'（'+E(f.unit)+'）':''}</small>${f?inputControl(f,n.value,`data-node="${n.id}" data-prop="value"`,'选择条件内容',false):'<input disabled placeholder="请先选择字段">'}${n.op==='between'&&f?`<div class="range-extra"><span>至</span>${inputControl(f,n.upper,`data-node="${n.id}" data-prop="upper"`,'条件上限',false)}<label><input type="checkbox" data-node="${n.id}" data-prop="lowerInclusive" ${n.lowerInclusive?'checked':''}>含下限</label><label><input type="checkbox" data-node="${n.id}" data-prop="upperInclusive" ${n.upperInclusive?'checked':''}>含上限</label></div>`:''}</div><button class="link danger remove-condition" data-action="removeNode" data-id="${n.id}" aria-label="删除条件">×</button></div>${f?.notes.filter(x=>!x.startsWith('原表写')).length?`<p class="hint condition-note">${E(f.notes.filter(x=>!x.startsWith('原表写')).join(' '))}</p>`:''}`}

or:#666e76;font-size:12px}#risk-audit .ra-dates>div{display:flex;align-items:center;background:white;border:1px solid #dce1e5;border-radius:3px}#risk-audit .ra-dates input{width:126px;border:0;padding:0 5px}#risk-audit .ra-keyword input{width:250px;max-width:100%}#risk-audit .ra-query{display:flex;justify-content:flex-end;gap:9px;margin-top:10px}#risk-audit button.primary{background:#67c23a;border-color:#67c23a}#risk-audit td,#risk-audit th{border:1px solid #ebeef5;padding:9px 12px;font-weight:400}#risk-audit th{background:#fafbfd;color:#909399}#risk-audit td{color:#606266}#risk-audit td small{color:#909399;font-size:11px;line-height:1.9}#risk-audit table{table-layout:fixed}#risk-audit summary{cursor:pointer;color:#7d8790;font-size:11px;margin-top:3px}#risk-audit .ra-change{font-size:12px;margin:5px 0;color:#606266}#risk-audit footer{gap:10px;margin-top:10px;flex-wrap:wrap}#risk-audit .ra-pagination{display:flex;gap:8px;align-items:center;color:#909399}#risk-audit .ra-pagination button{min-width:28px;padding:4px 7px;border:0;background:#f4f5f7}#risk-audit .ra-pagination button.primary{background:#67c23a;color:white}#risk-audit .ra-prototype,#risk-audit .ra-prototype button{font-size:11px;color:#9aa1a8}#risk-audit .ra-info{margin-top:10px}@media(max-width:850px){#risk-audit .ra-filter-main{flex-wrap:wrap}#risk-audit .ra-dates{width:100%}}\n';
function actual(){let list=[];if(typeof allOperationLogs==='function')list=allOperationLogs().map((l,i)=>({...l,id:l.id||'LOCAL-'+i,object:l.baseName,summary:l.detail,module:l.module==='订单自动评分'?'订单风控':l.module==='风控基座'?'风控规则':l.module,scope:l.scope||(l.module==='评分机制'?'全局评分配置':l.module==='订单自动评分'?'仅本单':'指定规则'),result:l.result||'成功',state:l.state||(l.action.includes('草稿')?'草稿未发布':'已记录'),version:l.version||'历史记录未采集',reason:l.reason||l.detail,changes:(l.changes||[]).map(c=>Array.isArray(c)?c:['变更内容','—',c])}));try{list.push(...JSON.parse(localStorage.getItem('risk-audit-local-v1')||'[]'))}catch{}return list.map(l=>({...l,time:Number.isFinite(new Date(l.time).getTime())?new Date(l.time).toLocaleString('sv-SE'):l.time})).sort((a,b)=>(b.stamp||new Date(b.time).getTime())-(a.stamp||new Date(a.time).getTime()))}
const field=(name,label,values)=>`<label>${label}<select name="${name}"><option value="">全部</option>${values.map(v=>`<option ${filters[name]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
function render(error=''){
const logs=source==='demo'?demos:actual();
current=logs.filter(l=>(!filters.start||l.time.slice(0,10)>=filters.start)&&(!filters.end||l.time.slice(0,10)<=filters.end)&&(!filters.action||l.action===filters.action)&&(!filters.actor||l.actor===filters.actor)&&(!filters.keyword||JSON.stringify(l).toLowerCase().includes(filters.keyword.toLowerCase())));
const total=Math.max(1,Math.ceil(current.length/pageSize));page=Math.min(page,total);
const select=(name,label,values,all)=>`<label>${label}<select name="${name}" aria-label="${label}"><option value="">${all}</option>${values.map(v=>`<option ${filters[name]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
dialog.innerHTML=`<header><h2>操作记录</h2><button data-ra="close" aria-label="关闭操作记录">×</button></header><div class="ra-body"><form id="ra-form"><div class="ra-filter-main"><div class="ra-dates"><span>操作时间</span><div><input aria-label="开始日期" type="date" name="start" value="${esc(filters.start||'')}"><span>至</span><input aria-label="结束日期" type="date" name="end" value="${esc(filters.end||'')}"></div></div>${select('actor','操作人',[...new Set(logs.map(l=>l.actor))],'全部员工')}${select('action','动作',[...new Set(logs.map(l=>l.action))],'全部动作')}</div><label class="ra-keyword">关键字<input name="keyword" placeholder="请输入规则与变更摘要关键字" value="${esc(filters.keyword||'')}"></label><div class="ra-query"><button class="primary" type="submit">查询</button><button type="button" data-ra="reset">重置</button></div></form>${error?`<p class="ra-error" role="alert">${esc(error)}</p>`:''}<div class="ra-table"><table><colgroup><col style="width:18%"><col style="width:13%"><col style="width:16%"><col style="width:53%"></colgroup><thead><tr><th>操作时间</th><th>操作人</th><th>动作</th><th>规则与变更摘要</th></tr></thead><tbody>${current.slice((page-1)*pageSize,page*pageSize).map(l=>`<tr><td>${esc(l.time)}</td><td>${esc(l.actor)}</td><td>${esc(l.action)}</td><td><div>${esc(l.object)}</div><small>${esc(l.summary)}</small><small>${esc(l.scope)}${l.state&&l.state!=='已生效'?'；'+esc(l.state):''}${l.result==='失败'?'；执行失败':''}</small><details><summary>展开变更</summary>${l.changes.map(c=>`<div class="ra-change">${esc(c[0])}：${esc(c[1])} → ${esc(c[2])}</div>`).join('')||'<div class="ra-change">无字段变化，记录操作结果。</div>'}${l.version&&l.version!=='—'?`<div class="ra-change">版本：${esc(l.version)}</div>`:''}<div class="ra-change">说明：${esc(l.reason||'未填写')}</div><button class="ra-link" data-ra="detail" data-id="${esc(l.id)}">查看完整记录</button></details></td></tr>`).join('')||'<tr><td colspan="4" class="ra-empty">暂无符合条件的操作记录</td></tr>'}</tbody></table></div><footer><div class="ra-prototype"><span>${source==='demo'?'原型示例记录':'本机操作记录'}</span> · <button class="ra-link" data-ra="${source==='demo'?'local':'demo'}">${source==='demo'?'查看本机操作':'查看示例'}</button></div><div class="ra-pagination"><select aria-label="每页条数" id="ra-size">${[10,20,50].map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n}条/页</option>`).join('')}</select><span>共 ${current.length} 条</span><button data-ra="prev" ${page===1?'disabled':''}>‹</button>${Array.from({length:total},(_,i)=>`<button data-ra="page" data-page="${i+1}" class="${page===i+1?'primary':''}">${i+1}</button>`).join('')}<button data-ra="next" ${page===total?'disabled':''}>›</button></div></footer></div>`;
}
function detail(id){const l=current.find(x=>x.id===id);if(!l)return;const info={'操作对象':l.object,'操作人':l.actor,'操作时间':l.time,'影响范围':l.scope,'执行结果 / 生效状态':l.result+' / '+l.state,'关联版本':l.version||'历史记录未采集','操作说明 / 触发原因':l.reason||'未填写','事件编号':l.id};dialog.innerHTML=`<header><h2>操作详情 · ${esc(l.action)}</h2><button data-ra="close" aria-label="关闭操作日志">×</button></header><div class="ra-body"><button class="ra-link" data-ra="back">← 返回操作日志</button><h3>基本信息与影响范围</h3><div class="ra-info">${Object.entries(info).map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div><h3>变更前后</h3><div class="ra-table"><table><thead><tr><th>变更字段</th><th>变更前</th><th>变更后</th></tr></thead><tbody>${l.changes.map(c=>`<tr>${c.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="3">无字段变化；本条记录为操作或状态事件。</td></tr>'}</tbody></table></div>${l.related?`<h3>关联事件</h3><button class="ra-link" data-ra="related" data-id="${esc(l.related)}">${esc(l.related)} · 查看关联产品更新 / 自动重算</button>`:''}<p class="ra-note">${source==='demo'?'示例记录 · 用于评审操作日志展示':'本机操作 · 不代表线上系统已发布'}。仅展示变化不触发评分重算。</p></div>`;dialog.querySelector('[data-ra="back"]').focus()}
function open(){focusBack=document.activeElement;render();if(!dialog.open)dialog.showModal()}
dialog.addEventListener('submit',e=>{e.preventDefault();const next=Object.fromEntries(new FormData(e.target));if(next.start&&next.end&&next.start>next.end){render('开始时间不能晚于结束时间');return}filters=next;page=1;render()});
dialog.addEventListener('change',e=>{if(e.target.id==='ra-size'){pageSize=Number(e.target.value);page=1;render();return}if(e.target.name==='module'){filters=Object.fromEntries(new FormData(dialog.querySelector('form')));filters.action='';page=1;render()}});
dialog.addEventListener('click',e=>{const b=e.target.closest('[data-ra]');if(!b)return;switch(b.dataset.ra){case'close':dialog.close();break;case'demo':case'local':source=b.dataset.ra;filters={};page=1;render();break;case'reset':filters={};page=1;render();break;case'page':page=Number(b.dataset.page);render();break;case'prev':page--;render();break;case'next':page++;render();break;case'detail':detail(b.dataset.id);break;case'related':current=source==='demo'?demos:actual();detail(b.dataset.id);break;case'back':render();break}});
dialog.addEventListener('close',()=>focusBack?.focus());
document.addEventListener('click',e=>{if(e.target.closest('#auditBtn,#filterAudit,[data-action="operationLogs"]')){e.preventDefault();e.stopImmediatePropagation();open()}},true);
window.riskAudit={open,record(record){const list=JSON.parse(localStorage.getItem('risk-audit-local-v1')||'[]');list.unshift({id:'LOCAL-'+Date.now(),time:new Date().toLocaleString('sv-SE'),actor:'admin（原型）',result:'成功',state:'已保存',...record});localStorage.setItem('risk-audit-local-v1',JSON.stringify(list))}};
if(new URLSearchParams(location.search).get('audit')==='1')open();
})();

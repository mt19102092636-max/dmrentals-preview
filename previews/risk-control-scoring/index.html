function enumValues(f,c){return [...new Set([...(f.values||[]),...(c.enums?.[f.id]||[])])]}
function leaves(n){return n?.children?n.children.flatMap(leaves):[n]}
function available(f,c){return !!f&&(productOf(f.product)?.kind==='internal'||c.called.includes(f.product))&&(f.type!=='enum'||enumValues(f,c).length>0)}
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T00:00:00Z'))&&new Date(v+'T00:00:00Z').toISOString().slice(0,10)===v}
function valueError(f,v,c){if(v===null||v===undefined||v==='')return '未返回 / 空值';if(f.type==='enum')return enumValues(f,c).includes(v)?'':'不属于已维护的枚举';if(f.type==='date')return validDate(v)?'':'日期无效';if((typeof v!=='number'&&typeof v!=='string')||String(v).trim()===''||!Number.isFinite(Number(v)))return '数值无效';const n=Number(v);if(n<f.min||(f.max!==null&&n>f.max))return '超出字段范围';if(f.step===1&&!Number.isInteger(n))return '仅支持整数';if(f.step===0.01&&Math.abs(n*100-Math.round(n*100))>1e-6)return '最多保留两位小数';return '';}
function compare(a,op,b){if(op==='=')return a===b;if(op==='≠')return a!==b;if(op==='>')return a>b;if(op==='≥')return a>=b;if(op==='<')return a<b;if(op==='≤')return a<=b;return false;}
function evalTree(n,values,c){if(n.children){const parts=n.children.map(ch=>evalTree(ch,values,c));return {logic:n.logic,parts,hit:n.children.length>0&&(n.logic==='AND'?parts.every(p=>p.hit):parts.some(p=>p.hit))};}const f=fieldOf(n.field),raw=values[n.field];let reason=!available(f,c)?'产品未调用或枚举待补充':valueError(f,raw,c);let hit=false;if(!reason){const a=f.type==='number'?Number(raw):raw;if(n.op==='between'){const lo=f.type==='number'?Number(n.value):n.value,hi=f.type==='number'?Number(n.upper):n.upper;hit=(n.lowerInclusive?a>=lo:a>lo)&&(n.upperInclusive?a<=hi:a<hi);}else hit=compare(a,n.op,f.type==='number'?Number(n.value):n.value);}return {fieldId:n.field,field:f?.name||n.field,product:f?.product,raw,op:n.op,value:n.value,upper:n.upper,lowerInclusive:n.lowerInclusive,upperInclusive:n.upperInclusive,hit,reason:reason||(hit?'命中':'条件不满足')};}
function calculate(c,values){const products=c.products.map(p=>{const rows=p.rules.map(r=>{const ev=evalTree(r.conditions,values,c);return {...r,eval:ev,hit:r.enabled&&ev.hit,kept:r.enabled&&ev.hit,reason:!r.enabled?'规则停用':ev.hit?'计入':'未命中'};});const hit=rows.filter(r=>r.hit);if(p.mode==='max'&&hit.length){const best=hit.reduce((a,b)=>a.score>=b.score?a:b);hit.filter(r=>r!==best).forEach(r=>{r.kept=false;r.reason='产品取最高，未计分'});}const before=rows.filter(r=>r.kept).reduce((s,r)=>s+r.score,0);return {id:p.id,name:productLabel(p.id),mode:p.mode,cap:p.cap,rows,before,score:p.cap===null?before:Math.min(before,p.cap)};});const base=products.reduce((s,p)=>s+p.score,0),compounds=c.compounds.map(r=>{const ev=evalTree(r.conditions,values,c);return {...r,eval:ev,hit:r.enabled&&ev.hit,result:r.enabled&&ev.hit?r.score:0}}),extra=compounds.reduce((s,r)=>s+r.result,0),total=base+extra,vetoes=products.flatMap(p=>p.rows.filter(r=>r.hit&&r.veto).map(r=>({id:r.id,name:r.name,product:p.name}))),byScore=c.levels.find(l=>(l.min===null||total>=l.min)&&(l.max===null||total<=l.max)),level=vetoes.length?c.levels.find(l=>l.id===c.highLevelId):byScore;
const referenced=[...new Set(c.products.flatMap(p=>p.rules.filter(r=>r.enabled).flatMap(r=>leaves(r.conditions).map(l=>l.field))).concat(c.compounds.filter(r=>r.enabled).flatMap(r=>leaves(r.conditions).map(l=>l.field))))];return {products,base,compounds,extra,total,vetoes,byScore,level,missing:referenced.filter(id=>values[id]===null||values[id]===undefined||values[id]==='').length};}
function validateTree(n,c,product=null,depth=0){if(!n||typeof n!=='object')return '条件结构无效';if(n.children){if(!Array.isArray(n.children)||!n.children.length||depth>4||!['AND','OR'].includes(n.logic))return '条件组不能为空且最多嵌套4层';for(const ch of n.children){const e=validateTree(ch,c,product,depth+1);if(e)return e;}return '';}const f=fieldOf(n.field);if(!f||n.product!==f.product)return '产品与条件字段不匹配';if(product&&f.product!==product)return '基础规则仅可配置所属产品的条件';if(!available(f,c))return '产品未调用或条件枚举尚未补充';const ops=f.type==='enum'?['=','≠']:['=','≠','>','≥','<','≤','between'];if(!ops.includes(n.op))return '运算符不适用于该字段类型';let e=valueError(f,n.value,c);if(e)return f.name+'：'+e;if(n.op==='between'){e=valueError(f,n.upper,c);if(e)return '区间上限：'+e;const a=f.type==='number'?Number(n.value):n.value,b=f.type==='number'?Number(n.upper):n.upper;if(a>b||(a===b&&(!n.lowerInclusive||!n.upperInclusive)))return '区间上下限或包含边界无效';if(typeof n.lowerInclusive!=='boolean'||typeof n.upperInclusive!=='boolean')return '请选择区间包含边界';}return '';}
function validateConfig(c){const errors=[];if(!c||c.schema!==2||!Array.isArray(c.products)||!Array.isArray(c.called)||!Array.isArray(c.compounds)||!Array.isArray(c.levels)||!c.enums||typeof c.enums!=='object')return ['配置格式不兼容，请使用35项逐产品版本'];if(c.products.length!==35||new Set(c.products.map(p=>p.id)).size!==35||c.products.some(p=>!productOf(p.id)))return ['必须完整保留35项产品/内部信息'];if(c.called.some(id=>!productOf(id)||productOf(id).kind!=='third')||new Set(c.called).size!==c.called.length)errors.push('调用产品清单无效');if(c.baseInfo&&(!c.baseInfo.name?.trim()||c.baseInfo.name.length>50||!['雕马快租','雕马闪租'].includes(c.baseInfo.biz)||!Number.isInteger(c.baseInfo.priority)||c.baseInfo.priority<1||c.baseInfo.priority>999))errors.push('请检查基座名称、适用业务及优先级（1—999）');const ids=new Set();for(const [id,vs] of Object.entries(c.enums)){if(fieldOf(id)?.type!=='enum'||!Array.isArray(vs)||vs.some(v=>typeof v!=='string'||!v.trim()||v.length>60)||new Set(vs).size!==vs.length)errors.push('补充枚举字典无效');}
const validateRule=(r,product)=>{if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)){errors.push('规则ID无效或重复');return;}ids.add(r.id);if(typeof r.name!=='string'||!r.name.trim()||r.name.length>60||typeof r.note!=='string'||r.note.length>500)errors.push('规则名称与备注格式不正确');if(!Number.isInteger(r.score)||(!product&&r.score<0))errors.push(r.name+'：基础分值需为整数，复合附加分需为非负整数');if(typeof r.enabled!=='boolean'||(product&&typeof r.veto!=='boolean'))errors.push('规则开关格式无效');if(product&&r.product!==product)errors.push('规则所属产品不一致');const err=validateTree(r.conditions,c,product);if(err)errors.push(r.name+'：'+err);if(!product&&new Set(leaves(r.conditions).map(l=>l?.product)).size<2)errors.push(r.name+'：复合规则须涉及至少2项产品/内部信息');};for(const p of c.products){if(!['sum','max'].includes(p.mode)||(p.cap!==null&&(!Number.isInteger(p.cap)||p.cap<0)))errors.push(productLabel(p.id)+'：聚合方式或封顶分无效');if(!Array.isArray(p.rules))return ['规则列表无效'];p.rules.forEach(r=>validateRule(r,p.id));}c.compounds.forEach(r=>validateRule(r,null));
if(!c.levels.length||new Set(c.levels.map(l=>l.id)).size!==c.levels.length)errors.push('等级不能为空或ID重复');c.levels.forEach((l,i)=>{if(!l.name?.trim()||!l.advice?.trim()||!/^#[0-9a-f]{6}$/i.test(l.color))errors.push('等级名称、颜色、处置建议必填');if((l.min!==null&&!Number.isInteger(l.min))||(l.max!==null&&!Number.isInteger(l.max))||(l.min!==null&&l.max!==null&&l.min>l.max))errors.push('等级区间无效');if(i===0&&l.min!==null)errors.push('首个等级下限应留空，覆盖负分');if(i>0&&(l.min===null||c.levels[i-1].max===null||l.min!==c.levels[i-1].max+1))errors.push('等级区间存在重叠、空档或顺序错误');if(i===c.levels.length-1&&l.max!==null)errors.push('最后等级上限应留空');});const high=c.levels.find(l=>l.id===c.highLevelId);if(!high||high.name!=='高风险')errors.push('必须保留一票否决对应的“高风险”等级');return [...new Set(errors)];}

// Flat editor: AND has precedence over OR. Legacy trees expand equivalently.
function treeToRows(node){
 function terms(n){if(!n.children)return [[n]];if(n.logic==='OR')return n.children.flatMap(terms);let out=[[]];for(const ch of n.children){const next=terms(ch);if(out.length*next.length>4096)throw new Error('条件组合超过4096项，请先简化原规则');out=out.flatMap(a=>next.map(b=>[...a,...b]));}return out;}

}
function rowsToTree(rows){const groups=[];for(const row of rows){if(!groups.length||row.join==='OR')groups.push([]);const leaf=cp(row);delete leaf.join;groups[groups.length-1].push(leaf);}const parts=groups.map(g=>tree(...g));return parts.length===1?parts[0]:{id:uid(),logic:'OR',children:parts};}

(() => {
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character =>
    ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'})[character]);
  const points = value => (value > 0 ? '+' : '') + value + ' 分';
  const displayProductName = name => String(name ?? '').replace(/^\d+\.\s+/, '');

  function conditionValue(value, unit) {
    return value === undefined || value === null || value === ''
      ? '—'
      : escapeHtml(value) + (unit ? ' ' + escapeHtml(unit) : '');
  }

  function evaluationRows(node, parentLogic, depth = 0) {
    if (!node) return [];
    if (node.parts) {
      if (node.parts.length === 1) return evaluationRows(node.parts[0], parentLogic, depth);
      const logic = node.logic === 'AND' ? '且' : '或';
      const groupDepth = depth + (parentLogic && parentLogic !== node.logic ? 1 : 0);
      return node.parts.flatMap((part, index) => [
        ...(index ? [{logic, depth: groupDepth}] : []),
        ...evaluationRows(part, node.logic, groupDepth)
      ]);
    }
    return [{node, depth}];
  }

  function renderConditionCells({node, logic, depth}, productNames, fields, compound) {
    const grouped = depth ? ' class="rs-nested" style="margin-inline-start:' + (depth - 1) * 12 + 'px"' : '';
    if (logic) return '<td class="rs-relation" colspan="3"><div' + grouped + '>' + logic + '</div></td>';
    if (!node) return '<td>—</td><td>—</td><td>—</td>';
    const field = fields.find(f => f.id === node.fieldId) ||
      fields.find(f => f.product === node.product && f.name === node.field);
    const unit = field?.unit;
    const threshold = node.op === 'between'
      ? (node.lowerInclusive ? '[' : '(') + conditionValue(node.value, unit) + '，' +
        conditionValue(node.upper, unit) + (node.upperInclusive ? ']' : ')')
      : escapeHtml(node.op) + ' ' + conditionValue(node.value, unit);
    const status = node.hit ? '命中' : node.raw == null || node.raw === '' ? '无可用值'
      : node.reason === '条件不满足' ? '未命中' : node.reason || '未命中';
    const source = compound ? '<small>' + escapeHtml(productNames.get(node.product) || node.product) + '</small>' : '';
    return '<td><div' + grouped + '><b>' + escapeHtml(node.field) + '</b> ' + threshold + source +
      '</div></td><td>' + conditionValue(node.raw, unit) + '</td><td class="rs-condition-status' +
      (node.hit ? ' rs-hit' : '') + '">' + escapeHtml(status) + '</td>';
  }

  function renderRow(row, productNames, fields) {
    const conditions = evaluationRows(row.eval);
    if (!conditions.length) conditions.push({});
    const span = ' rowspan="' + conditions.length + '"';
    const name = '<th scope="rowgroup"' + span + '><strong>' + escapeHtml(row.name) + '</strong>' +
      (row.compound ? '<span class="rs-label">复合规则</span>' : '') +
      (row.veto ? '<span class="rs-label rs-veto">一票否决</span>' : '') +
      (row.product ? '<small>' + escapeHtml(row.product) + '</small>' : '') +
      '</th>';
    const score = '<td class="rs-points"' + span + '>' +
      (row.contribution === null ? '—' : points(row.contribution)) +
      (row.explanation ? '<small>' + escapeHtml(row.explanation) + '</small>' : '') + '</td>';
    return '<tbody>' + conditions.map((condition, index) =>
      '<tr>' + (index === 0 ? name : '') + renderConditionCells(condition, productNames, fields, row.compound) +
      (index === 0 ? score : '') + '</tr>'
    ).join('') + '</tbody>';
  }

  function renderTable(rows, productNames, fields, adjustment = []) {
    return '<div class="rs-table-wrap"><table class="rs-table"><colgroup><col class="rs-rule-col"><col class="rs-condition-col">' +
      '<col class="rs-order-col"><col class="rs-hit-col"><col class="rs-score-col"></colgroup>' +
      '<thead><tr><th scope="col">评分规则名称</th><th scope="col">判断条件</th><th scope="col">订单情况</th>' +
      '<th scope="col">是否命中</th><th scope="col">计入分</th></tr></thead>' +
      rows.map(row => renderRow(row, productNames, fields)).join('') +
      adjustment.map(product => '<tbody><tr><th scope="row">产品封顶调整<small>' + escapeHtml(product.name) +
        '</small></th><td colspan="3">聚合 ' + points(product.before) + '，封顶后 ' + points(product.score) +
        '</td><td class="rs-points">' + points(product.score - product.before) + '</td></tr></tbody>').join('') +
      '</table></div>';
  }

  function renderReportScoreDetail(panel, snapshot) {
    const heading = '<h2 id="reportScoreHeading">风控评分</h2>';
    const result = snapshot?.result;
    if (!result) {
      panel.innerHTML = heading + '<p class="rs-empty">暂无风控评分</p>';
      return;
    }

    const productNames = new Map(result.products.map(p => [p.id, displayProductName(p.name)]));
    const fields = snapshot.scoreFields || [];
    const matched = [];
    const other = [];
    for (const product of result.products) {
      for (const rule of product.rows.filter(r => r.enabled)) {
        const row = {...rule, product: productNames.get(product.id), veto: rule.hit && rule.veto, contribution: rule.kept ? rule.score : 0,
          explanation: rule.hit ? (rule.kept ? '' : '取最高未计入，配置 ' + points(rule.score)) : '规则未命中'};
        (rule.hit ? matched : other).push(row);
      }
    }
    for (const rule of result.compounds.filter(r => r.enabled)) {
      const row = {...rule, compound: true, contribution: rule.result,
        explanation: rule.hit ? '' : '规则未命中'};
      (rule.hit ? matched : other).push(row);
    }
    for (const rule of snapshot.unavailableCompounds || []) {
      other.push({...rule, compound: true, contribution: null, explanation: '未参与：所需产品未取得有效结果'});
    }

    const adjustment = result.products.filter(p => p.before !== p.score)
      .map(p => ({...p, name: productNames.get(p.id)}));
    const rows = [...matched, ...other];
    const scoreLabel = result.complete ? '综合总分' : '当前暂定得分';
    const pending = result.pending.map(id => productNames.get(id) || id);
    const strategy = snapshot.baseName
      ? '<span class="rs-strategy">' + escapeHtml(snapshot.baseName) + '</span>'
      : '';
    panel.innerHTML = '<div class="rs-heading"><div class="rs-title">' + heading + strategy + '</div>' +
      '<div class="rs-total"><span>' + scoreLabel + '</span><strong>' + escapeHtml(result.total) +
      '</strong> 分</div></div>' +
      (pending.length ? '<p class="rs-notice">待取得有效结果：' + escapeHtml(pending.join('、')) + '</p>' : '') +
      (result.vetoes.length ? '<p class="rs-notice">一票否决：' +
        escapeHtml(result.vetoes.map(v => v.name).join('、')) + '，风险等级定为高风险。</p>' : '') +
      (rows.length || adjustment.length ? renderTable(rows, productNames, fields, adjustment) :
        '<p class="rs-empty">本次暂无评分规则明细</p>') +
      '<div class="rs-footer"><span>产品得分 <b>' + result.base + '</b></span><span>复合附加分 <b>' +
      result.extra + '</b></span><span>' + scoreLabel + ' <b>' + result.total + ' 分</b></span></div>';
  }

  window.renderReportScoreDetail = renderReportScoreDetail;
})();

function scoreFieldDefinition(field) {
  const meaning = SCORE_FIELD_MEANINGS[field.id];
  const type = {enum:'枚举',number:'数值',date:'日期'}[field.type];
  let allowed;
  if (field.type === 'enum') {
    const values = typeof config !== 'undefined' ? enumValues(field,config) : field.values;
    allowed = values.length ? '可选值为' + values.join('、') + '。支持等于、不等于。' :
      '实际枚举尚未完整维护，当前禁用。';
  } else if (field.type === 'date') {
    allowed = '填写有效日期，支持等于、不等于、大小比较和介于。日期粒度和业务时区须按接口约定。';
  } else {
    allowed = '输入' + (field.step === 1 ? '整数' : '最多两位小数') + '，最小值' + field.min +
      (field.max === null ? '，未设置最大值' : '，最大值' + field.max) +
      (field.unit ? '，单位' + field.unit : '') + '。支持等于、不等于、大小比较和介于。';
  }
  return '<section class="prd-field" data-prd-field="' + E(field.id) + '"><h4>' + E(field.name) +
    '</h4><p>' + E(meaning) + '</p><p>' + type + ' · ' +
    (field.type === 'enum' && !(typeof config !== 'undefined' ? enumValues(field,config) : field.values).length ?
      '<strong class="prd-important">' + E(allowed) + '</strong>' : E(allowed)) +
    '</p><p><strong class="prd-important">数据为空时不命中任何条件。' +
    (field.type === 'number' ? '真实0按数值0参与判断。' : '') + '</strong>' +
    '</p></section>';
}

function productFieldGuide(ids) {
  return [...new Set(ids)].map(id => {
    const product = productOf(id);
    const fields = FIELDS.filter(f => f.product === id);
    return '<details class="prd-fields"><summary>' + E(productLabel(id)) + '</summary><p>' +
      E(product?.kind === 'internal' ? '数据来自平台内部业务记录。' : '数据来自该第三方产品返回结果。') +
      '</p>' + (fields.map(scoreFieldDefinition).join('') ||
      '<p><strong class="prd-important">当前未提供可用于评分的字段，新增基础规则禁用。</strong></p>') + '</details>';
  }).join('');
}

function currentRuleFieldGuide() {
  if (typeof edit === 'undefined' || !edit) return '';
  const ids = edit.compound ? edit.rows.map(r => r.product) : [edit.data.product];
  return '<h3>四、当前产品字段释义</h3>' + productFieldGuide(ids);
}

function configuredRuleGuide() {
  const compound = tabName === 'compound';
  const rules = compound ? config.compounds : config.products.flatMap(p => p.rules);
  return rules.map(rule => {
    const product = compound ? null : config.products.find(p => p.id === rule.product);
    const score = Number.isInteger(rule.score) ? rule.score + '分' : '待填写有效整数分值';
    const note = meaningfulRuleNote(rule.note);
    return '<details class="prd-fields"><summary>' + E(rule.name) + '</summary>' +
      (compound ? '' : '<p>' + E(productLabel(rule.product)) + '</p>') +
      '<h4>命中逻辑</h4><p><strong class="prd-important">' + E(formatCond(rule.conditions,compound)) + '</strong></p>' +
      '<h4>计分结果</h4><p>' +
      (rule.enabled ? '规则启用，<strong class="prd-important">整条条件满足后' +
      (compound ? '附加' : '获得') + E(score) + '，每次计算计入一次。</strong>' :
      '<strong class="prd-important">规则已停用，当前计算跳过该规则。</strong>') +
      (product ? '该产品采用' + (product.mode === 'sum' ? '命中规则求和' : '命中规则取最高') +
        (product.cap === null ? '，封顶留空。' : '，封顶' + E(product.cap) + '分。') : '') +
      (rule.enabled && rule.veto ? '<strong class="prd-important">命中同时触发一票否决，风险等级强制为高风险。</strong>' : '') +
      '</p>' + (note ? '<h4>业务备注</h4><p>' + E(note) + '</p>' : '') + '</details>';
  }).join('') || '<p>当前尚未配置规则。</p>';
}

function scoringChanges(before,after){if(!after)return [];const out=[],value=v=>v===undefined||v===null||v===''?'（空）':v==='sum'?'命中规则求和':v==='max'?'命中规则取最高':typeof v==='boolean'?(v?'是':'否'):String(v);function fields(a,b,prefix,map){for(const [k,label] of Object.entries(map)){let x=a?.[k],y=b?.[k];if(k==='conditions'){x=x?formatCond(x,true):'';y=y?formatCond(y,true):''}if(JSON.stringify(x??null)!==JSON.stringify(y??null))out.push(prefix+' · '+label+'：'+value(x)+' → '+value(y))}}function rulesDiff(old=[],next=[],prefix){for(const id of new Set([...old,...next].map(r=>r.id))){const a=old.find(r=>r.id===id),b=next.find(r=>r.id===id);const name=prefix+' / '+(b?.name||a?.name)+' ['+id+']';if(!a)out.push(name+'：新增');if(!b)out.push(name+'：删除');fields(a,b,name,{name:'规则名称',score:'分值',note:'备注',enabled:'启用',veto:'一票否决',conditions:'判断条件'})}}
for(const p of after.products||[]){const a=before?.products?.find(x=>x.id===p.id);fields(a,p,productLabel(p.id),{mode:'聚合方式',cap:'封顶'});rulesDiff(a?.rules,p.rules,productLabel(p.id))}rulesDiff(before?.compounds,after.compounds,'复合场景加权');for(const id of new Set([...(before?.levels||[]),...(after.levels||[])].map(l=>l.id))){const a=before?.levels?.find(l=>l.id===id),b=after.levels.find(l=>l.id===id);fields(a,b,'风险等级 / '+(b?.name||a?.name),{name:'名称',min:'下限',max:'上限',advice:'处置建议',color:'标识'})}fields(before?.baseInfo,after.baseInfo,'基座基础信息',{name:'规则名称',biz:'适用业务',priority:'优先级'});if(JSON.stringify(before?.called)!==JSON.stringify(after.called))out.push('调用产品：'+(before?.called||[]).map(productLabel).join('、')+' → '+after.called.map(productLabel).join('、'));for(const id of new Set([...Object.keys(before?.enums||{}),...Object.keys(after.enums||{})]))if(JSON.stringify(before?.enums?.[id])!==JSON.stringify(after.enums?.[id]))out.push('字段字典 / '+(fieldOf(id)?.name||id)+'：'+(before?.enums?.[id]||[]).join('、')+' → '+(after.enums?.[id]||[]).join('、'));for(const k of Object.keys(BUSINESS_LABELS)){if(JSON.stringify(before?.business?.[k])!==JSON.stringify(after.business?.[k])){const one=v=>v?businessSummary({...defaultBusiness(),[k]:v}):'（未配置）';out.push('条件配置 · '+BUSINESS_LABELS[k]+'：'+one(before?.business?.[k])+' → '+one(after.business?.[k]))}}return out}

function renderEval(ev){return ev.parts?`<div class="trace"><small>${ev.logic==='AND'?'且：全部满足':'或：任一满足'} · ${ev.hit?'命中':'未命中'}</small>${ev.parts.map(renderEval).join('')}</div>`:`<p class="hint">${E(productOf(ev.product)?.name)} / ${E(ev.field)}：${E(ev.raw??'空值')} ${E(ev.op==='between'?'介于':ev.op)} ${E(ev.value)}${ev.op==='between'?' 至 '+E(ev.upper):''} → ${E(ev.reason)}</p>`}
function renderResult(){if(!testResult)return '<div class="empty result-empty"><div style="font-size:34px">◎</div><h3>准备验证评分</h3><p>选择样例或编辑字段后运行试算。<br>一票否决命中会单独标识。</p><span class="tag">不会调用真实产品接口</span></div>';const r=testResult;return `<div class="result-top ${r.vetoes.length?'veto-result':''}"><div><div class="muted">${r.vetoes.length?'保留计算分数':'风险总分'}</div><span class="big-score">${r.total}</span> 分</div><div style="text-align:right"><span class="tag" style="color:${r.level?.color};background:white">${E(r.level?.name||'未匹配')}</span><p>${E(r.level?.advice||'')}</p></div></div><p class="formula">产品得分 ${r.base} ＋ 复合附加分 ${r.extra} ＝ ${r.total}分</p>${r.vetoes.length?`<div class="veto-alert"><b>一票否决命中，最终直接定高风险</b><p>分数原本对应：${E(r.byScore?.name||'未匹配')}。强制等级不受负分、产品取高和封顶影响。</p>${r.vetoes.map(v=>`<div>${E(v.product)} / ${E(v.id)} ${E(v.name)}</div>`).join('')}</div>`:''}${r.missing?`<div class="notice orange">${r.missing}个被启用规则引用的字段为空，不参与判断。低分不代表信息完整。</div>`:''}<div class="between"><h3>计算过程</h3><button class="link" data-action="exportTrace">导出试算记录</button></div><div class="trace">${r.products.filter(p=>p.rows.length).map(p=>`<details ${p.score!==0||p.rows.some(x=>x.hit&&x.veto)?'open':''}><summary><b>${E(p.name)}</b><span class="score" style="float:right">${p.score}分</span></summary><p class="hint">${p.mode==='sum'?'命中规则求和':'命中规则取最高'} ${p.before}分 → ${p.cap===null?'无封顶':'封顶'+p.cap+'分'} → ${p.score}分</p>${p.rows.map(row=>`<details><summary>${E(row.id)} ${E(row.name)} <span class="tag ${row.hit&&row.veto?'red':row.kept?'green':''}">${row.hit&&row.veto?'一票否决命中':row.kept?'计入 '+row.score+'分':E(row.reason)}</span></summary><p class="hint">${E(row.note)}</p>${renderEval(row.eval)}</details>`).join('')}</details>`).join('')}<details open><summary><b>复合场景加权</b><span class="score" style="float:right">${r.extra}分</span></summary>${r.compounds.map(x=>`<details><summary>${E(x.name)} · ${x.hit?'命中 +'+x.result+'分':x.enabled?'未命中':'已停用'}</summary>${renderEval(x.eval)}</details>`).join('')}</details></div>`}
function renderHistory(){const b=store.bases[baseId];return `<div class="card"><h2>评分版本</h2><p class="muted">按35项产品/内部信息保存快照。新草稿不改变已发布版本，回滚生成新版本。</p><div class="table-wrap"><table><thead><tr><th>版本</th><th>时间</th><th>版本说明</th><th>基础 / 复合规则</th><th>操作</th></tr></thead><tbody>${b.versions.map((v,i)=>`<tr><td>V${i+1} ${i===b.versions.length-1?'<span class="tag green">生效</span>':''}</td><td>${v.time}</td><td>${E(v.note)}</td><td>${count(v.config)} / ${v.config.compounds.length}</td><td><button class="link" data-action="viewVersion" data-id="${i}">查看快照</button><button class="link" data-action="rollback" data-id="${i}" ${i===b.versions.length-1?'disabled':''}>回滚</button></td></tr>`).reverse().join('')||'<tr><td colspan="5" class="empty">暂无发布版本</td></tr>'}</tbody></table></div></div><div class="card"><h2>操作日志</h2>${b.logs.slice(0,50).map((l,i)=>`<div class="audit"><div class="between"><b>${E(l.action)}</b><small>${l.time} · admin</small></div><p>${E(l.detail)}</p>${l.before||l.after?`<button class="link" data-action="viewLog" data-id="${i}">查看变更前后</button>`:''}</div>`).join('')||'<div class="empty">暂无日志</div>'}</div>`}
function modal(title,body,footer='',wide=false){previousFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${E(title)}"><header><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button></header><div class="modal-body">${body}</div><footer>${footer||'<button data-action="close">关闭</button>'}</footer></section></div>`;$('#overlay button')?.focus()}
function hideModal(){$('#overlay').innerHTML='';modalType='';confirmed=null;previousFocus?.focus?.()}
function confirmDialog(title,body,fn){confirmed=fn;modal(title,`<p>${E(body)}</p>`,'<button data-action="cancelConfirm">取消</button><button class="primary" data-action="confirmAction">确认</button>')}
function closeModal(){if(confirmed){confirmed=null;if(edit){renderRuleEditor();return;}hideModal();return;}if(edit){confirmDialog('放弃规则编辑？','未保存的规则修改将被丢弃。',()=>{edit=null;hideModal()});return;}hideModal()}
function findRule(id){for(const p of config.products){const r=p.rules.find(r=>r.id===id);if(r)return {p,r};}return null}
function newId(prefix){let n=1;const ids=new Set([...rules(),...config.compounds].map(r=>r.id));while(ids.has(prefix+String(n).padStart(3,'0')))n++;return prefix+String(n).padStart(3,'0')}
function firstField(pid){return FIELDS.find(f=>f.product===pid&&available(f,config))}
function leafFor(pid){const f=firstField(pid);return f?condition(f.id,'=',f.type==='enum'?enumValues(f,config)[0]:''):{id:uid(),product:pid,field:'',op:'=',value:''}}
function openRule(id,product,compound=false){const old=compound?config.compounds.find(r=>r.id===id):findRule(id)?.r;const pid=old?.product||product||'p01';const r=old?cp(old):{id:newId(compound?'C':'R'),name:'',product:compound?undefined:pid,score:compound?1:0,note:'',enabled:true,...(!compound?{veto:false}:{}),conditions:tree(leafFor(pid))};let rows;try{rows=treeToRows(r.conditions)}catch(error){toast(error.message);return;}edit={rows,compound,data:r,oldProduct:old?.product||null,isNew:!old};renderRuleEditor()}
function syncEdit(){if(!edit||!$('#editName'))return;const r=edit.data;r.conditions=rowsToTree(edit.rows);r.name=$('#editName').value;r.note=$('#editNote').value;r.score=$('#editScore').value===''?NaN:Number($('#editScore').value);r.enabled=$('#editEnabled').checked;if(!edit.compound)r.veto=$('#editVeto').checked}
function renderRuleEditor(){modalType='rule';const r=edit.data;modal((edit.isNew?'新增':'编辑')+(edit.compound?'复合场景加权':'基础评分规则'),`<div id="ruleError"></div><div class="form-grid"><label class="field">规则名称 <span class="required">*</span><input id="editName" maxlength="60" value="${E(r.name)}" placeholder="填写清晰的命中规则名称"></label>${edit.compound?'':`<label class="field">所属产品模块 <span class="required">*</span><select id="editProduct">${PRODUCTS.map(p=>opt(p.id,p.label,r.product,!firstField(p.id))).join('')}</select></label>`}<label class="field">${edit.compound?'复合附加分':'分值'} <span class="required">*</span><input id="editScore" type="number" step="1" ${edit.compound?'min="0"':''} value="${Number.isNaN(r.score)?'':r.score}"><small>${edit.compound?'命中后在产品总分基础上叠加一次':'支持负数、0与正整数'}</small></label><label class="field wide-field">备注<textarea id="editNote" rows="2" maxlength="500" placeholder="填写业务解释、适用范围或调整原因">${E(r.note)}</textarea></label></div><div class="row wrap rule-options"><label><input id="editEnabled" type="checkbox" ${r.enabled?'checked':''}>启用此规则</label>${!edit.compound?`<label><input id="editVeto" type="checkbox" ${r.veto?'checked':''}>一票否决（命中直接定高风险）</label>`:''}</div>${!edit.compound&&r.veto?'<div class="notice orange">一票否决不受产品聚合、封顶与负分抵扣影响；仍保留命中分数与过程。</div>':''}<div class="between"><h3>判断条件配置</h3><span class="tag">${edit.compound?'先选产品，再选字段及内容':'仅所属产品的命中字段'}</span></div><p class="hint">${edit.compound?'至少涉及2项产品/内部信息；逐条选择产品及条件，通过相邻行之间的“且 / 或”连接。':'切换所属产品会清空原有条件，避免跨产品字段混用。'}</p>${renderFlatConditions()}<p class="hint">实际空值不命中任何比较；枚举仅支持等于/不等于，日期与数值支持比较及区间。</p>`,`<button data-action="close">取消</button><button class="primary" data-action="saveRule">保存规则</button>`,true)}
function renderFlatConditions(){return `<div class="flat-conditions">${edit.rows.map((n,i)=>`${i?`<div class="flat-relation"><select data-node="${n.id}" data-prop="join" aria-label="判断条件关系符">${opt('AND','且（全部满足才命中）',n.join)}${opt('OR','或（满足任一即可命中）',n.join)}</select></div>`:''}${renderNode(n)}`).join('')}<button data-action="addCondition">＋ 添加条件</button></div><p class="hint">判断顺序：先算“且”，再算“或”。例如：A 且 B 或 C，表示 A、B 同时满足，或 C 满足，即命中。</p><div class="condition-preview"><b>命中说明</b><div id="conditionPreview">${E(formatCond(rowsToTree(edit.rows),edit.compound))}</div></div>`}
function refreshConditionPreview(){const el=$('#conditionPreview');if(el&&edit)el.textContent=formatCond(rowsToTree(edit.rows),edit.compound)}
function renderNode(n){const f=fieldOf(n.field),fs=FIELDS.filter(f=>f.product===n.product);return `<div class="condition-line ${edit.compound?'compound-line':''}">${edit.compound?`<label class="condition-part product-part"><small>产品 / 内部信息</small><select data-node="${n.id}" data-prop="product" aria-label="条件所属产品">${PRODUCTS.map(p=>opt(p.id,p.label,n.product,!firstField(p.id))).join('')}</select></label>`:''}<label class="condition-part field-part"><small>可命中的条件</small><select data-node="${n.id}" data-prop="field" aria-label="命中条件字段">${fs.length?'':'<option value="">该产品未提供字段</option>'}${fs.map(f=>opt(f.id,f.name,n.field,!available(f,config))).join('')}</select></label><label class="condition-part op-part"><small>运算符</small><select data-node="${n.id}" data-prop="op" aria-label="判断条件运算符">${(f?.type==='enum'?['=','≠']:['=','≠','>','≥','<','≤','between']).map(op=>opt(op,op==='between'?'介于':op,n.op)).join('')}</select></label><div class="condition-part value-part"><small>条件内容${f?.unit?'（'+E(f.unit)+'）':''}</small>${f?inputControl(f,n.value,`data-node="${n.id}" data-prop="value"`,'选择条件内容',false):'<input disabled placeholder="请先选择字段">'}${n.op==='between'&&f?`<div class="range-extra"><span>至</span>${inputControl(f,n.upper,`data-node="${n.id}" data-prop="upper"`,'条件上限',false)}<label><input type="checkbox" data-node="${n.id}" data-prop="lowerInclusive" ${n.lowerInclusive?'checked':''}>含下限</label><label><input type="checkbox" data-node="${n.id}" data-prop="upperInclusive" ${n.upperInclusive?'checked':''}>含上限</label></div>`:''}</div><button class="link danger remove-condition" data-action="removeNode" data-id="${n.id}" aria-label="删除条件">×</button></div>${f?.notes.filter(x=>!x.startsWith('原表写')).length?`<p class="hint condition-note">${E(f.notes.filter(x=>!x.startsWith('原表写')).join(' '))}</p>`:''}`}
function findNode(id){return edit.rows.find(n=>n.id===id)}
function removeNode(id){edit.rows=edit.rows.filter(n=>n.id!==id)}
function showFields(pid){modalType='fields';const p=productOf(pid),fs=FIELDS.filter(f=>f.product===pid);modal(p.label+' · 字段与详情',`<div class="notice">来源：《副本-风控产品评分.xlsx》${E(p.source)}。基础规则只引用本产品字段，复合规则可以跨产品引用。</div>${p.notes.length?`<div class="notice orange">${p.notes.map(E).join('<br>')}</div>`:''}<div class="field-list">${fs.map(f=>`<div class="field-item"><div class="between"><b>${E(f.name)}</b><span class="tag ${available(f,config)?'green':'orange'}">${f.type==='number'?'数值':f.type==='date'?'日期':'枚举'}</span></div><p>${f.type==='enum'?E(enumValues(f,config).join(' / ')||'枚举待补充'):f.type==='date'?'日期选择，支持日期比较与区间':`单位：${E(f.unit||'无')} · ${f.step===1?'整数':'两位小数'} · ${f.min}—${f.max??'无上限'}`}</p><p>${E(f.source)} · 原表：${E(f.range)}${f.sourceUnit?' / '+E(f.sourceUnit):''}</p>${f.notes.length?`<div class="hint">${f.notes.map(E).join('<br>')}</div>`:''}${f.type==='enum'?`<button class="link" data-action="enumEdit" data-id="${f.id}">补充实际枚举值</button>`:''}</div>`).join('')||'<div class="empty">该产品未提供命中条件，不能编造字段或建立规则。</div>'}</div><h3 style="margin-top:20px">报告详情内容</h3><div class="source-details">${E(p.details==='-'?'表中明确没有详情':p.details||'表中未填写详情').replace(/\n/g,'<br>')}</div><p class="hint">详情区保留原表说明，不把姓名、证件等明细信息自动作为评分条件。</p>`,null,true)}
function validateModal(){const es=validateConfig(config);modalType='validate';modal(es.length?'配置校验未通过':'配置校验通过',es.length?`<div class="error">${es.map(E).join('<br>')}</div>`:`<div class="notice">产品归属、字段类型、枚举、区间、启停及一票否决配置均通过校验。</div><p>${count()}条基础规则、${config.compounds.length}条复合规则。当前分值仍为演示配置。</p>`);return es}
function saveDraft(){const b=store.bases[baseId],before=cp(b.draft);if(!scoringChanges(before,config).length){dirty=false;render();toast('配置未发生变化，无需重复保存');return;}b.draft=cp(config);log('保存草稿','统一评分草稿已保存，已发布机制和历史订单快照不变',before,cp(config));if(persist()){dirty=false;render();toast('草稿已保存')}}
function publishDialog(){if(validateConfig(config).length)return validateModal();modalType='publish';modal('发布评分版本',`<div class="notice">发布独立的产品评分标准。新订单采用此版本；既有订单继续使用已锁定的评分版本。仅在本地原型生效。</div><p>${count()}条基础规则 · ${rules().filter(r=>r.veto&&r.enabled).length}条启用的一票否决 · ${config.compounds.length}条复合规则</p><label class="field">版本说明<textarea id="publishNote" rows="3" placeholder="填写本次调整说明"></textarea></label>`,'<button data-action="close">取消</button><button class="primary" data-action="publishConfirm">确认发布</button>')}
function publishVersion(note,c=config){const b=store.bases[baseId],backup=cp(b),before=cp(b.live);b.live=cp(c);b.draft=cp(c);b.versions.push({time:new Date().toLocaleString('zh-CN'),note,config:cp(c)});log('发布 V'+b.versions.length,note,before,cp(c));if(persist()){config=cp(c);dirty=false;hideModal();render();toast('版本 V'+b.versions.length+' 已在原型中生效')}else store.bases[baseId]=backup;}
function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function findIssuesForValue(c){return FIELDS.filter(f=>available(f,c)&&testValues[f.id]!==undefined&&testValues[f.id]!==null&&testValues[f.id]!=='').map(f=>({f,error:valueError(f,testValues[f.id],c)})).filter(x=>x.error)}
async function action(a,id){if(orderAction(a,id))return;if(businessAction(a,id))return;const b=store.bases[baseId],found=findRule(id);switch(a){
case 'scoreEntry':scoreEntry();break;case 'enterScore':{const target=$('#scoreBase').value;hideModal();action('openScoring',target);break;}
case 'operationLogs':operationLogs();break;case 'queryLogs':logFilters={start:$('#logStart').value,end:$('#logEnd').value,actor:$('#logActor').value.trim(),action:$('#logAction').value,keyword:$('#logKeyword').value.trim()};if(logFilters.start&&logFilters.end&&logFilters.start>logFilters.end){toast('开始时间不能晚于结束时间');break;}operationLogs();break;case 'resetLogs':logFilters={start:'',end:'',actor:'',action:'',keyword:''};operationLogs();break;
case 'baseProducts':action('openBase',id);baseSection='products';render();break;
case 'baseToggle':{const rec=store.bases[id];rec.enabled=rec.enabled===false;rec.updated=new Date().toLocaleString('sv-SE');rec.logs.unshift({stamp:Date.now(),time:rec.updated,actor:'admin（原型）',module:'风控基座',action:rec.enabled?'启用':'停用',detail:'基座状态调整',changes:['状态：'+(rec.enabled?'停用 → 启用':'启用 → 停用')]});persist();render();break;}
case 'deleteBase':confirmDialog('删除风控规则','删除本地原型中的已停用基座？操作记录仍保留。',()=>{store.bases[id].deleted=true;store.bases[id].logs.unshift({stamp:Date.now(),time:new Date().toLocaleString('sv-SE'),actor:'admin（原型）',module:'风控基座',action:'删除',detail:'删除已停用的基座'});persist();hideModal();render()});break;
case 'newBase':modal('新建风控规则','<label class="field">规则名称<input id="newBaseName" maxlength="50"></label><label class="field">适用业务<select id="newBaseBiz"><option>雕马快租</option><option>雕马闪租</option></select></label>','<button data-action="close">取消</button><button class="primary" data-action="createBase">创建并配置</button>');break;
case 'createBase':{const name=$('#newBaseName').value.trim(),biz=$('#newBaseBiz').value;if(!name){toast('请填写规则名称');break;}const nb={id:'base-'+uid(),name,biz,scope:'待配置业务命中范围'};BASES.push(nb);store.customBases??=[];store.customBases.push(nb);const c=seed();c.products.forEach(p=>p.rules=[]);c.compounds=[];c.called=[];store.bases[nb.id]={draft:c,live:null,versions:[],logs:[{stamp:Date.now(),time:new Date().toLocaleString('sv-SE'),actor:'admin（原型）',module:'风控基座',action:'新增',detail:'新建规则：'+name}],enabled:false};persist();hideModal();action('openBase',nb.id);break;}

case 'baseSection':baseSection=id;render();break;case 'baseQuery':baseSearch=$('#baseSearch').value.trim();baseBiz=$('#baseBiz').value;baseStatus=$('#baseStatus').value;render();break;case 'baseReset':baseSearch='';baseBiz='';baseStatus='';render();break;
case 'tab':tabName=id;render();break;case 'back':if(dirty)confirmDialog('保存并返回基座列表？','当前修改将保存为本地草稿。',()=>{saveDraft();page='list';hideModal();render()});else{page='list';render()}break;
case 'openScoring':openGlobalScore();break;case 'openBase':if(a==='openBase')baseSection='basic';baseId=id;store.active=id;config=cp(store.bases[id].draft);dirty=false;page='editor';tabName='rules';testResult=null;persist();render();break;
case 'searchRules':search=$('#ruleSearch').value;render();break;case 'resetFilters':search='';kind='all';status='all';render();break;
case 'expand':if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();break;case 'expandAll':expanded=new Set(PRODUCTS.map(p=>p.id));render();break;case 'collapseAll':expanded.clear();search='';render();break;
case 'addRule':openRule(null,id||PRODUCTS.find(p=>firstField(p.id))?.id);break;case 'editRule':openRule(id);break;
case 'copyRule':{const r=cp(found.r);r.id=newId('R');r.name=(r.name+'（副本）').slice(0,60);found.p.rules.push(r);mark();render();toast('规则已复制');break;}
case 'deleteRule':confirmDialog('删除评分规则',`从草稿中移除“${found.r.name}”？已发布版本不变。`,()=>{found.p.rules=found.p.rules.filter(r=>r.id!==id);mark();hideModal();render()});break;
case 'ruleToggle':found.r.enabled=!found.r.enabled;mark();render();break;
case 'addCompound':openRule(null,'p01',true);break;case 'editCompound':openRule(id,null,true);break;
case 'copyCompound':{const r=cp(config.compounds.find(r=>r.id===id));r.id=newId('C');r.name=(r.name+'（副本）').slice(0,60);config.compounds.push(r);mark();render();break;}
case 'compoundToggle':{const r=config.compounds.find(r=>r.id===id);r.enabled=!r.enabled;mark();render();break;}
case 'deleteCompound':confirmDialog('删除复合规则','该规则将从当前草稿移除。',()=>{config.compounds=config.compounds.filter(r=>r.id!==id);mark();hideModal();render()});break;
case 'addCondition':syncEdit();edit.rows.push({...leafFor(edit.compound?'p01':edit.data.product),join:'AND'});renderRuleEditor();break;
case 'removeNode':syncEdit();removeNode(id);renderRuleEditor();break;
case 'saveRule':{syncEdit();const r=edit.data;let es=[];if(!r.name.trim())es.push('请填写规则名称');if(!Number.isInteger(r.score)||edit.compound&&r.score<0)es.push(edit.compound?'复合附加分需为非负整数':'分值需为整数，可为负数');const err=validateTree(r.conditions,config,edit.compound?null:r.product);if(err)es.push(err);if(edit.compound&&new Set(leaves(r.conditions).map(l=>l?.product)).size<2)es.push('复合规则至少选择两项不同产品/内部信息');if(es.length){$('#ruleError').innerHTML='<div class="error">'+es.map(E).join('<br>')+'</div>';return;}if(edit.compound){const ix=config.compounds.findIndex(x=>x.id===r.id);if(ix<0)config.compounds.push(cp(r));else config.compounds[ix]=cp(r);}else{if(edit.oldProduct)getP(edit.oldProduct).rules=getP(edit.oldProduct).rules.filter(x=>x.id!==r.id);getP(r.product).rules.push(cp(r));expanded.add(r.product);}edit=null;mark();hideModal();render();toast('规则已保存到草稿');break;}
case 'fields':showFields(id);break;
case 'searchCatalog':catalogSearch=$('#catalogSearch').value;catalogKind=$('#catalogKind').value;render();break;
case 'enumEdit':{const f=fieldOf(id);modalType='enum';modal('补充枚举 · '+f.name,`<div class="notice">只录入业务确认的实际返回值，不预设未给出的T/S完整等级。原表已有枚举不会被覆盖。</div><p>原表枚举：${E(f.values.join(' / ')||'未提供完整清单')}</p><label class="field">补充实际枚举（每行一个）<textarea id="enumValues" rows="5">${E((config.enums[id]||[]).join('\n'))}</textarea></label><div id="enumError"></div>`,`<button data-action="close">取消</button><button class="primary" data-action="saveEnum" data-id="${id}">保存枚举</button>`);break;}
case 'saveEnum':{const f=fieldOf(id),vs=[...new Set($('#enumValues').value.split('\n').map(s=>s.trim()).filter(Boolean))];if(vs.some(v=>v.length>60))return toast('枚举值不能超过60字');const old=config.enums[id];config.enums[id]=vs.filter(v=>!f.values.includes(v));const affected=[...rules(),...config.compounds].filter(r=>leaves(r.conditions).some(n=>n.field===id));if(affected.some(r=>validateTree(r.conditions,config,r.product||null))){if(old)config.enums[id]=old;else delete config.enums[id];$('#enumError').innerHTML='<div class="error">已有规则引用被移除的枚举，请先修改对应规则。</div>';return;}mark();showFields(f.product);toast('枚举字典已更新');break;}
case 'addLevel':{const last=config.levels.at(-1);let min=last.min??0;last.max=min+9;config.levels.push({id:uid(),name:'新增风险等级',min:last.max+1,max:null,color:'#8c689f',advice:'建议人工复核'});mark();render();break;}
case 'deleteLevel':confirmDialog('删除风险等级','删除后需重新校验等级区间连续性。',()=>{config.levels=config.levels.filter(l=>l.id!==id);mark();hideModal();render()});break;
case 'sample':testValues=cp(SAMPLE);testResult=null;render();break;case 'vetoSample':testValues={...cp(SAMPLE),f003:'一致',f024:0,f006:24,f076:'命中'};testResult=null;render();break;case 'emptySample':testValues={};testResult=null;render();break;
case 'calculate':{const c=activeConfig();const es=validateConfig(c);if(es.length){modal('无法试算',`<div class="error">${es.map(E).join('<br>')}</div>`);return;}const issues=findIssuesForValue(c);if(issues.length){modal('请修正试算数据',`<div class="error">${issues.map(x=>E(productLabel(x.f.product)+' / '+x.f.name+'：'+x.error)).join('<br>')}</div>`);return;}testResult=calculate(c,testValues);$('#testOutput').innerHTML=renderResult();break;}
case 'exportTrace':download('逐产品评分-试算记录.json',{prototype:true,source:testSource,config:activeConfig(),input:testValues,result:testResult});break;
case 'save':saveDraft();break;case 'validate':validateModal();break;case 'publish':publishDialog();break;
case 'publishConfirm':{const note=$('#publishNote').value.trim();if(!note)return toast('请填写版本说明');publishVersion(note);break;}
case 'viewVersion':{const v=b.versions[Number(id)];modal('V'+(Number(id)+1)+' 配置快照',`<p>${E(v.note)} · ${v.time}</p><pre class="json-view">${E(JSON.stringify(v.config,null,2))}</pre>`);break;}
case 'viewLog':{const l=b.logs[Number(id)];modal(l.action+' · 前后快照',`<div class="form-grid"><div><h3>变更前</h3><pre class="json-view">${E(JSON.stringify(l.before,null,2))}</pre></div><div><h3>变更后</h3><pre class="json-view">${E(JSON.stringify(l.after,null,2))}</pre></div></div>`,null,true);break;}
case 'rollback':confirmDialog('回滚评分版本',`用V${Number(id)+1}生成新版本并替换当前草稿，原有历史记录保留。`,()=>publishVersion('回滚至V'+(Number(id)+1),b.versions[Number(id)].config));break;
case 'export':download('风控评分配置-v2.json',{type:'risk-score-prototype',schema:2,config});toast('配置已导出');break;
case 'import':modalType='import';modal('导入逐产品评分配置','<p>仅接受本版本导出的JSON，旧9模块配置保留在旧存储中，不自动跨产品拆分。</p><input id="importFile" type="file" accept=".json,application/json"><div id="importError"></div>','<button data-action="close">取消</button><button class="primary" data-action="importConfirm">校验并导入</button>');break;
case 'importConfirm':{const f=$('#importFile').files[0];if(!f)return toast('请选择JSON配置文件');try{const d=JSON.parse(await f.text());if(d.type!=='risk-score-prototype'||d.schema!==2)throw Error('仅支持35项逐产品评分版本');const es=validateConfig(d.config);if(es.length)throw Error(es.join('；'));config=cp(d.config);mark();hideModal();render();toast('配置已导入草稿');}catch(e){$('#importError').innerHTML='<div class="error">'+E(e.message)+'</div>'}break;}
case 'flow':modal('确定性计算顺序',`<ol class="flow-list"><li>按产品读取字段，区分真实0、明确业务枚举与实际空值。</li><li>仅判断启用规则，按且 / 或及括号结构匹配；基础规则不能混用其他产品字段。</li><li>记录所有已命中的一票否决规则，独立于分值聚合保留。</li><li>每个产品按命中规则求和 / 取最高计算；无命中为0，命中的负分会保留。</li><li>应用各产品封顶；没有封顶则保留原分数。</li><li>35项产品 / 内部信息得分相加，再叠加命中的复合附加分。</li><li>按总分从上至下匹配等级。</li><li>若有一票否决命中，最终直接定为高风险；保留分数等级与命中来源。</li></ol><div class="notice">身份证侧、手机号侧按Excel各自字段配置，不相加、不自动做双侧取高。差距倍数采用传入的标准化值，原表未给出公式。</div><p class="hint">所有分值及示例阈值为原型演示，未接正式接口。旧版浏览器草稿与版本数据保留，不迁移可能跨产品的旧条件。</p>`);break;
case 'close':closeModal();break;case 'cancelConfirm':confirmed=null;if(edit)renderRuleEditor();else hideModal();break;case 'confirmAction':{const fn=confirmed;confirmed=null;fn?.();break;}
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el.dataset.id)});
function inputUpdate(el){const d=el.dataset;if(d.business&&!d.enabled&&!d.list)updateBusiness(el);if(d.baseInfo){const b=currentBase();config.baseInfo??={name:b.name,biz:b.biz,priority:BASES.indexOf(b)+1};config.baseInfo[d.baseInfo]=d.baseInfo==='priority'?Number(el.value):el.value;mark();if($('#baseNameCount'))$('#baseNameCount').textContent=config.baseInfo.name.length+'/50';}if(d.score){const r=findRule(d.score)?.r;if(r){r.score=el.value===''?NaN:Number(el.value);mark()}}if(d.product&&d.prop==='cap'){getP(d.product).cap=el.value===''?null:Number(el.value);mark()}if(d.level){const l=config.levels.find(l=>l.id===d.level);l[d.key]=['min','max'].includes(d.key)?(el.value===''?null:Number(el.value)):el.value;mark()}if(d.test){testValues[d.test]=el.value;testResult=null;$('#testOutput').innerHTML=renderResult()}if(d.node&&edit&&['value','upper'].includes(d.prop)){findNode(d.node)[d.prop]=el.value;refreshConditionPreview();}}
document.addEventListener('input',e=>inputUpdate(e.target));
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;if(d.business){updateBusiness(el);return;}inputUpdate(el);if(d.node&&edit){syncEdit();const n=findNode(d.node);if(['lowerInclusive','upperInclusive'].includes(d.prop))n[d.prop]=el.checked;else n[d.prop]=el.value;if(d.prop==='product'){const fresh=leafFor(el.value);Object.assign(n,fresh,{id:n.id});renderRuleEditor()}else if(d.prop==='field'){const f=fieldOf(el.value);n.product=f.product;n.op='=';n.value=f.type==='enum'?enumValues(f,config)[0]:'';delete n.upper;renderRuleEditor()}else if(d.prop==='op'){if(el.value==='between'){n.upper='';n.lowerInclusive=true;n.upperInclusive=false;}renderRuleEditor()}refreshConditionPreview();return;}if(el.id==='editProduct'){syncEdit();edit.data.product=el.value;edit.rows=[{...leafFor(el.value),join:'AND'}];edit.data.conditions=rowsToTree(edit.rows);renderRuleEditor();toast('已切换产品，请重新配置条件');return;}if(el.id==='editVeto'){syncEdit();renderRuleEditor();return;}if(d.product&&d.prop==='mode'){getP(d.product).mode=el.value;mark();return;}if(el.id==='kindFilter'){kind=el.value;render();return;}if(el.id==='statusFilter'){status=el.value;render();return;}if(el.id==='testSource'){testSource=el.value;testResult=null;render();return;}if(d.call){const id=d.call;if(el.checked){config.called.push(id);mark();render();return;}const used=[...rules(),...config.compounds].filter(r=>leaves(r.conditions).some(n=>n.product===id));if(used.length){el.checked=true;modal('产品仍被规则引用',`<p>先调整或删除以下规则，再取消调用。停用规则的引用仍保留。</p>${used.map(r=>`<p>• ${E(r.id)} ${E(r.name)}</p>`).join('')}`);return;}config.called=config.called.filter(x=>x!==id);mark();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML){e.preventDefault();closeModal()}if(e.key==='Tab'&&$('#overlay').innerHTML){const els=[...$('#overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.key==='Enter'&&document.activeElement?.id==='ruleSearch')action('searchRules')});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});try{if(!localStorage.getItem(KEY))persist()}catch{}

</script><script>
// Extend the existing console, condition editor and scoring engine.
delete labels.levels;
delete labels.catalog;
delete labels.test;
delete labels.history;
let phaseView = 'base';
let phaseReportNotice = '';
let phaseModalTitle = '';
const legacyAction = action;
const legacyCloseModal = closeModal;
const legacyPublishVersion = publishVersion;
const legacyRenderProduct = renderProduct;
const legacyRenderRules = renderRules;
const legacyRenderCompounds = renderCompounds;
const legacyRenderRuleEditor = renderRuleEditor;

function meaningfulRuleNote(note) {
  const text = String(note || '').trim();
  return /^交互示例[，：:]/.test(text) ? '' : text;
}

renderProduct = function(product) {
  const template = document.createElement('template');
  template.innerHTML = legacyRenderProduct(product);
  template.content.querySelector('.field-count')?.remove();
  const table = template.content.querySelector('.rule-table');
  if (table) {
    table.querySelector('thead tr').children[4].remove();
    table.querySelectorAll('tbody tr').forEach(row => {
      if (row.children.length === 6) row.children[4].remove();
      else row.querySelector('[colspan]')?.setAttribute('colspan','5');
    });
  }
  template.content.querySelectorAll('.rule-note').forEach(note => {
    const text = meaningfulRuleNote(note.textContent);
    if (!text || text === '未填写备注') note.remove();
  });
  template.content.querySelector('.product-add .hint')?.remove();
  return template.innerHTML;
};
renderRules = function() {
  return legacyRenderRules().replace(/<span class="muted">按Excel产品顺序显示[^<]*<\/span>/,'');
};
renderCompounds = function() {
  const template = document.createElement('template');
  template.innerHTML = legacyRenderCompounds();
  template.content.querySelectorAll('tbody tr td:nth-child(2) small').forEach(note => {
    if (!meaningfulRuleNote(note.textContent) || note.textContent === '未填写备注') note.remove();
  });
  return template.innerHTML;
};
renderRuleEditor = function() {
  if (edit) edit.data.note = meaningfulRuleNote(edit.data.note);
  legacyRenderRuleEditor();
};
mark = function() {
  dirty = true;
  testResult = null;
  if ($('#draftState')) $('#draftState').textContent = '有待发布调整';
  if ($('#configuredRuleGuide')) $('#configuredRuleGuide').innerHTML = configuredRuleGuide();
};

function setPhasePrd(view) {
  const prd = PHASE_PRD[view === 'scoring' && tabName === 'compound' ? 'compound' : view];
  $('#pagePrdTitle').textContent = prd.title;
  $('#pagePrdContent').innerHTML = '<div class="prd-copy">' + prd.body +
    (view === 'scoring' ? '<h3>当前配置的规则内容</h3><div id="configuredRuleGuide">' + configuredRuleGuide() +
      '</div><h3>产品判断字段释义</h3><p>展开产品可查看各字段的业务含义、数据类型、单位及可配置值。</p>' +
      productFieldGuide(PRODUCTS.map(p => p.id)) : '') + '</div>';
  document.querySelectorAll('[data-phase]').forEach(b => {
    b.classList.toggle('active', b.dataset.phase === view);
    b.setAttribute('aria-current', b.dataset.phase === view ? 'page' : 'false');
  });
  $('#phaseBreadcrumb').textContent = view === 'report' ? '订单管理 / 风控报告' :
    '全局内容 / 平台风控设置 / 风控基座' + (view === 'scoring' ? ' / 评分机制' : '');
  $('#appModule').textContent = view === 'report' ? '商城' : '运营';
}

function modalPrd(title) {
  return '<aside class="prototype-prd modal-prd"><header><h2>' + E(title) +
    ' · 弹窗说明</h2></header><div class="prd-copy">' + phaseModalCopy(title) + '</div></aside>';
}

function mountPairedModal(content, title) {
  $('#overlay').innerHTML = '<div class="review-overlay"><div class="paired-layout">' +
    content + modalPrd(title) + '</div></div>';
  phaseModalTitle = title;
  document.body.classList.add('has-review-modal');
}

modal = function(title, body, footer = '', wide = false) {
  if (!$('#overlay').innerHTML) previousFocus = document.activeElement;
  mountPairedModal('<section class="modal ' + (wide ? 'wide' : '') +
    '" role="dialog" aria-modal="true" aria-label="' + E(title) +
    '"><header><h2>' + E(title) + '</h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button>' +
    '</header><div class="modal-body">' + body + '</div><footer>' +
    (footer || '<button data-action="close">关闭</button>') + '</footer></section>', title);
  $('#overlay button')?.focus();
};
hideModal = function() {
  const wasOpen = Boolean($('#overlay').innerHTML);
  $('#overlay').innerHTML = '';
  phaseModalTitle = '';
  modalType = '';
  confirmed = null;
  document.body.classList.remove('has-review-modal');
  if (wasOpen) previousFocus?.focus?.();
};
closeModal = function() {
  if (edit) {
    edit = null;
    hideModal();
    return;
  }
  if (page === 'editor' && baseId !== GLOBAL_SCORE_ID && !edit) {
    if (phaseModalTitle !== '编辑风控规则') {
      confirmed = null;
      render();
      return;
    }
    businessAction('cancelBusiness');
    return;
  }
  legacyCloseModal();
};

function pageScoring() {
  const record = store.bases[GLOBAL_SCORE_ID];
  return '<header class="phase-page-head"><div><h1>评分机制</h1><p>按产品配置基础规则与复合加权</p></div>' +
    '<button data-phase="base">返回风控基座</button></header>' +
    '<div class="tabs phase-tabs">' + Object.entries(labels).map(([id,name]) =>
      '<button data-action="tab" data-id="' + id + '" class="' + (tabName === id ? 'on' : '') +
      '">' + name + '</button>').join('') + '</div>' +
    (tabName === 'compound' ? renderCompounds() : renderRules()) +
    '<div class="phase-score-footer"><span id="draftState">' + (dirty ? '有待发布调整' :
      record.live ? '当前生效配置' : '待发布') + '</span><div class="row">' +
    '<button class="primary" data-action="publish">发布评分机制</button></div></div>';
}

render = function() {
  if (page === 'orders' || page === 'report') {
    phaseView = 'report';
    setPhasePrd('report');
    $('#app').innerHTML = pageReport();
    paintReport();
    return;
  }
  if (page === 'editor' && baseId !== GLOBAL_SCORE_ID) {
    phaseView = 'base';
    setPhasePrd('base');
    $('#app').innerHTML = renderBases().replace(/<button data-action="orders">订单评分与报告<\/button>/, '');
    const template = document.createElement('template');
    template.innerHTML = businessForm();
    mountPairedModal(template.content.querySelector('section.original-editor').outerHTML, '编辑风控规则');
    return;
  }
  if (page === 'editor' && baseId === GLOBAL_SCORE_ID) {
    phaseView = 'scoring';
    setPhasePrd('scoring');
    $('#app').innerHTML = pageScoring();
    return;
  }
  phaseView = 'base';
  setPhasePrd('base');
  $('#app').innerHTML = renderBases().replace(/<button data-action="orders">订单评分与报告<\/button>/, '');
};

publishDialog = function() {
  const errors = validateConfig(config);
  if (errors.length) {
    modal('评分配置校验未通过', '<div class="error">' + errors.map(E).join('<br>') + '</div>');
    return;
  }
  modalType = 'publish';
  modal('发布评分机制', '<p>确认使当前调整对后续新订单生效。</p><label class="field">本次调整说明' +
    '<textarea id="publishNote" rows="3" placeholder="填写调整原因"></textarea></label>',
    '<button data-action="close">取消</button><button class="primary" data-action="publishConfirm">确认发布</button>');
};
publishVersion = function(note, c = config) {
  const previousCount = store.bases[GLOBAL_SCORE_ID].versions.length;
  legacyPublishVersion(note, c);
  const record = store.bases[GLOBAL_SCORE_ID];
  if (record.versions.length > previousCount && record.logs[0]) {
    record.logs[0].action = '发布评分机制';
    persist();
    toast('评分机制已在原型中生效');
  }
};

operationLogs = function() {
  modalType = 'operationLogs';
  const f = logFilters;
  const logs = allOperationLogs().filter(l =>
    (!f.start || l.stamp >= new Date(f.start).getTime()) &&
    (!f.end || l.stamp < new Date(f.end).getTime() + 86400000) &&
    l.actor.includes(f.actor) && (!f.action || l.module === f.action) &&
    (l.baseName + ' ' + l.detail + ' ' + JSON.stringify(l.changes)).includes(f.keyword)
  );
  const changes = l => (l.changes || []).map(c => '<p class="change">' +
    E(Array.isArray(c) ? c[0] + '：' + c[1] + ' → ' + c[2] : c) + '</p>').join('');
  modal('操作日志', '<div class="log-filter"><label>开始日期<input id="logStart" type="date" value="' + E(f.start) +
    '"></label><label>结束日期<input id="logEnd" type="date" value="' + E(f.end) +
    '"></label><label>操作人<input id="logActor" value="' + E(f.actor) + '"></label><label>动作类型<select id="logAction">' +
    ['', '评分机制', '风控基座', '订单自动评分'].map(v => opt(v, v || '全部', f.action)).join('') +
    '</select></label><label>关键字<input id="logKeyword" value="' + E(f.keyword) + '"></label>' +
    '<button class="primary" data-action="queryLogs">查询</button><button data-action="resetLogs">重置</button></div>' +
    '<div class="table-wrap"><table class="phase-logs"><thead><tr><th>操作时间</th><th>操作人</th><th>动作</th><th>规则与变更摘要</th></tr></thead>' +
    '<tbody>' + logs.map(l => '<tr><td>' + E(l.time) + '</td><td>' + E(l.actor) + '</td><td>' + E(l.action) +
      '</td><td><b>' + E(l.baseName) + '</b><p>' + E(l.detail) +
      '</p><details><summary>展开变更</summary>' + (changes(l) || '<p>操作事件，未修改字段</p>') +
      '</details></td></tr>').join('') +
    (!logs.length ? '<tr><td colspan="4" class="empty">暂无符合条件的操作记录</td></tr>' : '') +
    '</tbody></table></div>', '', true);
};

function newReportOrder(id, snapshot, responses, base) {
  return {
    id, baseName: base.live.baseInfo.name, baseId: base.id, baseVersion: base.versions.length,
    baseSnapshot: cp(base.live), scoreVersion: store.bases[GLOBAL_SCORE_ID].versions.length,
    scoringSnapshot: cp(snapshot), called: cp(base.live.called), supplemental: [],
    responses, revisions: [], matchTrace: [], biz: '雕马闪租'
  };
}

function exampleResponses(mode) {
  const values = {...cp(SAMPLE), f006:28, f003:mode === 'updated' ? '一致' : '不一致'};
  return Object.fromEntries(['p01','p02','p03','p09','p31','p32','p33','p34','p35'].map(id => [
    id, {status:mode === 'pending' && id === 'p09' ? 'pending' : 'success',
      values:Object.fromEntries(FIELDS.filter(f => f.product === id).map(f => [f.id, values[f.id] ?? '']))}
  ]));
}

function preparePhaseExamples() {
  const global = store.bases[GLOBAL_SCORE_ID];
  if (!store.phaseOneInitialized) {
    const scoring = seed();
    scoring.products.forEach(p => p.rules.forEach(r => { r.note = meaningfulRuleNote(r.note); }));
    scoring.compounds.forEach(r => { r.note = meaningfulRuleNote(r.note); });
    const network = scoring.products.find(p => p.id === 'p03').rules[0];
    network.name = '联通号码在网满 24 个月';
    network.conditions = tree(condition('f006','≥',24), condition('f007','=','联通'));
    global.draft = cp(scoring);
    global.live = cp(scoring);
    global.versions = [{config:cp(scoring), note:'原型示例配置', time:'2026-11-18 10:00:00'}];
    for (const [index,b] of BASES.entries()) {
      const c = seed();
      c.products.forEach(p => p.rules = []);
      c.compounds = [];
      c.called = ['p01','p02','p03','p09'];
      c.baseInfo = {name:b.name, biz:b.biz, priority:index+1};
      c.business = defaultBusiness();
      c.business.customer = {enabled:true, values:[b.id === 'b3' ? '企业' : '个人']};
      store.bases[b.id] = {draft:cp(c), live:cp(c), enabled:true,
        versions:[{config:cp(c), note:'现有规则示例', time:'2026-11-18 10:00:00'}], logs:[]};
    }
    store.phaseOneInitialized = true;
    const base = {...store.bases.b2,id:'b2'};
    for (const [id,mode] of [['DEMO-001','matched'],['DEMO-002','updated'],['DEMO-003','pending']]) {
      const o = newReportOrder(id,scoring,exampleResponses(mode),base);
      o.exampleLabel = {matched:'基础与复合规则命中',updated:'产品数据已更新',pending:'等待借贷产品返回'}[mode];
      store.orders.push(o);
      recalcOrder(o,'示例报告初始化');
    }
    global.logs.unshift({stamp:Date.now(),time:new Date().toLocaleString('sv-SE'),actor:'系统',
      module:'评分机制',action:'原型初始化',baseName:'统一产品评分机制',detail:'加载示例配置与脱敏订单，用于评审',
      changes:['已载入基础规则与复合规则示例']});
    persist();
  }
  selectedOrder = store.orders[0]?.id || null;
  baseId = 'b1';
  config = cp(store.bases.b1.draft);
}

function pageReport() {
  const o = activeOrder();
  return '<article class="phase-report"><header class="report-toolbar"><h1 class="report-title">风控报告</h1>' +
    '<label>示例订单<select id="phaseOrder" aria-label="选择报告订单">' +
    store.orders.map(x => opt(x.id,x.id + (x.exampleLabel ? ' · ' + x.exampleLabel : ''),selectedOrder)).join('') +
    '</select></label><button data-phase-action="newReport">按当前配置生成报告</button></header>' +
    (phaseReportNotice ? '<p class="error" role="alert">' + E(phaseReportNotice) + '</p>' : '') +
    (!o ? '<div class="empty">暂无风控报告</div>' :
    '<p class="report-meta">当前为脱敏模拟数据 · ' + E(o.id) + '</p>' +
    '<section class="report-basic"><h2>基础信息</h2><dl><div><dt>姓名</dt><dd>演示用户</dd></div>' +
    '<div><dt>年龄</dt><dd>26 岁</dd></div><div><dt>手机号</dt><dd>138****0000</dd></div>' +
    '<div><dt>手机归属地</dt><dd>—</dd></div><div><dt>身份证号</dt><dd>已脱敏</dd></div>' +
    '<div><dt>运营商</dt><dd>联通</dd></div><div><dt>户籍</dt><dd>—</dd></div>' +
    '<div><dt>定位信息</dt><dd>—</dd></div></dl></section>' +
    '<section class="report-score-detail" id="reportScoreDetail" aria-labelledby="reportScoreHeading"></section>' +
    '<h2 class="product-heading">产品风控结论</h2><div id="phaseProductResults"></div>') + '</article>';
}

function paintReport() {
  const o = activeOrder();
  if (!o) return;
  renderReportScoreDetail($('#reportScoreDetail'), orderReportPayload(o));
  const ids = [...o.called, ...o.supplemental, ...['p31','p32','p33','p34','p35'].filter(id =>
    o.scoringSnapshot.products.some(p => p.id === id && p.rules.some(r => r.enabled)) ||
    o.scoringSnapshot.compounds.some(r => r.enabled && leaves(r.conditions).some(n => n.product === id))
  )];
  $('#phaseProductResults').innerHTML = ids.map(id => {
    const response = o.responses[id];
    const score = o.result.products.find(p => p.id === id)?.score || 0;
    return '<section class="product-results"><header><div><h3>' + E(productLabel(id).replace(/^\d+\.\s+/,'')) +
      '</h3><small>' + responseStatus(response?.status) + '</small></div>' +
      '<button data-action="editOrderResult" data-id="' + id + '">更新数据</button></header><dl>' +
      FIELDS.filter(f => f.product === id).map(f =>
        '<div><dt>' + E(f.name) + '</dt><dd>' +
        E(response?.status === 'success' ? (response.values[f.id] === '' ? '—' : response.values[f.id] ?? '—') : '—') +
        (response?.status === 'success' && response.values[f.id] !== '' && response.values[f.id] != null && f.unit ? ' ' + E(f.unit) : '') +
        '</dd></div>').join('') + '</dl><p class="hint">产品得分 ' + score + ' 分</p></section>';
  }).join('');
}

function generateCurrentReport() {
  const g = store.bases[GLOBAL_SCORE_ID];
  if (!g.live) {
    phaseReportNotice = '请先发布评分机制';
    render();
    return;
  }
  const orderInput = {biz:'雕马闪租',customer:'个人',category:'手机 / 智能手机 / 单屏 / 苹果',
    value:6000,devices:0,term:'1月',quality:'95新',created:'2026-11-18T10:00:00'};
  const route = routeOrder(orderInput, BASES.map(b => ({...store.bases[b.id],id:b.id,name:b.name})));
  if (!route.base) {
    phaseReportNotice = '示例订单未命中有效风控规则，请检查业务条件和状态';
    render();
    return;
  }
  const o = newReportOrder('DEMO-' + Date.now(),g.live,exampleResponses('matched'),route.base);
  o.matchTrace = route.trace;
  o.exampleLabel = '当前生效配置';
  store.orders.unshift(o);
  selectedOrder = o.id;
  recalcOrder(o,'按当前生效配置生成示例报告');
  globalOrderLogs(o,'当前生效规则计分，生成本单报告');
  phaseReportNotice = '';
  render();
}

action = async function(a,id) {
  if (a === 'save') return;
  if (a === 'orders' || a === 'showOrderReport') {
    requestPhaseView('report');
    return;
  }
  if (a === 'back') {
    requestPhaseView('base');
    return;
  }
  if (a === 'cancelConfirm' && page === 'editor' && baseId !== GLOBAL_SCORE_ID) {
    confirmed = null;
    render();
    return;
  }
  if (a === 'tab' && !['rules','compound'].includes(id)) return;
  await legacyAction(a,id);
  if (a === 'saveRule' && !edit) toast('规则已加入待发布调整');
};

function requestPhaseView(view) {
  if (edit) syncEdit();
  const go = () => {
    edit = null;
    hideModal();
    dirty = false;
    phaseReportNotice = '';
    if (view === 'scoring') {
      openGlobalScore();
    } else {
      page = view === 'report' ? 'report' : 'list';
      if (view === 'base') {
        baseId = 'b1';
        config = cp(store.bases[baseId].draft);
      }
      if (view === 'report' && !activeOrder()) selectedOrder = store.orders[0]?.id || null;
      render();
    }
    window.scrollTo({top:0,behavior:'auto'});
  };
  if (edit || dirty) {
    confirmDialog('切换页面并放弃未发布调整？','当前未发布调整将放弃，再次进入时加载生效配置。',go);
  } else go();
}

document.addEventListener('click', e => {
  const target = e.target.closest('[data-phase],[data-phase-action]');
  if (!target) return;
  if (target.dataset.phase) requestPhaseView(target.dataset.phase);
  if (target.dataset.phaseAction === 'newReport') generateCurrentReport();
});
document.addEventListener('change', e => {
  if (e.target.id === 'phaseOrder') {
    selectedOrder = e.target.value;
    phaseReportNotice = '';
    render();
  }
});
const layout = $('#reviewLayout');
const divider = $('#reviewDivider');
function resizePrd(width) {
  const value = Math.round(Math.max(24,Math.min(40,width)));
  layout.style.setProperty('--prd-width',value + '%');
  divider.setAttribute('aria-valuenow',value);
  try { localStorage.setItem('risk-phase-one-prd-width',value); } catch {}
}
try { resizePrd(Number(localStorage.getItem('risk-phase-one-prd-width') || 30)); } catch {}
divider.addEventListener('pointerdown', e => divider.setPointerCapture(e.pointerId));
divider.addEventListener('pointermove', e => {
  if (!divider.hasPointerCapture(e.pointerId)) return;
  const bounds = layout.getBoundingClientRect();
  resizePrd((bounds.right-e.clientX)/bounds.width*100);
});
divider.addEventListener('dblclick',()=>resizePrd(30));
divider.addEventListener('keydown', e => {
  const value = Number(divider.getAttribute('aria-valuenow'));
  const values = {ArrowLeft:value+2,ArrowRight:value-2,Home:24,End:40,'0':30};
  if (Object.hasOwn(values,e.key)) {
    e.preventDefault();
    resizePrd(values[e.key]);
  }
});
$('#togglePrd').addEventListener('click', () => {
  const collapsed = layout.classList.toggle('prd-collapsed');
  $('#pagePrdContent').hidden = collapsed;
  $('#togglePrd').textContent = collapsed ? '展开' : '收起';
  $('#togglePrd').setAttribute('aria-expanded',!collapsed);
});
preparePhaseExamples();
page = 'list';
render();
if (location.hash === '#report') requestPhaseView('report');

</script>
</body></html>
